<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 900" width="560" height="900" role="img" aria-label="大動脈弓の3本の枝と腹大動脈の枝の高さの模式図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>大動脈弓の3本の枝と腹大動脈の枝の高さの模式図</title><rect width="560" height="900" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker></defs><text x="20" y="28" font-size="16" fill="#607487" font-weight="normal" text-anchor="start" >前から見た図（向かって左が体の右）</text><path d="M150,300 L150,190 C150,110 290,110 290,190 L290,780" fill="none" stroke="#cf2634" stroke-width="22" stroke-linecap="round"/><line x1="180" y1="140" x2="110" y2="72" stroke="#cf2634" stroke-width="9" stroke-linecap="round"/><line x1="222" y1="140" x2="222" y2="72" stroke="#cf2634" stroke-width="9" stroke-linecap="round"/><line x1="262" y1="140" x2="330" y2="108" stroke="#cf2634" stroke-width="9" stroke-linecap="round"/><text x="110" y="62" font-size="17" fill="#142638" font-weight="bold" text-anchor="middle" >①腕頭動脈</text><text x="222" y="48" font-size="17" fill="#142638" font-weight="bold" text-anchor="middle" >②左総頸動脈</text><text x="345" y="96" font-size="17" fill="#142638" font-weight="bold" text-anchor="start" >③左鎖骨下動脈</text><text x="20" y="150" font-size="18" fill="#cf2634" font-weight="bold" text-anchor="start" >大動脈弓</text><text x="20" y="174" font-size="15" fill="#607487" font-weight="normal" text-anchor="start" >（右から①②③）</text><text x="20" y="260" font-size="16" fill="#607487" fon