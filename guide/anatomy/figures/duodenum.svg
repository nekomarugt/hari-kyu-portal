<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 600" width="560" height="600" role="img" aria-label="十二指腸の4つの部分と乳頭（胆管・膵管の出口）の模式図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>十二指腸の4つの部分と乳頭（胆管・膵管の出口）の模式図</title><rect width="560" height="600" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker></defs><text x="20" y="28" font-size="16" fill="#607487" font-weight="normal" text-anchor="start" >前から見た図（向かって左が体の右）</text><path d="M300,210 C360,170 450,150 540,140 L545,178 C460,190 390,215 340,260 Z" fill="#f6e3a8" stroke="#c9a640" stroke-width="2"/><ellipse cx="320" cy="290" rx="78" ry="98" fill="#f6e3a8" stroke="#c9a640" stroke-width="2"/><text x="330" y="300" font-size="19" fill="#7a5a00" font-weight="bold" text-anchor="middle" >膵頭</text><text x="492" y="138" font-size="14" fill="#7a5a00" font-weight="normal" text-anchor="middle" >膵体・膵尾 →</text><path d="M420,70 L520,60 L520,100 L430,110 Z" fill="#fde2d0" stroke="#c7825a" stroke-width="2"/><text x="485" y="90" font-size="17" fill="#8a4a22" font-weight="bold" text-anchor="middle" >胃</text><path d="M430,95 L250,100 Q210,100 210,140 L210,410 Q210,450 250,450 L450,450 Q490,450 490,410 L490,260 Q490,230 520,230 L550,230" fill="none" stroke="#c7825a" stroke-width="40" stroke-linejoin="round"/><path d="M430,95 L250,100 Q210,100 210,140 L210,410 Q210,450 250,450 L450,450 Q490,450 490,410 L490,260 Q490,230 520,230 L550,230" fill="none" stroke="#fde2d0" stroke-width="33" stroke-linejoin="round"/><line x1="428" y1="80" x2="428" y2="112" stroke="#073b6a" stroke-width="4"/><text x="410" y="136" font-size="14" fill="#607487" font-weight="normal" text-anchor="middle" >幽門</text><circle cx="330" cy="106" r="14" fill="#8a4a22"/><text x="330" y="112" font-size="17" fill="#fff" font-weight="bold" text-anchor="middle" >1</text><circle cx="210" cy="330" r="14" fill="#8a4a22"/><text x="210" y="336" font-size="17" fill="#fff" font-weight="bold" text-anchor="middle" >2</text><circle cx="350" cy="456" r="14" fill="#8a4a22"/><text x="350" y="462" font-size="17" fill="#fff" font-weight="bold" text-anchor="middle" >3</text><circle cx="490" cy="350" r="14" fill="#8a4a22"/><text x="490" y="356" font-size="17" fill="#fff" font-weight="bold" text-anchor="middle" >4</text><text x="538" y="262" font-size="14" fill="#607487" font-weight="normal" text-anchor="end" >空腸へ</text><path d="M300,40 L300,120 C295,190 260,250 232,300" fill="none" stroke="#2e8b57" stroke-width="7" stroke-linecap="round"/><text x="290" y="52" font-size="16" fill="#2e8b57" font-weight="bold" text-anchor="end" >総胆管</text><text x="290" y="72" font-size="13" fill="#2e8b57" font-weight="normal" text-anchor="end" >（肝臓・胆嚢から）</text><path d="M540,160 C460,175 380,210 340,270 C310,300 270,305 232,305" fill="none" stroke="#b77a00" stroke-width="5" stroke-linecap="round"/><path d="M320,245 C290,245 260,250 232,258" fill="none" stroke="#b77a00" stroke-width="3.5" stroke-dasharray="6 4"/><circle cx="230" cy="304" r="9" fill="#cf2634"/><circle cx="230" cy="258" r="6" fill="#6a4fb3"/><polyline points="222,304 150,330" fill="none" stroke="#cf2634" stroke-width="2" stroke-linejoin="round"/><polyline points="224,258 150,232" fill="none" stroke="#6a4fb3" stroke-width="2" stroke-linejoin="round"/><text x="20" y="226" font-size="15" fill="#6a4fb3" font-weight="bold" text-anchor="start" >小十二指腸乳頭</text><text x="20" y="246" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >＝副膵管</text><text x="20" y="336" font-size="15" fill="#cf2634" font-weight="bold" text-anchor="start" >大十二指腸乳頭</text><text x="20" y="356" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >（ファーター乳頭）</text><text x="20" y="376" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >＝総胆管＋主膵管</text><text x="20" y="396" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >オッディ括約筋</text><text x="20" y="506" font-size="18" fill="#8a4a22" font-weight="bold" text-anchor="start" >1 上部 → 2 下行部 → 3 水平部 → 4 上行部</text><text x="20" y="532" font-size="17" fill="#142638" font-weight="normal" text-anchor="start" >→ 十二指腸空腸曲（トライツ靱帯）→ 空腸</text><text x="20" y="562" font-size="16" fill="#607487" font-weight="normal" text-anchor="start" >膵頭を「C」の字に囲む。十二指腸は腹膜後器官</text></svg>