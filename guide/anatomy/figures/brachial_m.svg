<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
<rect width="640" height="460" fill="#fff"/>
<text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">腕神経叢は「マクドナルドのM」で覚える</text>
<rect x="20" y="60" width="270" height="330" rx="10" fill="#e6e6e6"/>
<text x="155" y="84" text-anchor="middle" font-size="13" fill="#666">根・幹・部（鎖骨まわり）</text>
<g stroke="#aaa" stroke-width="5" fill="none" stroke-linecap="round">
<path d="M60 120 L150 160 L250 150"/><path d="M60 170 L150 160"/><path d="M60 220 L150 225 L250 225"/><path d="M60 270 L150 290 L250 300"/><path d="M60 320 L150 290"/>
</g>
<g font-size="13" fill="#777"><text x="30" y="125">C5</text><text x="30" y="175">C6</text><text x="30" y="225">C7</text><text x="30" y="275">C8</text><text x="30" y="325">T1</text></g>
<text x="155" y="372" text-anchor="middle" font-size="12" fill="#666">試験はここより先の</text>
<text x="155" y="388" text-anchor="middle" font-size="12" fill="#666">M＋後ろで足りることが多い</text>
<g stroke="#8aa6c8" stroke-width="5" fill="none" stroke-dasharray="9 6" stroke-linecap="round">
<path d="M250 225 L330 225"/><path d="M330 225 L470 180"/><path d="M330 225 L560 270"/>
</g>
<g font-size="15" fill="#5a7aa0"><text x="476" y="176">腋窩神経（後ろ）</text><text x="480" y="296">橈骨神経（後ろ）</text><text x="258" y="245" font-size="12">後神経束</text></g>
<g stroke="#e0402a" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M250 150 L330 160"/><path d="M250 300 L330 290"/>
<path d="M560 90 L330 160 L420 225 L330 290 L560 370"/><path d="M420 225 L590 225"/>
</g>
<g font-size="16" font-weight="bold" fill="#c0281a"><text x="470" y="88">① 筋皮神経</text><text x="500" y="218">② 正中神経</text><text x="470" y="395">③ 尺骨神経</text></g>
<g font-size="12" fill="#c0281a"><text x="250" y="140">外側神経束</text><text x="250" y="322">内側神経束</text></g>
<text x="320" y="430" text-anchor="middle" font-size="13" fill="#333">赤＝前のM（筋皮・正中・尺骨）／青点線＝後ろ（後神経束→腋窩・橈骨）</text>
<text x="320" y="450" text-anchor="middle" font-size="12" fill="#333">正中神経は外側束と内側束の2本が合流してできる＝Mの真ん中の谷</text>
</svg>
