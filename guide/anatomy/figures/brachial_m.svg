<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
<rect width="640" height="460" fill="#fff"/>
<text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">腕神経叢は「マクドナルドのM」で覚える</text>
<g transform="translate(320 225) rotate(-10) scale(0.88) translate(-320 -225)">
<rect x="350" y="60" width="270" height="330" rx="10" fill="#e6e6e6"/>
<text x="485" y="84" text-anchor="middle" font-size="13" fill="#666">根・幹・部（鎖骨まわり）</text>
<g stroke="#aaa" stroke-width="5" fill="none" stroke-linecap="round">
<path d="M580 120 L490 160 L390 150"/><path d="M580 170 L490 160"/><path d="M580 220 L490 225 L390 225"/><path d="M580 270 L490 290 L390 300"/><path d="M580 320 L490 290"/>
</g>
<g font-size="13" fill="#777"><text x="585" y="125">C5</text><text x="585" y="175">C6</text><text x="585" y="225">C7</text><text x="585" y="275">C8</text><text x="585" y="325">T1</text></g>
<text x="485" y="372" text-anchor="middle" font-size="12" fill="#666">試験はここより先の</text>
<text x="485" y="388" text-anchor="middle" font-size="12" fill="#666">M＋後ろで足りることが多い</text>
<g stroke="#8aa6c8" stroke-width="5" fill="none" stroke-dasharray="9 6" stroke-linecap="round">
<path d="M390 225 L310 225"/><path d="M310 225 L170 180"/><path d="M310 225 L80 270"/>
</g>
<g font-size="15" fill="#5a7aa0"><text x="164" text-anchor="end" y="176">腋窩神経（後ろ）</text><text x="160" text-anchor="end" y="296">橈骨神経（後ろ）</text><text x="382" text-anchor="end" y="245" font-size="12">後神経束</text></g>
<g stroke="#e0402a" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M390 150 L310 160"/><path d="M390 300 L310 290"/>
<path d="M80 90 L310 160 L220 225 L310 290 L80 370"/><path d="M220 225 L50 225"/>
</g>
<g font-size="16" font-weight="bold" fill="#c0281a"><text x="170" text-anchor="end" y="88">① 筋皮神経</text><text x="140" text-anchor="end" y="218">② 正中神経</text><text x="170" text-anchor="end" y="395">③ 尺骨神経</text></g>
<g font-size="12" fill="#c0281a"><text x="390" text-anchor="end" y="140">外側神経束</text><text x="390" text-anchor="end" y="322">内側神経束</text></g>
</g>
<text x="320" y="430" text-anchor="middle" font-size="13" fill="#333">赤＝前のM（筋皮・正中・尺骨）／青点線＝後ろ（後神経束→腋窩・橈骨）</text>
<text x="320" y="450" text-anchor="middle" font-size="12" fill="#333">正中神経は外側束と内側束の2本が合流してできる＝Mの真ん中の谷</text>
</svg>
