<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 530" width="560" height="530" role="img" aria-label="刺激伝導系の順番の模式図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>刺激伝導系の順番の模式図</title><rect width="560" height="530" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker></defs><rect x="90" y="20" width="450" height="66" rx="10" fill="#fdecee" stroke="#cf2634" stroke-width="2"/><text x="315.0" y="50.0" font-size="22" fill="#9c1c26" font-weight="bold" text-anchor="middle" >洞房結節</text><text x="315.0" y="71.0" font-size="16" fill="#142638" font-weight="normal" text-anchor="middle" >右心房・上大静脈の入口付近　ペースメーカー</text><line x1="315" y1="88" x2="315" y2="114" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><rect x="90" y="116" width="450" height="66" rx="10" fill="#fdecee" stroke="#cf2634" stroke-width="2"/><text x="315.0" y="146.0" font-size="22" fill="#9c1c26" font-weight="bold" text-anchor="middle" >房室結節</text><text x="315.0" y="167.0" font-size="16" fill="#142638" font-weight="normal" text-anchor="middle" >右心房・心房中隔の下部　ここで少し遅らせる</text><line x1="315" y1="184" x2="315" y2="210" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><rect x="90" y="212" width="450" height="66" rx="10" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2"/><text x="315.0" y="242.0" font-size="22" fill="#073b6a" font-weight="bold" text-anchor="middle" >ヒス束</text><text x="315.0" y="263.0" font-size="16" fill="#142638" font-weight="normal" text-anchor="middle" >心房から心室へ伝える唯一の道</text><line x1="315" y1="280" x2="315" y2="306" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><rect x="90" y="308" width="450" height="66" rx="10" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2"/><text x="315.0" y="338.0" font-size="22" fill="#073b6a" font-weight="bold" text-anchor="middle" >右脚・左脚</text><text x="315.0" y="359.0" font-size="16" fill="#142638" font-weight="normal" text-anchor="middle" >心室中隔を下る</text><line x1="315" y1="376" x2="315" y2="402" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><rect x="90" y="404" width="450" height="66" rx="10" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2"/><text x="315.0" y="434.0" font-size="22" fill="#073b6a" font-weight="bold" text-anchor="middle" >プルキンエ線維</text><text x="315.0" y="455.0" font-size="16" fill="#142638" font-weight="normal" text-anchor="middle" >心室の筋全体へ広がる</text><path d="M78,22 h-12 v160 h12" fill="none" stroke="#cf2634" stroke-width="3"/><text x="40" y="78" font-size="20" fill="#cf2634" font-weight="bold" text-anchor="middle" >右</text><text x="40" y="104" font-size="20" fill="#cf2634" font-weight="bold" text-anchor="middle" >心</text><text x="40" y="130" font-size="20" fill="#cf2634" font-weight="bold" text-anchor="middle" >房</text><path d="M78,214 h-12 v278 h12" fill="none" stroke="#0b5ea8" stroke-width="3"/><text x="40" y="330" font-size="20" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >心</text><text x="40" y="356" font-size="20" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >室</text><text x="40" y="382" font-size="20" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >へ</text></svg>