<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="560" height="560" role="img" aria-label="胆汁と膵液の通り道の模式図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>胆汁と膵液の通り道の模式図</title><rect width="560" height="560" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker></defs><text x="20" y="28" font-size="17" fill="#607487" font-weight="normal" text-anchor="start" >胆汁（緑）と膵液（黄）の通り道</text><rect x="40" y="48" width="150" height="48" rx="10" fill="#e5f5ec" stroke="#2e8b57" stroke-width="2"/><text x="115.0" y="78.84" font-size="19" fill="#1d5e3a" font-weight="bold" text-anchor="middle" >右肝管</text><rect x="230" y="48" width="150" height="48" rx="10" fill="#e5f5ec" stroke="#2e8b57" stroke-width="2"/><text x="305.0" y="78.84" font-size="19" fill="#1d5e3a" font-weight="bold" text-anchor="middle" >左肝管</text><rect x="120" y="136" width="180" height="50" rx="10" fill="#e5f5ec" stroke="#2e8b57" stroke-width="2"/><text x="210.0" y="168.2" font-size="20" fill="#1d5e3a" font-weight="bold" text-anchor="middle" >総肝管</text><rect x="370" y="136" width="170" height="76" rx="10" fill="#e5f5ec" stroke="#2e8b57" stroke-width="2"/><text x="455.0" y="171.0" font-size="20" fill="#1d5e3a" font-weight="bold" text-anchor="middle" >胆嚢</text><text x="455.0" y="191.0" font-size="15" fill="#142638" font-weight="normal" text-anchor="middle" >濃縮して貯める</text><rect x="120" y="236" width="180" height="50" rx="10" fill="#e5f5ec" stroke="#2e8b57" stroke-width="2"/><text x="210.0" y="268.2" font-size="20" fill="#1d5e3a" font-weight="bold" text-anchor="middle" >総胆管</text><rect x="370" y="236" width="170" height="50" rx="10" fill="#e5f5ec" stroke="#2e8b57" stroke-width="2"/><text x="455.0" y="267.84" font-size="19" fill="#1d5e3a" font-weight="bold" text-anchor="middle" >胆嚢管</text><rect x="370" y="330" width="170" height="50" rx="10" fill="#fff4d6" stroke="#b77a00" stroke-width="2"/><text x="455.0" y="361.84" font-size="19" fill="#7a4b00" font-weight="bold" text-anchor="middle" >主膵管</text><rect x="40" y="330" width="300" height="72" rx="10" fill="#fdecee" stroke="#cf2634" stroke-width="2"/><text x="190.0" y="363.0" font-size="21" fill="#9c1c26" font-weight="bold" text-anchor="middle" >大十二指腸乳頭</text><text x="190.0" y="383.0" font-size="15" fill="#142638" font-weight="normal" text-anchor="middle" >十二指腸の下行部に開く</text><line x1="115" y1="98" x2="170" y2="134" stroke="#2e8b57" stroke-width="3" marker-end="url(#ah)"/><line x1="305" y1="98" x2="250" y2="134" stroke="#2e8b57" stroke-width="3" marker-end="url(#ah)"/><line x1="210" y1="188" x2="210" y2="234" stroke="#2e8b57" stroke-width="3" marker-end="url(#ah)"/><line x1="455" y1="216" x2="455" y2="232" stroke="#2e8b57" stroke-width="3" marker-start="url(#ah)" marker-end="url(#ah)"/><line x1="368" y1="260" x2="304" y2="238" stroke="#2e8b57" stroke-width="3" marker-end="url(#ah)"/><line x1="210" y1="288" x2="190" y2="328" stroke="#2e8b57" stroke-width="3" marker-end="url(#ah)"/><line x1="368" y1="355" x2="342" y2="355" stroke="#b77a00" stroke-width="3" marker-end="url(#ah)"/><text x="40" y="440" font-size="17" fill="#142638" font-weight="bold" text-anchor="start" >胆汁は肝臓でつくられ、胆嚢で濃くして貯める</text><text x="40" y="470" font-size="15.5" fill="#142638" font-weight="normal" text-anchor="start" >胆嚢管は十二指腸に直接開かない（総肝管と合流して総胆管）</text><text x="40" y="500" font-size="15.5" fill="#142638" font-weight="normal" text-anchor="start" >出口の弁＝オッディ括約筋</text><text x="40" y="530" font-size="15.5" fill="#607487" font-weight="normal" text-anchor="start" >副膵管は小十二指腸乳頭に開く</text></svg>