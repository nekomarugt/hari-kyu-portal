<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" width="1100" height="400" font-family="Noto Sans JP, sans-serif"><rect width="1100" height="400" fill="#fff"/><text x="550.0" y="34" font-size="26" font-weight="700" text-anchor="middle">髄節と筋（上肢の運動）― 野球の優勝シーンで覚える</text><rect x="10" y="50" width="210" height="340" rx="10" fill="#fafafa" stroke="#222" stroke-width="3"/><text x="24" y="80" font-size="26" font-weight="700" fill="#EE0000">C5</text><text x="115" y="345" font-size="18" font-weight="700" text-anchor="middle" fill="#EE0000">肩の外転</text><text x="115" y="372" font-size="13" text-anchor="middle">三角筋・上腕二頭筋の一部</text><rect x="228" y="50" width="210" height="340" rx="10" fill="#fafafa" stroke="#222" stroke-width="3"/><text x="242" y="80" font-size="26" font-weight="700" fill="#EE0000">C6</text><text x="333" y="345" font-size="18" font-weight="700" text-anchor="middle" fill="#EE0000">肘の屈曲・回外</text><text x="333" y="372" font-size="13" text-anchor="middle">上腕二頭筋・腕橈骨筋・手根伸筋</text><rect x="446" y="50" width="210" height="340" rx="10" fill="#fafafa" stroke="#222" stroke-width="3"/><text x="460" y="80" font-size="26" font-weight="700" fill="#EE0000">C7</text><text x="551" y="345" font-size="18" font-weight="700" text-anchor="middle" fill="#EE0000">肘の伸展・手関節掌屈</text><text x="551" y="372" font-size="13" text-anchor="middle">上腕三頭筋・手根屈筋</text><rect x="664" y="50" width="210" height="340" rx="10" fill="#fafafa" stroke="#222" stroke-width="3"/><text x="678" y="80" font-size="26" font-weight="700" fill="#EE0000">C8</text><text x="769" y="345" font-size="18" font-weight="700" text-anchor="middle" fill="#EE0000">手指の屈曲</text><text x="769" y="372" font-size="13" text-anchor="middle">手指屈筋群</text><rect x="882" y="50" width="210" height="340" rx="10" fill="#fafafa" stroke="#222" stroke-width="3"/><text x="896" y="80" font-size="26" font-weight="700" fill="#EE0000">T1</text><text x="987" y="345" font-size="18" font-weight="700" text-anchor="middle" fill="#EE0000">指の動き</text><te