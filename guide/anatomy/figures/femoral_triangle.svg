<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="560" height="560" role="img" aria-label="大腿三角の境界と中身の並びの模式図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>大腿三角の境界と中身の並びの模式図</title><rect width="560" height="560" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker></defs><text x="20" y="30" font-size="17" fill="#607487" font-weight="normal" text-anchor="start" >右の太ももを前から見た図（模式）</text><text x="24" y="62" font-size="18" fill="#0b5ea8" font-weight="bold" text-anchor="start" >← 外側</text><text x="536" y="62" font-size="18" fill="#0b5ea8" font-weight="bold" text-anchor="end" >内側 →</text><polygon points="70,130 490,130 300,470" fill="#fbfdff" stroke="none"/><line x1="70" y1="130" x2="490" y2="130" stroke="#073b6a" stroke-width="6" stroke-linecap="round"/><line x1="70" y1="130" x2="318" y2="510" stroke="#d98b8b" stroke-width="22" stroke-linecap="round" opacity=".85"/><line x1="490" y1="130" x2="290" y2="500" stroke="#c9a3d6" stroke-width="22" stroke-linecap="round" opacity=".85"/><text x="280" y="114" font-size="19" fill="#073b6a" font-weight="bold" text-anchor="middle" >鼠径靱帯（上の辺）</text><text x="60" y="330" font-size="20" fill="#a23b3b" font-weight="bold" text-anchor="start" >縫工筋</text><text x="60" y="354" font-size="16" fill="#607487" font-weight="normal" text-anchor="start" >（外側の辺）</text><text x="500" y="330" font-size="20" fill="#6a4fb3" font-weight="bold" text-anchor="end" >長内転筋</text><text x="500" y="354" font-size="16" fill="#607487" font-weight="normal" text-anchor="end" >（内側の辺）</text><path d="M200,136 C200,260 283.0,380 291.84,440" fill="none" stroke="#d9a400" stroke-width="7" stroke-linecap="round"/><rect x="173.0" y="183" width="54.0" height="26" rx="13" fill="#d9a400"/><text x="200" y="202.48" font-size="18" fill="#3d2a00" font-weight="bold" text-anchor="middle" >神経</text><path d="M268,136 C268,260 300.0,380 300.0,440" fill="none" stroke="#cf2634" stroke-width="10" stroke-linecap="round"/><rect x="241.0" y="183" width="54.0" height="26" rx="13" fill="#cf2634"/><text x="268" y="202.48" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle" >動脈</text><path d="M336,136 C336,260 317.0,380 308.16,440" fill="none" stroke="#0b5ea8" stroke-width="12" stroke-linecap="round"/><rect x="309.0" y="183" width="54.0" height="26" rx="13" fill="#0b5ea8"/><text x="336" y="202.48" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle" >静脈</text><text x="300" y="510" font-size="19" fill="#142638" font-weight="bold" text-anchor="middle" >中身は外側から 神経・動脈・静脈（N・A・V）</text><text x="300" y="540" font-size="17" fill="#607487" font-weight="normal" text-anchor="middle" >＝内側から 静脈・動脈・神経（V・A・N）</text></svg>