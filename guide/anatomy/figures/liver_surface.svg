80,552 300,572 C200,597 90,602 55,572 C35,542 32,507 40,472 Z" fill="#e8c4b8" stroke="#9a5a4a" stroke-width="2.2" /><path d="M70,460 C120,432 200,430 250,440 C255,462 250,487 235,502 C180,507 120,500 70,472 Z" fill="#f4ead2" stroke="#8a6d2f" stroke-width="2.4" stroke-dasharray="5 3"/><ellipse cx="225" cy="460" rx="15" ry="11" fill="#9fb8d8" stroke="#0b5ea8" stroke-width="2"/><path d="M330,445 C400,454 470,470 515,498" fill="none" stroke="#8a6d2f" stroke-width="2.4" /><circle cx="68" cy="467" r="5" fill="#8a6d2f"/><path d="M290,572 C292,522 296,482 300,442" fill="none" stroke="#4a6fa5" stroke-width="3" /><text x="145" y="480" font-size="17" fill="#7a5a00" font-weight="bold" text-anchor="middle">無漿膜野</text><text x="150" y="562" font-size="20" fill="#6b3a2e" font-weight="bold" text-anchor="middle">右葉</text><text x="410" y="532" font-size="20" fill="#6b3a2e" font-weight="bold" text-anchor="middle">左葉</text><line x1="225" y1="460" x2="300" y2="406" stroke="#607487" stroke-width="1.4" /><circle cx="225" cy="460" r="2.5" fill="#607487"/><text x="304" y="411" font-size="15" fill="#0b5ea8" font-weight="bold" text-anchor="start">下大静脈</text><line x1="68" y1="467" x2="60" y2="626" stroke="#607487" stroke-width="1.4" /><circle cx="68" cy="467" r="2.5" fill="#607487"/><text x="64" y="631" font-size="15" fill="#142638" font-weight="normal" text-anchor="start">右三角間膜</text><line x1="470" y1="474" x2="385" y2="592" stroke="#607487" stroke-width="1.4" /><circle cx="470" cy="474" r="2.5" fill="#607487"/><text x="381" y="597" font-size="15" fill="#142638" font-weight="normal" text-anchor="end">左三角間膜</text><line x1="245" y1="494" x2="250" y2="626" stroke="#607487" stroke-width="1.4" /><circle cx="245" cy="494" r="2.5" fill="#607487"/><text x="254" y="631" font-size="15" fill="#142638" font-weight="normal" text-anchor="start">冠状間膜（無漿膜野のふち）</text><line x1="292" y1="537" x2="360" y2="567" stroke="#607487" stroke-width="1.4" /><circle cx="292" cy="537" r="2.5" fill="#607487"/><text x="364" y="572" font-size="15" fill="#4a6fa5" font-weight="normal" text-anchor="start">肝鎌状間膜</text><text x="20" y="658" font-size="13" fill="#142638" font-weight="normal" text-anchor="start">無漿膜野＝腹膜におおわれず横隔膜にじかに接する所。まわりを冠状間膜が囲む</text><line x1="490" y1="592" x2="490" y2="576" stroke="#607487" stroke-width="1.6" marker-end="url(#ah)"/><line x1="490" y1="592" x2="490" y2="608" stroke="#607487" stroke-width="1.6" marker-end="url(#ah)"/><line x1="490" y1="592" x2="474" y2="592" stroke="#607487" stroke-width="1.6" marker-end="url(#ah)"/><line x1="490" y1="592" x2="506" y2="592" stroke="#607487" stroke-width="1.6" marker-end="url(#ah)"/><text x="490" y="571" font-size="12" fill="#607487" font-weight="normal" text-anchor="middle">後（背中）</text><text x="490" y="623" font-size="12" fill="#607487" font-weight="normal" text-anchor="middle">前（お腹）</text><text x="470" y="596" font-size="12" fill="#607487" font-weight="normal" text-anchor="end">体の右</text><text x="510" y="596" font-size="12" fill="#607487" font-weight="normal" text-anchor="start">体の左</text><text x="490" y="640" font-size="12" fill="#0b5ea8" font-weight="normal" text-anchor="middle"></text><rect x="10" y="674" width="540" height="30" rx="8" fill="#e4effa"/><text x="22" y="695" font-size="17" fill="#073b6a" font-weight="bold" text-anchor="start">③ 下から見た図（臓側面）</text><text x="540" y="694" font-size="13" fill="#607487" font-weight="normal" text-anchor="end">肝臓を下からのぞき上げる</text><path d="M40,778 C70,733 230,723 300,738 C390,748 480,773 520,808 C470,843 380,868 300,893 C200,923 90,933 55,898 C35,858 32,818 40,778 Z" fill="#e8c4b8" stroke="#9a5a4a" stroke-width="2.2" /><rect x="211" y="736" width="28" height="58" rx="12" fill="#9fb8d8" stroke="#0b5ea8" stroke-width="2"/><path d="M212,848 C205,878 208,913 225,923 C242,913 246,878 238,848 Z" fill="#b9d7a8" stroke="#4f7a3a" stroke-width="2"/><path d="M292,740 L286,806" fill="none" stroke="#6b3a2e" stroke-width="4" /><path d="M286,840 L282,908" fill="none" stroke="#4a6fa5" stroke-width="4" /><rect x="232" y="810" width="62" height="26" rx="6" fill="#f7efe0" stroke="#6b3a2e" stroke-width="2"/><circle cx="246" cy="823" r="6" fill="#c0392b"/><circle cx="263" cy="823" r="6" fill="#4a6fa5"/><circle cx="280" cy="823" r="6" fill="#4f7a3a"/><line x1="225" y1="933" x2="225" y2="726" stroke="#c0392b" stroke-width="2.4" stroke-dasharray="7 5"/><text x="258" y="778" font-size="14" fill="#6b3a2e" font-weight="bold" text-anchor="middle">尾状葉</text><text x="258" y="883" font-size="14" fill="#6b3a2e" font-weight="bold" text-anchor="middle">方形葉</text><text x="110" y="828" font-size="20" fill="#6b3a2e" font-weight="bold" text-anchor="middle">右葉</text><text x="440" y="798" font-size="20" fill="#6b3a2e" font-weight="bold" text-anchor="middle">左葉</text><line x1="225" y1="748" x2="120" y2="728" stroke="#607487" stroke-width="1.4" /><circle cx="225" cy="748" r="2.5" fill="#607487"/><text x="116" y="733" font-size="15" fill="#0b5ea8" font-weight="bold" text-anchor="end">下大静脈</text><line x1="290" y1="758" x2="350" y2="736" stroke="#607487" stroke-width="1.4" /><circle cx="290" cy="758" r="2.5" fill="#607487"/><text x="354" y="741" font-size="15" fill="#142638" font-weight="normal" text-anchor="start">静脈管索（の裂）</text><line x1="294" y1="823" x2="350" y2="793" stroke="#607487" stroke-width="1.4" /><circle cx="294" cy="823" r="2.5" fill="#607487"/><text x="354" y="798" font-size="15" fill="#142638" font-weight="bold" text-anchor="start">肝門</text><line x1="284" y1="888" x2="350" y2="923" stroke="#607487" stroke-width="1.4" /><circle cx="284" cy="888" r="2.5" fill="#607487"/><text x="354" y="928" font-size="15" fill="#4a6fa5" font-weight="normal" text-anchor="start">肝円索（の裂）</text><line x1="222" y1="903" x2="150" y2="940" stroke="#607487" stroke-width="1.4" /><circle cx="222" cy="903" r="2.5" fill="#607487"/><text x="146" y="945" font-size="15" fill="#4f7a3a" font-weight="bold" text-anchor="end">胆嚢（胆嚢窩）</text><text x="330" y="956" font-size="13" fill="#c0392b" font-weight="bold" text-anchor="start">肝門の中：●固有肝動脈</text><text x="330" y="974" font-size="13" fill="#4a6fa5" font-weight="bold" text-anchor="start">●門脈</text><text x="390" y="974" font-size="13" fill="#4f7a3a" font-weight="bold" text-anchor="start">●総肝管</text><line x1="225" y1="928" x2="150" y2="966" stroke="#607487" stroke-width="1.4" /><circle cx="225" cy="928" r="2.5" fill="#607487"/><text x="146" y="971" font-size="15" fill="#c0392b" font-weight="bold" text-anchor="end">カントリー線</text><line x1="490" y1="868" x2="490" y2="852" stroke="#607487" stroke-width="1.6" marker-end="url(#ah)"/><line x1="490" y1="868" x2="490" y2="884" stroke="#607487" stroke-width="1.6" marker-end="url(#ah)"/><line x1="490" y1="868" x2="474" y2="868" stroke="#607487" stroke-width="1.6" marker-end="url(#ah)"/><line x1="490" y1="868" x2="506" y2="868" stroke="#607487" stroke-width="1.6" marker-end="url(#ah)"/><text x="490" y="847" font-size="12" fill="#607487" font-weight="normal" text-anchor="middle">後（背中）</text><text x="490" y="899" font-size="12" fill="#607487" font-weight="normal" text-anchor="middle">前（お腹）</text><text x="470" y="872" font-size="12" fill="#607487" font-weight="normal" text-anchor="end">体の右</text><text x="510" y="872" font-size="12" fill="#607487" font-weight="normal" text-anchor="start">体の左</text><text x="490" y="916" font-size="12" fill="#0b5ea8" font-weight="normal" text-anchor="middle"></text><rect x="10" y="990" width="540" height="122" rx="10" fill="#f3f4f6" stroke="#9aa5b1"/><text x="22" y="1014" font-size="14" fill="#142638" font-weight="normal" text-anchor="start">★H字の溝：右の縦＝胆嚢窩＋下大静脈溝／左の縦＝肝円索裂＋静脈管索裂</text><text x="22" y="1035" font-size="14" fill="#142638" font-weight="normal" text-anchor="start">　　　　　横棒＝肝門（動脈・門脈・総肝管の出入口）</text><text x="22" y="1056" font-size="14" fill="#142638" font-weight="normal" text-anchor="start">★カントリー線＝胆嚢窩と下大静脈を結ぶ線。機能的な右葉/左葉の境界</text><text x="22" y="1077" font-size="14" fill="#142638" font-weight="normal" text-anchor="start">　解剖学的な境界（肝鎌状間膜）とはズレる → 方形葉・尾状葉は</text><text x="22" y="1098" font-size="14" fill="#142638" font-weight="normal" text-anchor="start">　見た目は右葉側だが、機能的には左葉側に入る（尾状葉は独立扱いも）</text></svg>