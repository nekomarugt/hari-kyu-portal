<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1124" width="560" height="1124" role="img" aria-label="肝臓の外表面：前面・上後面・臓側面" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>肝臓の外表面：前面・上後面・臓側面</title><rect width="560" height="1124" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker></defs><text x="280" y="30" font-size="21" fill="#073b6a" font-weight="bold" text-anchor="middle">肝臓の外から見た形（3方向）</text><text x="280" y="52" font-size="14" fill="#607487" font-weight="normal" text-anchor="middle">3枚とも「向かって左＝体の右（右葉）」でそろえてある</text><rect x="10" y="66" width="540" height="30" rx="8" fill="#e4effa"/><text x="22" y="87" font-size="17" fill="#073b6a" font-weight="bold" text-anchor="start">① 前から見た図（横隔面）</text><text x="540" y="86" font-size="13" fill="#607487" font-weight="normal" text-anchor="end">目の位置：体の正面</text><path d="M40,176 C60,126 200,116 300,136 C380,146 470,166 520,201 C470,226 380,256 300,281 L250,294 C200,311 120,326 80,321 C45,296 35,236 40,176 Z" fill="#e8c4b8" stroke="#9a5a4a" stroke-width="2.2" /><ellipse cx="205" cy="309" rx="15" ry="11" fill="#b9d7a8" stroke="#4f7a3a" stroke-width="2"/><path d="M300,136 C296,186 290,236 282,286" fill="none" stroke="#4a6fa5" stroke-width="3" /><circle cx="282" cy="288" r="5" fill="#4a6fa5"/><line x1="205" y1="298" x2="235" y2="130" stroke="#c0392b" stroke-width="2.4" stroke-dasharray="7 5"/><text x="130" y="211" font-size="22" fill="#6b3a2e" font-weight="bold" text-anchor="middle">右葉</text><text x="400" y="206" font-size="22" fill="#6b3a2e" font-weight="bold" text-anchor="middle">左葉</text><line x1="296" y1="166" x2="360" y2="104" stroke="#607487" stroke-width="1.4" /><circle cx="296" cy="166" r="2.5" fill="#607487"/><text x="364" y="109" font-size="15" fill="#4a6fa5" font-weight="bold" text-anchor="start">肝鎌状間膜</tex