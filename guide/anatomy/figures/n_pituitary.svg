<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" width="560" height="430" role="img" aria-label="下垂体：腺性下垂体と神経性下垂体" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>下垂体：腺性下垂体と神経性下垂体</title><rect width="560" height="430" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12705f"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4531c"/></marker></defs><rect x="150" y="12" width="260" height="50" rx="8" fill="#dff0e9" stroke="#12705f" stroke-width="2"/><text x="280.0" y="33.82" font-size="12" fill="#17261f" text-anchor="middle" font-weight="normal">視床下部</text><text x="280.0" y="48.82" font-size="12" fill="#17261f" text-anchor="middle" font-weight="normal">（視索上核・室傍核などのニューロン）</text><line x1="210" y1="64" x2="210" y2="130" stroke="#b4531c" stroke-width="3" marker-end="url(#ar)"/><text x="190" y="100" font-size="12" fill="#b4531c" text-anchor="end" font-weight="bold">下垂体門脈</text><line x1="350" y1="64" x2="350" y2="130" stroke="#0c4a40" stroke-width="3" marker-end="url(#ar)"/><text x="368" y="100" font-size="12" fill="#0c4a40" text-anchor="start" font-weight="bold">神経線維（軸索）</text><text x="210" y="150" font-size="11" fill="#6b8077" text-anchor="middle" font-weight="normal">ホルモン放出・抑制ホルモン</text><text x="350" y="150" font-size="11" fill="#6b8077" text-anchor="middle" font-weight="normal">ADH・オキシトシンを運ぶ</text><rect x="100" y="160" width="220" height="60" rx="8" fill="#ffffff" stroke="#b4531c" stroke-width="2"/><text x="210.0" y="186.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="bold">腺性下垂体（前葉）</text><text x="210.0" y="202.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="bold">上皮性。ホルモンをつくる</text><rect x="340" y="160" width="200" height="60" rx="8" fill="#ffffff" stroke="#0c4a40" stroke-width="2"/><text x="440.0" y="186.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="bold">神経性下垂体（後葉）</text><text x="440.0" y="202.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="bold">神経組織。ホルモンをためて放出</text><text x="210" y="250" font-size="13" fill="#b4531c" text-anchor="middle" font-weight="bold">門脈系がある</text><text x="440" y="250" font-size="13" fill="#0c4a40" text-anchor="middle" font-weight="bold">門脈系はない</text><line x1="210" y1="258" x2="210" y2="284" stroke="#b4531c" stroke-width="2.5" stroke-dasharray="6 5"/><line x1="440" y1="258" x2="440" y2="284" stroke="#0c4a40" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="60" y="288" width="300" height="50" rx="8" fill="#fbe9d9" stroke="#b4531c" stroke-width="2"/><text x="210.0" y="317.32" font-size="12" fill="#17261f" text-anchor="middle" font-weight="normal">GH・プロラクチン・TSH・ACTH・FSH・LH</text><rect x="380" y="288" width="160" height="50" rx="8" fill="#dff0e9" stroke="#0c4a40" stroke-width="2"/><text x="460.0" y="317.32" font-size="12" fill="#17261f" text-anchor="middle" font-weight="normal">ADH・オキシトシン</text><text x="210" y="358" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">後葉に、ホルモンをつくる細胞はない。</text><text x="210" y="378" font-size="12" fill="#6b8077" text-anchor="middle" font-weight="normal">（つくるのは視床下部、後葉は貯蔵と放出）</text><text x="20" y="414" font-size="11" fill="#6b8077" text-anchor="start" font-weight="normal">位置：蝶形骨のトルコ鞍（下垂体窩）。視神経交叉の後方。下垂体柄で視床下部につながる。</text></svg>