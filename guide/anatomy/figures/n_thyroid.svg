<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400" role="img" aria-label="甲状腺と上皮小体（副甲状腺）の位置" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>甲状腺と上皮小体（副甲状腺）の位置</title><rect width="560" height="400" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12705f"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4531c"/></marker></defs><text x="150" y="22" font-size="14" fill="#0c4a40" text-anchor="middle" font-weight="bold">前から見る</text><path d="M105,50 L195,50 L185,110 L150,130 L115,110 Z" fill="#dff0e9" stroke="#12705f" stroke-width="3"/><text x="150" y="84" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">甲状軟骨</text><rect x="125" y="132" width="50" height="16" rx="6" fill="#f6ead2" stroke="#12705f" stroke-width="2.5"/><text x="215" y="144" font-size="11" fill="#6b8077" text-anchor="start" font-weight="normal">輪状軟骨</text><ellipse cx="108" cy="210" rx="30" ry="58" fill="#fbe9d9" stroke="#b4531c" stroke-width="3"/><ellipse cx="192" cy="210" rx="30" ry="58" fill="#fbe9d9" stroke="#b4531c" stroke-width="3"/><rect x="128" y="180" width="44" height="22" fill="#fbe9d9" stroke="#b4531c" stroke-width="3"/><text x="150" y="196" font-size="12" fill="#17261f" text-anchor="middle" font-weight="normal">峡部</text><text x="76" y="330" font-size="12" fill="#17261f" text-anchor="middle" font-weight="normal">右葉</text><text x="224" y="330" font-size="12" fill="#17261f" text-anchor="middle" font-weight="normal">左葉</text><rect x="136" y="150" width="28" height="200" rx="8" fill="none" stroke="#6b8077" stroke-width="2" stroke-dasharray="6 4"/><text x="150" y="372" font-size="12" fill="#6b8077" text-anchor="middle" font-weight="normal">気管</text><text x="420" y="22" font-size="14" fill="#0c4a40" text-anchor="middle" font-weight="bold">うしろから見る</text><ellipse cx="378" cy="190" rx="34" ry="62" fill="#fbe9d9" stroke="#b4531c" stroke-width="3"/><ellipse cx="462" cy="190" rx="34" ry="62" fill="#fbe9d9" stroke="#b4531c" stroke-width="3"/><circle cx="388" cy="150" r="9" fill="#12705f" stroke="#0c4a40" stroke-width="2"/><circle cx="388" cy="228" r="9" fill="#12705f" stroke="#0c4a40" stroke-width="2"/><circle cx="452" cy="150" r="9" fill="#12705f" stroke="#0c4a40" stroke-width="2"/><circle cx="452" cy="228" r="9" fill="#12705f" stroke="#0c4a40" stroke-width="2"/><text x="420" y="276" font-size="13" fill="#0c4a40" text-anchor="middle" font-weight="bold">● 上皮小体（副甲状腺）</text><text x="420" y="294" font-size="11" fill="#17261f" text-anchor="middle" font-weight="normal">通常4個。甲状腺の後面（前面ではない）</text><rect x="270" y="316" width="280" height="74" rx="8" fill="#ffffff" stroke="#12705f" stroke-width="2"/><text x="410.0" y="342.96" font-size="11" fill="#17261f" text-anchor="middle" font-weight="normal">甲状腺：濾胞（サイロキシン）</text><text x="410.0" y="356.96" font-size="11" fill="#17261f" text-anchor="middle" font-weight="normal">＋傍濾胞細胞（カルシトニン）</text><text x="410.0" y="370.96" font-size="11" fill="#17261f" text-anchor="middle" font-weight="normal">導管なし。気管の前〜側面。全周は囲まない。</text></svg>