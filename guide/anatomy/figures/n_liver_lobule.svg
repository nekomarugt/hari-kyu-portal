<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400" role="img" aria-label="肝小葉（模式図）" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>肝小葉（模式図）</title><rect width="560" height="400" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12705f"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4531c"/></marker></defs><polygon points="311.2,260.0 190.0,330.0 68.8,260.0 68.8,120.0 190.0,50.0 311.2,120.0" fill="#fcf8ec" stroke="#12705f" stroke-width="3"/><line x1="311.2" y1="260.0" x2="190" y2="190" stroke="#d98a8a" stroke-width="3"/><line x1="190.0" y1="330.0" x2="190" y2="190" stroke="#d98a8a" stroke-width="3"/><line x1="68.8" y1="260.0" x2="190" y2="190" stroke="#d98a8a" stroke-width="3"/><line x1="68.8" y1="120.0" x2="190" y2="190" stroke="#d98a8a" stroke-width="3"/><line x1="190.0" y1="50.0" x2="190" y2="190" stroke="#d98a8a" stroke-width="3"/><line x1="311.2" y1="120.0" x2="190" y2="190" stroke="#d98a8a" stroke-width="3"/><circle cx="311.2" cy="260.0" r="15" fill="#fbe9d9" stroke="#b4531c" stroke-width="3"/><circle cx="190.0" cy="330.0" r="15" fill="#fbe9d9" stroke="#b4531c" stroke-width="3"/><circle cx="68.8" cy="260.0" r="15" fill="#fbe9d9" stroke="#b4531c" stroke-width="3"/><circle cx="68.8" cy="120.0" r="15" fill="#fbe9d9" stroke="#b4531c" stroke-width="3"/><circle cx="190.0" cy="50.0" r="15" fill="#fbe9d9" stroke="#b4531c" stroke-width="3"/><circle cx="311.2" cy="120.0" r="15" fill="#fbe9d9" stroke="#b4531c" stroke-width="3"/><circle cx="190" cy="190" r="20" fill="#cfe0f5" stroke="#12705f" stroke-width="3"/><text x="190" y="195" font-size="12" fill="#17261f" text-anchor="middle" font-weight="normal">中心</text><text x="190" y="276" font-size="12" fill="#6b8077" text-anchor="middle" font-weight="normal">肝細胞の板</text><text x="350" y="40" font-size="15" fill="#b4531c" text-anchor="start" font-weight="bold">小葉の角：グリソン鞘</text><text x="350" y="62" font-size="12" fill="#17261f" text-anchor="start" font-weight="normal">（三つ組）</text><text x="350" y="82" font-size="12" fill="#17261f" text-anchor="start" font-weight="normal">・小葉間動脈（固有肝動脈の枝）</text><text x="350" y="100" font-size="12" fill="#17261f" text-anchor="start" font-weight="normal">・小葉間静脈（門脈の枝）</text><text x="350" y="118" font-size="12" fill="#17261f" text-anchor="start" font-weight="normal">・小葉間胆管</text><text x="350" y="160" font-size="15" fill="#0c4a40" text-anchor="start" font-weight="bold">小葉の中心：中心静脈</text><text x="350" y="182" font-size="12" fill="#17261f" text-anchor="start" font-weight="normal">→ 小葉下静脈 → 肝静脈 → 下大静脈</text><text x="350" y="224" font-size="14" fill="#b04a4a" text-anchor="start" font-weight="bold">赤い線：類洞（洞様毛細血管）</text><text x="350" y="244" font-size="12" fill="#17261f" text-anchor="start" font-weight="normal">血液は 周辺 → 中心 へ流れる</text><text x="350" y="270" font-size="12" fill="#b4531c" text-anchor="start" font-weight="bold">胆汁は 中心 → 周辺 へ（毛細胆管）</text><text x="350" y="296" font-size="12" fill="#17261f" text-anchor="start" font-weight="normal">ディッセ腔：類洞と肝細胞のすき間</text><text x="350" y="314" font-size="12" fill="#17261f" text-anchor="start" font-weight="normal">（ビタミンA貯蔵細胞）</text><text x="350" y="340" font-size="12" fill="#17261f" text-anchor="start" font-weight="normal">クッパー星細胞は類洞の中にいる</text><text x="20" y="382" font-size="12" fill="#6b8077" text-anchor="start" font-weight="normal">血液と胆汁は、反対向きに流れる。</text></svg>