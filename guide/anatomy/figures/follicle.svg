<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="560" height="560" role="img" aria-label="卵胞の成熟から排卵・黄体・白体までの模式図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>卵胞の成熟から排卵・黄体・白体までの模式図</title><rect width="560" height="560" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker></defs><text x="20" y="28" font-size="17" fill="#607487" font-weight="normal" text-anchor="start" >卵巣の中で卵胞が育つ順番</text><circle cx="60" cy="130" r="16" fill="#fdf1e4" stroke="#c7825a" stroke-width="2"/><circle cx="60" cy="130" r="9" fill="#fff" stroke="#cf2634" stroke-width="2.5"/><circle cx="60" cy="130" r="3.5" fill="#cf2634"/><text x="60" y="216" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >原始卵胞</text><text x="60" y="240" font-size="14" fill="#607487" font-weight="normal" text-anchor="middle" >扁平な細胞1層</text><circle cx="170" cy="130" r="24" fill="#fdf1e4" stroke="#c7825a" stroke-width="2"/><circle cx="170" cy="130" r="9" fill="#fff" stroke="#cf2634" stroke-width="2.5"/><circle cx="170" cy="130" r="3.5" fill="#cf2634"/><text x="170" y="216" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >一次卵胞</text><text x="170" y="240" font-size="14" fill="#607487" font-weight="normal" text-anchor="middle" >立方〜円柱1層</text><circle cx="300" cy="130" r="38" fill="#fdf1e4" stroke="#c7825a" stroke-width="2"/><path d="M273.4,133.8 A27.36,27.36 0 1 0 303.8,103.4" fill="#dff0fb" stroke="none"/><circle cx="286.7" cy="116.7" r="10.64" fill="#fff" stroke="#cf2634" stroke-width="2.5"/><circle cx="286.7" cy="116.7" r="3.5" fill="#cf2634"/><text x="300" y="216" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >二次卵胞</text><text x="300" y="240" font-size="14" fill="#607487" font-weight="normal" text-anchor="middle" >多層・卵胞腔</text><circle cx="460" cy="130" r="50" fill="#fdf1e4" stroke="#c7825a" stroke-width="2"/><path d="M425.0,135.0 A36.0,36.0 0 1 0 465.0,95.0" fill="#dff0fb" stroke="none"/><circle cx="442.5" cy="112.5" r="14.000000000000002" fill="#fff" stroke="#cf2634" stroke-width="2.5"/><circle cx="442.5" cy="112.5" r="3.5" fill="#cf2634"/><text x="460" y="216" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >成熟卵胞</text><text x="460" y="240" font-size="14" fill="#607487" font-weight="normal" text-anchor="middle" >グラーフ卵胞</text><line x1="82" y1="130" x2="140" y2="130" stroke="#607487" stroke-width="2.5" marker-end="url(#ah)"/><line x1="200" y1="130" x2="256" y2="130" stroke="#607487" stroke-width="2.5" marker-end="url(#ah)"/><line x1="344" y1="130" x2="404" y2="130" stroke="#607487" stroke-width="2.5" marker-end="url(#ah)"/><line x1="460" y1="256" x2="460" y2="300" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><rect x="330" y="302" width="210" height="66" rx="10" fill="#fdecee" stroke="#cf2634" stroke-width="2"/><text x="435.0" y="332.0" font-size="21" fill="#9c1c26" font-weight="bold" text-anchor="middle" >排卵</text><text x="435.0" y="351.0" font-size="14" fill="#142638" font-weight="normal" text-anchor="middle" >卵子が腹膜腔へ→卵管采</text><line x1="328" y1="335" x2="272" y2="335" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><rect x="40" y="302" width="230" height="66" rx="10" fill="#fff4d6" stroke="#b77a00" stroke-width="2"/><text x="155.0" y="332.0" font-size="21" fill="#7a4b00" font-weight="bold" text-anchor="middle" >黄体</text><text x="155.0" y="351.0" font-size="14" fill="#142638" font-weight="normal" text-anchor="middle" >プロゲステロンを出す</text><line x1="155" y1="370" x2="155" y2="412" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><rect x="40" y="414" width="230" height="58" rx="10" fill="#f4f6f8" stroke="#9aa9b8" stroke-width="2"/><text x="155.0" y="440.0" font-size="20" fill="#607487" font-weight="bold" text-anchor="middle" >白体</text><text x="155.0" y="459.0" font-size="14" fill="#142638" font-weight="normal" text-anchor="middle" >妊娠しなければ</text><text x="300" y="440" font-size="17" fill="#073b6a" font-weight="bold" text-anchor="start" >受精は卵管膨大部</text><text x="20" y="512" font-size="16" fill="#142638" font-weight="normal" text-anchor="start" >ほとんどの原始卵胞は育たずに退化する（閉鎖卵胞）</text><text x="20" y="540" font-size="15" fill="#607487" font-weight="normal" text-anchor="start" >赤丸＝卵子（卵母細胞）　水色＝卵胞腔</text></svg>