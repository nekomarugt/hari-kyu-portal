<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 600" width="560" height="600" role="img" aria-label="下腿の3つの筋群（前・外側・後）と支配神経の模式図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>下腿の3つの筋群（前・外側・後）と支配神経の模式図</title><rect width="560" height="600" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker></defs><text x="20" y="30" font-size="17" fill="#607487" font-weight="normal" text-anchor="start" >右の下腿の輪切り（上から見た模式図）</text><text x="280" y="58" font-size="17" fill="#607487" font-weight="normal" text-anchor="middle" >前（すね側）</text><text x="280" y="392" font-size="17" fill="#607487" font-weight="normal" text-anchor="middle" >後ろ（ふくらはぎ側）</text><text x="22" y="222" font-size="17" fill="#607487" font-weight="normal" text-anchor="start" >内側</text><text x="538" y="222" font-size="17" fill="#607487" font-weight="normal" text-anchor="end" >外側</text><clipPath id="leg"><ellipse cx="280" cy="220" rx="200" ry="150"/></clipPath><polygon clip-path="url(#leg)" points="232,90 222,132 372,196 398,188 520,-20 232,-20" fill="#dcebf8"/><polygon clip-path="url(#leg)" points="390,206 520,-20 620,-20 620,392 560,392" fill="#e5f5ec"/><polygon clip-path="url(#leg)" points="0,168 196,160 222,132 372,196 404,222 560,392 620,420 0,420" fill="#fde4e6"/><ellipse cx="280" cy="220" rx="200" ry="150" fill="none" stroke="#073b6a" stroke-width="3"/><line x1="222" y1="132" x2="372" y2="196" stroke="#607487" stroke-width="2.5"/><line x1="398" y1="1