<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 806" width="560" height="806" role="img" aria-label="胎児循環の流れと3つの近道の模式図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>胎児循環の流れと3つの近道の模式図</title><rect width="560" height="806" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker></defs><text x="20" y="28" font-size="16" fill="#607487" font-weight="normal" text-anchor="start" >赤＝胎児だけにある「近道」　（ ）内＝生まれた後の名残</text><rect x="180" y="44" width="200" height="48" rx="10" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2"/><text x="280.0" y="74.84" font-size="19" fill="#073b6a" font-weight="bold" text-anchor="middle" >胎盤</text><rect x="140" y="124" width="280" height="58" rx="10" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2"/><text x="280.0" y="150.0" font-size="19" fill="#073b6a" font-weight="bold" text-anchor="middle" >臍静脈（1本）</text><text x="280.0" y="169.0" font-size="14" fill="#607487" font-weight="normal" text-anchor="middle" >酸素が一番多い（→肝円索）</text><rect x="140" y="214" width="280" height="58" rx="10" fill="#fdecee" stroke="#cf2634" stroke-width="2"/><text x="280.0" y="240.0" font-size="19" fill="#9c1c26" font-weight="bold" text-anchor="middle" >静脈管</text><text x="280.0" y="259.0" font-size="14" fill="#607487" font-weight="normal" text-anchor="middle" >肝臓を素通り（→静脈管索）</text><rect x="180" y="304" width="200" height="48" rx="10" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2"/><text x="280.0" y="334.84" font-size="19" fill="#073b6a" font-weight="bold" text-anchor="middle" >下大静脈</text><rect x="180" y="384" width="200" height="48" rx="10" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2"/><text x="280.0" y="414.84" font-size="19" fill="#073b6a" font-weight="bold" text-anchor="middle" >右心房</text><rect x="20" y="474" width="230" height="48" rx="10" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2"/><text x="135.0" y="504.84" font-size="19" fill="#073b6a" font-weight="bold" text-anchor="middle" >右心室</text><rect x="20" y="554" width="230" height="48" rx="10" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2"/><text x="135.0" y="584.84" font-size="19" fill="#073b6a" font-weight="bold" text-anchor="middle" >肺動脈</text><rect x="20" y="634" width="230" height="58" rx="10" fill="#fdecee" stroke="#cf2634" stroke-width="2"/><text x="135.0" y="660.0" font-size="19" fill="#9c1c26" font-weight="bold" text-anchor="middle" >動脈管</text><text x="135.0" y="679.0" font-size="14" fill="#607487" font-weight="normal" text-anchor="middle" >肺動脈→大動脈（→動脈管索）</text><rect x="310" y="464" width="230" height="58" rx="10" fill="#fdecee" stroke="#cf2634" stroke-width="2"/><text x="425.0" y="490.0" font-size="19" fill="#9c1c26" font-weight="bold" text-anchor="middle" >卵円孔</text><text x="425.0" y="509.0" font-size="14" fill="#607487" font-weight="normal" text-anchor="middle" >右心房→左心房（→卵円窩）</text><rect x="310" y="554" width="230" height="48" rx="10" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2"/><text x="425.0" y="584.84" font-size="19" fill="#073b6a" font-weight="bold" text-anchor="middle" >左心房→左心室</text><rect x="310" y="639" width="230" height="48" rx="10" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2"/><text x="425.0" y="669.84" font-size="19" fill="#073b6a" font-weight="bold" text-anchor="middle" >大動脈</text><rect x="20" y="734" width="520" height="58" rx="10" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2"/><text x="280.0" y="760.0" font-size="19" fill="#073b6a" font-weight="bold" text-anchor="middle" >全身 → 臍動脈（2本）→ 胎盤へ</text><text x="280.0" y="779.0" font-size="14" fill="#607487" font-weight="normal" text-anchor="middle" >酸素が一番少ない（→臍動脈索）</text><line x1="280" y1="94" x2="280" y2="122" stroke="#607487" stroke-width="2.5" marker-end="url(#ah)"/><line x1="280" y1="184" x2="280" y2="212" stroke="#607487" stroke-width="2.5" marker-end="url(#ah)"/><line x1="280" y1="274" x2="280" y2="302" stroke="#607487" stroke-width="2.5" marker-end="url(#ah)"/><line x1="280" y1="354" x2="280" y2="382" stroke="#607487" stroke-width="2.5" marker-end="url(#ah)"/><line x1="220" y1="434" x2="135" y2="472" stroke="#607487" stroke-width="2.5" marker-end="url(#ah)"/><line x1="135" y1="524" x2="135" y2="552" stroke="#607487" stroke-width="2.5" marker-end="url(#ah)"/><line x1="135" y1="604" x2="135" y2="632" stroke="#607487" stroke-width="2.5" marker-end="url(#ah)"/><line x1="340" y1="434" x2="425" y2="462" stroke="#607487" stroke-width="2.5" marker-end="url(#ah)"/><line x1="425" y1="524" x2="425" y2="552" stroke="#607487" stroke-width="2.5" marker-end="url(#ah)"/><line x1="425" y1="604" x2="425" y2="637" stroke="#607487" stroke-width="2.5" marker-end="url(#ah)"/><line x1="252" y1="663" x2="308" y2="663" stroke="#607487" stroke-width="2.5" marker-end="url(#ah)"/><line x1="425" y1="689" x2="425" y2="732" stroke="#607487" stroke-width="2.5" marker-end="url(#ah)"/><text x="24" y="452" font-size="14" fill="#607487" font-weight="normal" text-anchor="start" >（肺はまだ使わない）</text></svg>