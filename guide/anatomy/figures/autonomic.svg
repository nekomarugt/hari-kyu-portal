<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 620" width="560" height="620" role="img" aria-label="交感神経と副交感神経が出る場所の模式図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>交感神経と副交感神経が出る場所の模式図</title><rect width="560" height="620" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker></defs><text x="20" y="28" font-size="17" fill="#607487" font-weight="normal" text-anchor="start" >節前ニューロンがどこから出るか</text><rect x="40" y="60" width="110" height="70" rx="8" fill="#f4f6f8" stroke="#9aa9b8" stroke-width="1.5"/><text x="95" y="97.0" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >脳幹</text><text x="95" y="117.0" font-size="13" fill="#607487" font-weight="normal" text-anchor="middle" >Ⅲ・Ⅶ・Ⅸ・Ⅹ</text><rect x="40" y="130" width="110" height="80" rx="8" fill="#f4f6f8" stroke="#9aa9b8" stroke-width="1.5"/><text x="95" y="172.0" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >頸髄</text><text x="95" y="192.0" font-size="13" fill="#607487" font-weight="normal" text-anchor="middle" >C1〜C8</text><rect x="40" y="210" width="110" height="140" rx="8" fill="#f4f6f8" stroke="#9aa9b8" stroke-width="1.5"/><text x="95" y="282.0" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >胸髄</text><text x="95" y="302.0" font-size="13" fill="#607487" font-weight="normal" text-anchor="middle" >T1〜T12</text><rect x="40" y="350" width="110" height="70" rx="8" fill="#f4f6f8" stroke="#9aa9b8" stroke-width="1.5"/><text x="95" y="387.0" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >腰髄</text><text x="95" y="407.0" font-size="13" fill="#607487" font-weight="normal" text-anchor="middle" >L1〜L5</text><rect x="40" y="420" width="110" height="60" rx="8" fill="#f4f6f8" stroke="#9aa9b8" stroke-width="1.5"/><text x="95" y="452.0" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >仙髄</text><text x="95" y="472.0" font-size="13" fill="#607487" font-weight="normal" text-anchor="middle" >S1〜S5</text><rect x="162" y="210" width="16" height="175" rx="4" fill="#cf2634"/><text x="186" y="290" font-size="20" fill="#cf2634" font-weight="bold" text-anchor="start" >交感神経</text><text x="186" y="314" font-size="15" fill="#cf2634" font-weight="normal" text-anchor="start" >T1〜L2（胸腰系）</text><rect x="162" y="60" width="16" height="70" rx="4" fill="#2e8b57"/><rect x="162" y="434" width="16" height="34" rx="4" fill="#2e8b57"/><text x="186" y="90" font-size="20" fill="#2e8b57" font-weight="bold" text-anchor="start" >副交感神経</text><text x="186" y="114" font-size="15" fill="#2e8b57" font-weight="normal" text-anchor="start" >脳幹（頭）</text><text x="186" y="450" font-size="20" fill="#2e8b57" font-weight="bold" text-anchor="start" >副交感神経</text><text x="186" y="474" font-size="15" fill="#2e8b57" font-weight="normal" text-anchor="start" >S2〜S4（仙）</text><text x="318" y="56" font-size="17" fill="#073b6a" font-weight="bold" text-anchor="start" >比べると</text><text x="418" y="84" font-size="15" fill="#cf2634" font-weight="bold" text-anchor="middle" >交感</text><text x="505" y="84" font-size="15" fill="#2e8b57" font-weight="bold" text-anchor="middle" >副交感</text><text x="318" y="112" font-size="14" fill="#607487" font-weight="bold" text-anchor="start" >神経節</text><text x="418" y="112" font-size="13" fill="#142638" font-weight="normal" text-anchor="middle" >交感神経幹など</text><text x="505" y="112" font-size="13" fill="#142638" font-weight="normal" text-anchor="middle" >臓器の近く</text><text x="318" y="142" font-size="14" fill="#607487" font-weight="bold" text-anchor="start" >代表</text><text x="418" y="142" font-size="13" fill="#142638" font-weight="normal" text-anchor="middle" >内臓神経</text><text x="505" y="142" font-size="13" fill="#142638" font-weight="normal" text-anchor="middle" >迷走神経</text><text x="318" y="172" font-size="14" fill="#607487" font-weight="bold" text-anchor="start" ></text><text x="418" y="172" font-size="13" fill="#142638" font-weight="normal" text-anchor="middle" ></text><text x="505" y="172" font-size="13" fill="#142638" font-weight="normal" text-anchor="middle" >骨盤内臓神経</text><text x="318" y="202" font-size="14" fill="#607487" font-weight="bold" text-anchor="start" >瞳孔</text><text x="418" y="202" font-size="13" fill="#142638" font-weight="normal" text-anchor="middle" >散大</text><text x="505" y="202" font-size="13" fill="#142638" font-weight="normal" text-anchor="middle" >縮小</text><text x="20" y="530" font-size="18" fill="#2e8b57" font-weight="bold" text-anchor="start" >副交感＝「頭と仙骨」（頭仙系）</text><text x="20" y="560" font-size="18" fill="#cf2634" font-weight="bold" text-anchor="start" >交感＝「胸と腰」（胸腰系）＝脊髄の側角から出る</text><text x="20" y="592" font-size="14.5" fill="#607487" font-weight="normal" text-anchor="start" >頸髄と L3〜S1 からは、自律神経の節前線維は出ない</text></svg>