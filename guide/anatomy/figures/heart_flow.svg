<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 676" width="560" height="676" role="img" aria-label="心臓の部屋と弁を血液の流れの順に並べた模式図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>心臓の部屋と弁を血液の流れの順に並べた模式図</title><rect width="560" height="676" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker></defs><text x="140" y="30" font-size="17" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >静脈血（酸素が少ない）</text><text x="420" y="30" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="middle" >動脈血（酸素が多い）</text><rect x="30" y="72" width="220" height="54" rx="10" fill="#e4effa" stroke="#0b5ea8" stroke-width="2"/><text x="140.0" y="106.56" font-size="21" fill="#073b6a" font-weight="bold" text-anchor="middle" >大静脈（上・下）</text><rect x="310" y="72" width="220" height="54" rx="10" fill="#fdecee" stroke="#cf2634" stroke-width="2"/><text x="420.0" y="106.56" font-size="21" fill="#9c1c26" font-weight="bold" text-anchor="middle" >大動脈</text><rect x="30" y="182" width="220" height="54" rx="10" fill="#e4effa" stroke="#0b5ea8" stroke-width="2"/><text x="140.0" y="216.56" font-size="21" fill="#073b6a" font-weight="bold" text-anchor="middle" >右心房</text><rect x="310" y="182" width="220" height="54" rx="10" fill="#fdecee" stroke="#cf2634" stroke-width="2"/><text x="420.0" y="216.56" font-size="21" fill="#9c1c26" font-weight="bold" text-anchor="middle" >左心室</text><rect x="30" y="292" width="220" height="54" rx="10" fill="#e4effa" stroke="#0b5ea8" stroke-width="2"/><text x="140.0" y="326.56" font-size="21" fill="#073b6a" font-weight="bold" text-anchor="middle" >右心室</text><rect x="310" y="292" width="220" height="54" rx="10" fill="#fdecee" stroke="#cf2634" stroke-width="2"/><text x="420.0" y="326.56" font-size="21" fill="#9c1c26" font-weight="bold" text-anchor="middle" >左心房</text><rect x="30" y="402" width="220" height="54" rx="10" fill="#e4effa" stroke="#0b5ea8" stroke-width="2"/><text x="140.0" y="436.56" font-size="21" fill="#073b6a" font-weight="bold" text-anchor="middle" >肺動脈</text><rect x="310" y="402" width="220" height="54" rx="10" fill="#fdecee" stroke="#cf2634" stroke-width="2"/><text x="420.0" y="436.56" font-size="21" fill="#9c1c26" font-weight="bold" text-anchor="middle" >肺静脈</text><text x="140" y="62" font-size="15" fill="#607487" font-weight="normal" text-anchor="middle" >全身から ↓</text><text x="420" y="62" font-size="15" fill="#607487" font-weight="normal" text-anchor="middle" >↑ 全身へ</text><line x1="140" y1="128" x2="140" y2="180" stroke="#0b5ea8" stroke-width="3" marker-end="url(#ahb)"/><line x1="420" y1="180" x2="420" y2="128" stroke="#cf2634" stroke-width="3" marker-end="url(#ahr)"/><line x1="140" y1="238" x2="140" y2="290" stroke="#0b5ea8" stroke-width="3" marker-end="url(#ahb)"/><line x1="420" y1="290" x2="420" y2="238" stroke="#cf2634" stroke-width="3" marker-end="url(#ahr)"/><line x1="140" y1="348" x2="140" y2="400" stroke="#0b5ea8" stroke-width="3" marker-end="url(#ahb)"/><line x1="420" y1="400" x2="420" y2="348" stroke="#cf2634" stroke-width="3" marker-end="url(#ahr)"/><rect x="107.0" y="252" width="66.0" height="26" rx="13" fill="#cf2634"/><text x="140" y="270.76" font-size="16" fill="#fff" font-weight="bold" text-anchor="middle" >三尖弁</text><rect x="99.0" y="362" width="82.0" height="26" rx="13" fill="#7b8da0"/><text x="140" y="380.76" font-size="16" fill="#fff" font-weight="bold" text-anchor="middle" >肺動脈弁</text><rect x="358.4" y="252" width="123.3" height="26" rx="13" fill="#cf2634"/><text x="420" y="270.76" font-size="16" fill="#fff" font-weight="bold" text-anchor="middle" >僧帽弁（2尖）</text><rect x="379.0" y="142" width="82.0" height="26" rx="13" fill="#7b8da0"/><text x="420" y="160.76" font-size="16" fill="#fff" font-weight="bold" text-anchor="middle" >大動脈弁</text><rect x="30" y="512" width="500" height="60" rx="10" fill="#f3f8fc" stroke="#28a9c7" stroke-width="2"/><text x="280.0" y="539.0" font-size="21" fill="#073b6a" font-weight="bold" text-anchor="middle" >肺（ガス交換）</text><text x="280.0" y="560.0" font-size="16" fill="#142638" font-weight="normal" text-anchor="middle" >二酸化炭素を出して酸素をもらう</text><polyline points="140,458 140,510" fill="none" stroke="#0b5ea8" stroke-width="3" stroke-linejoin="round" marker-end="url(#ahb)"/><polyline points="420,510 420,458" fill="none" stroke="#cf2634" stroke-width="3" stroke-linejoin="round" marker-end="url(#ahr)"/><rect x="39.5" y="589" width="33.0" height="26" rx="13" fill="#cf2634"/><text x="56" y="607.4" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle" >赤</text><text x="80" y="608" font-size="16" fill="#142638" font-weight="normal" text-anchor="start" >房室弁：腱索・乳頭筋あり（三尖弁・僧帽弁）</text><rect x="39.5" y="621" width="33.0" height="26" rx="13" fill="#7b8da0"/><text x="56" y="639.4" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle" >灰</text><text x="80" y="640" font-size="16" fill="#142638" font-weight="normal" text-anchor="start" >動脈弁（半月弁）：腱索なし</text></svg>