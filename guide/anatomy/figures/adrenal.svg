<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="560" height="560" role="img" aria-label="副腎の皮質3層と髄質のホルモンの模式図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>副腎の皮質3層と髄質のホルモンの模式図</title><rect width="560" height="560" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker></defs><text x="20" y="28" font-size="17" fill="#607487" font-weight="normal" text-anchor="start" >副腎の断面（外側から順に）</text><ellipse cx="190" cy="260" rx="170" ry="200" fill="#e9e2d4" stroke="#9a7a55" stroke-width="1.5"/><ellipse cx="190" cy="260" rx="156" ry="184" fill="#fde2c4" stroke="#9a7a55" stroke-width="1.5"/><ellipse cx="190" cy="260" rx="128" ry="150" fill="#fbd1a2" stroke="#9a7a55" stroke-width="1.5"/><ellipse cx="190" cy="260" rx="99" ry="116" fill="#f5b97f" stroke="#9a7a55" stroke-width="1.5"/><ellipse cx="190" cy="260" rx="68" ry="80" fill="#e6d9f5" stroke="#9a7a55" stroke-width="1.5"/><line x1="190" y1="101" x2="330" y2="66" stroke="#607487" stroke-width="1.8"/><circle cx="190" cy="101" r="3.5" fill="#607487"/><text x="334" y="60" font-size="18" fill="#7a3b00" font-weight="bold" text-anchor="start" >球状帯（外）</text><text x="334" y="82" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >鉱質コルチコイド</text><text x="334" y="102" font-size="14.5" fill="#607487" font-weight="normal" text-anchor="start" >アルドステロン（塩）</text><line x1="190" y1="135" x2="330" y2="146" stroke="#607487" stroke-width="1.8"/><circle cx="190" cy="135" r="3.5" fill="#607487"/><text x="334" y="140" font-size="18" fill="#7a3b00" font-weight="bold" text-anchor="start" >束状帯（中）</text><text x="334" y="162" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >糖質コルチコイド</text><text x="334" y="182" font-size="14.5" fill="#607487" font-weight="normal" text-anchor="start" >コルチゾール（糖）</text><line x1="190" y1="170" x2="330" y2="226" stroke="#607487" stroke-width="1.8"/><circle cx="190" cy="170" r="3.5" fill="#607487"/><text x="334" y="220" font-size="18" fill="#7a3b00" font-weight="bold" text-anchor="start" >網状帯（内）</text><text x="334" y="242" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >性ホルモン</text><text x="334" y="262" font-size="14.5" fill="#607487" font-weight="normal" text-anchor="start" >アンドロゲン（性）</text><line x1="190" y1="260" x2="330" y2="360" stroke="#607487" stroke-width="1.8"/><circle cx="190" cy="260" r="3.5" fill="#607487"/><text x="334" y="354" font-size="18" fill="#6a4fb3" font-weight="bold" text-anchor="start" >髄質</text><text x="334" y="376" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >カテコールアミン</text><text x="334" y="396" font-size="14.5" fill="#607487" font-weight="normal" text-anchor="start" >アドレナリンなど</text><text x="190" y="266" font-size="18" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >髄質</text><path d="M22,60 v400" stroke="none"/><text x="20" y="494" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="start" >皮質は外から「球・束・網」＝「塩・糖・性」</text><text x="20" y="522" font-size="16" fill="#142638" font-weight="normal" text-anchor="start" >皮質＝中胚葉　髄質＝外胚葉（交感神経の仲間）</text></svg>