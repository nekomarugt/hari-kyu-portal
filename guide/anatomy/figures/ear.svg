<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 640" width="560" height="640" role="img" aria-label="耳の構造（外耳・中耳・内耳）と音の伝わる順の模式図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>耳の構造（外耳・中耳・内耳）と音の伝わる順の模式図</title><rect width="560" height="640" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker></defs><rect x="20" y="20" width="150" height="460" rx="12" fill="#fdf1e4" stroke="#c7825a" stroke-width="2"/><text x="95.0" y="50" font-size="21" fill="#c7825a" font-weight="bold" text-anchor="middle" >外耳</text><rect x="180" y="20" width="170" height="460" rx="12" fill="#eef6fd" stroke="#0b5ea8" stroke-width="2"/><text x="265.0" y="50" font-size="21" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >中耳</text><rect x="360" y="20" width="180" height="460" rx="12" fill="#f3effb" stroke="#6a4fb3" stroke-width="2"/><text x="450.0" y="50" font-size="21" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >内耳</text><rect x="32" y="72" width="126" height="44" rx="10" fill="#fff" stroke="#8a4a22" stroke-width="2"/><text x="95.0" y="100.12" font-size="17" fill="#8a4a22" font-weight="bold" text-anchor="middle" >耳介</text><rect x="32" y="146" width="126" height="44" rx="10" fill="#fff" stroke="#8a4a22" stroke-width="2"/><text x="95.0" y="174.12" font-size="17" fill="#8a4a22" font-weight="bold" text-anchor="middle" >外耳道</text><line x1="95" y1="118" x2="95" y2="144" stroke="#607487" stroke-width="2.5" marker-end="url(#ah)"/><rect x="192" y="72" width="146" height="44" rx="10" fill="#fff" stroke="#0b5ea8" stroke-width="2"/><text x="265.0" y="100.12" font-size="17" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >鼓膜</text><line x1="265" y1="118" x2="265" y2="140" stroke="#607487" stroke-width="2.5" marker-end="url(#ah)"/><rect x="192" y="142" width="146" height="44" rx="10" fill="#fff" stroke="#0b5ea8" stroke-width="2"/><text x="265.0" y="170.12" font-size="17" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >ツチ骨</text><line x1="265" y1="188" x2="265" y2="210" stroke="#607487" stroke-width="2.5" marker-end="url(#ah)"/><rect x="192" y="212" width="146" height="44" rx="10" fill="#fff" stroke="#0b5ea8" stroke-width="2"/><text x="265.0" y="240.12" font-size="17" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >キヌタ骨</text><line x1="265" y1="258" x2="265" y2="280" stroke="#607487" stroke-width="2.5" marker-end="url(#ah)"/><rect x="192" y="282" width="146" height="44" rx="10" fill="#fff" stroke="#0b5ea8" stroke-width="2"/><text x="265.0" y="310.12" font-size="17" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >アブミ骨</text><polyline points="158,168 175,168 175,94 190,94" fill="none" stroke="#607487" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ah)"/><text x="265" y="350" font-size="14" fill="#0b5ea8" font-weight="normal" text-anchor="middle" >耳小骨</text><rect x="192" y="400" width="146" height="60" rx="10" fill="#fff" stroke="#607487" stroke-width="2"/><text x="265.0" y="427.0" font-size="17" fill="#607487" font-weight="bold" text-anchor="middle" >耳管</text><text x="265.0" y="445.0" font-size="13" fill="#142638" font-weight="normal" text-anchor="middle" >咽頭（上咽頭）へ</text><text x="265" y="392" font-size="16" fill="#607487" font-weight="normal" text-anchor="middle" >↓</text><rect x="372" y="72" width="156" height="44" rx="10" fill="#fff" stroke="#6a4fb3" stroke-width="2"/><text x="450.0" y="100.12" font-size="17" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >前庭窓</text><rect x="372" y="142" width="156" height="54" rx="10" fill="#fff" stroke="#6a4fb3" stroke-width="2"/><text x="450.0" y="166.0" font-size="17" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >蝸牛</text><text x="450.0" y="184.0" font-size="13" fill="#607487" font-weight="normal" text-anchor="middle" >ラセン器（コルチ器）</text><rect x="372" y="222" width="156" height="54" rx="10" fill="#fff" stroke="#6a4fb3" stroke-width="2"/><text x="450.0" y="246.0" font-size="17" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >蝸牛神経</text><text x="450.0" y="264.0" font-size="13" fill="#607487" font-weight="normal" text-anchor="middle" >→ 聴覚野</text><polyline points="338,304 355,304 355,94 370,94" fill="none" stroke="#607487" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ah)"/><line x1="450" y1="118" x2="450" y2="140" stroke="#607487" stroke-width="2.5" marker-end="url(#ah)"/><line x1="450" y1="198" x2="450" y2="220" stroke="#607487" stroke-width="2.5" marker-end="url(#ah)"/><line x1="372" y1="296" x2="528" y2="296" stroke="#6a4fb3" stroke-width="1" stroke-dasharray="4 4"/><text x="450" y="322" font-size="15" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >平衡覚（前庭器）</text><rect x="372" y="334" width="156" height="62" rx="10" fill="#fff" stroke="#2e8b57" stroke-width="2"/><text x="450.0" y="362.0" font-size="17" fill="#2e8b57" font-weight="bold" text-anchor="middle" >前庭</text><text x="450.0" y="380.0" font-size="13" fill="#142638" font-weight="normal" text-anchor="middle" >平衡斑：傾き・直線</text><rect x="372" y="406" width="156" height="62" rx="10" fill="#fff" stroke="#2e8b57" stroke-width="2"/><text x="450.0" y="434.0" font-size="17" fill="#2e8b57" font-weight="bold" text-anchor="middle" >半規管</text><text x="450.0" y="452.0" font-size="13" fill="#142638" font-weight="normal" text-anchor="middle" >膨大部稜：回転</text><text x="20" y="520" font-size="16" fill="#142638" font-weight="bold" text-anchor="start" >音の道：外耳道→鼓膜→ツチ→キヌタ→アブミ→前庭窓→蝸牛</text><text x="20" y="550" font-size="16" fill="#142638" font-weight="normal" text-anchor="start" >耳小骨は外から「ツチ・キヌタ・アブミ」</text><text x="20" y="580" font-size="16" fill="#142638" font-weight="normal" text-anchor="start" >耳管は中耳と咽頭をつなぐ（気圧をそろえる）</text><text x="20" y="610" font-size="15" fill="#607487" font-weight="normal" text-anchor="start" >平衡斑は前庭（卵形嚢・球形嚢）、膨大部稜は半規管</text></svg>