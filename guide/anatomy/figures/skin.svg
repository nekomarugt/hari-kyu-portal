3.5" fill="#142638" font-weight="normal" text-anchor="start" >真皮深層〜皮下・振動や圧</text><text x="20" y="580" font-size="15.5" fill="#142638" font-weight="bold" text-anchor="start" >表皮は深い方から 基底層→有棘層→顆粒層→（淡明層）→角質層</text><text x="20" y="608" font-size="14.5" fill="#607487" font-weight="normal" text-anchor="start" >淡明層は手のひら・足の裏など厚い皮膚だけ</text></svg>