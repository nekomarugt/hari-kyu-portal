<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 680" width="560" height="680" role="img" aria-label="新生児の頭蓋を上から見た縫合と泉門の模式図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>新生児の頭蓋を上から見た縫合と泉門の模式図</title><rect width="560" height="680" fill="#ffffff"/><ellipse cx="280" cy="310" rx="190" ry="250" fill="#f7efdc" stroke="#073b6a" stroke-width="3"/><text x="280" y="36" font-size="19" fill="#607487" font-weight="normal" text-anchor="middle" >▲ 前（顔の側）</text><text x="280" y="590" font-size="19" fill="#607487" font-weight="normal" text-anchor="middle" >▼ 後ろ</text><path d="M96.5,245 Q280,179 463.5,245" fill="none" stroke="#0b5ea8" stroke-width="4"/><path d="M166.0,510 L280,452 L394.0,510" fill="none" stroke="#0b5ea8" stroke-width="4"/><line x1="280" y1="270" x2="280" y2="435" stroke="#0b5ea8" stroke-width="4"/><path d="M280,160 L320,212 L280,272 L240,212 Z" fill="#ffffff" stroke="#cf2634" stroke-width="3.5"/><path d="M280,432 L302,462 L258,462 Z" fill="#ffffff" stroke="#cf2634" stroke-width="3.5"/><text x="280" y="118" font-size="24" fill="#142638" font-weight="bold" text-anchor="middle" >前頭骨</text><text x="180" y="360" font-size="24" fill="#142638" font-weight="bold" text-anchor="middle" >頭頂骨</text><text x="380" y="360" font-size="24" fill="#142638" font-weight="bold" text-anchor="middle" >頭頂骨</text><text x="280" y="535" font-size="24" fill="#142638" font-weight="bold" text-anchor="middle" >後頭骨</text><text x="150" y="236" font-size="20" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >冠状縫合</text><text x="290" y="322" font-size="18" fill="#0b5ea8" font-weight="bold" text-anchor="start" >矢状</text><text x="290" y="344" font-size="18" fill="#0b5ea8" font-weight="bold" text-anchor="start" >縫合</text><text x="395" y="470" font-size="20" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >ラムダ縫合</text><line x1="320" y1="212" x2="470" y2="178" stroke="#cf2634" stroke-width="1.8"/><circle cx="320" cy="212" r="3.5" fill="#cf2634"/><text x="476" y="186" font-size="22" fill="#cf2634" font-weight="bold" text-anchor="start" >大泉門</text><line x1="302" y1="455" x2="460" y2="420" stroke="#cf2634" stroke-width="1.8"/><circle cx="302" cy="455" r="3.5" fill="#cf2634"/><text x="466" y="428" font-size="22" fill="#cf2634" font-weight="bold" text-anchor="start" >小泉門</text><text x="20" y="632" font-size="20.5" fill="#142638" font-weight="normal" text-anchor="start" >大泉門＝ひし形。生後1年半〜2年で閉じる</text><text x="20" y="664" font-size="20.5" fill="#142638" font-weight="normal" text-anchor="start" >小泉門＝三角形。生後まもなく（数か月以内）閉じる</text></svg>