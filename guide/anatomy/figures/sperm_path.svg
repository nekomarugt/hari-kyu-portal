<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 720" width="560" height="720" role="img" aria-label="精子の通り道（精路）と付属生殖腺の模式図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>精子の通り道（精路）と付属生殖腺の模式図</title><rect width="560" height="720" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker></defs><rect x="20" y="20" width="330" height="66" rx="10" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2"/><text x="185.0" y="50.0" font-size="21" fill="#073b6a" font-weight="bold" text-anchor="middle" >精巣</text><text x="185.0" y="70.0" font-size="15" fill="#142638" font-weight="normal" text-anchor="middle" >精細管で精子をつくる</text><line x1="185" y1="88" x2="185" y2="114" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><rect x="20" y="116" width="330" height="66" rx="10" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2"/><text x="185.0" y="146.0" font-size="21" fill="#073b6a" font-weight="bold" text-anchor="middle" >精巣上体</text><text x="185.0" y="166.0" font-size="15" fill="#142638" font-weight="normal" text-anchor="middle" >精子をためて成熟させる</text><line x1="185" y1="184" x2="185" y2="210" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><rect x="20" y="212" width="330" height="66" rx="10" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2"/><text x="185.0" y="242.0" font-size="21" fill="#073b6a" font-weight="bold" text-anchor="middle" >精管</text><text x="185.0" y="262.0" font-size="15" fill="#142638" font-weight="normal" text-anchor="middle" >精索の中を上がる（約40〜45cm）</text><line x1="185" y1="280" x2="185" y2="306" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><rect x="20" y="308" width="330" height="66" rx="10" fill="#fdecee" stroke="#cf2634" stroke-width="2"/><text x="185.0" y="338.0" font-size="21" fill="#9c1c26" font-weight="bold" text-anchor="middle" >鼠径管</text><text x="185.0" y="358.0" font-size="15" fill="#142638" font-weight="normal" text-anchor="middle" >浅鼠径輪 → 深鼠径輪（腹壁を通る）</text><line x1="185" y1="376" x2="185" y2="402" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><rect x="20" y="404" width="330" height="66" rx="10" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2"/><text x="185.0" y="434.0" font-size="21" fill="#073b6a" font-weight="bold" text-anchor="middle" >精管膨大部</text><text x="185.0" y="454.0" font-size="15" fill="#142638" font-weight="normal" text-anchor="middle" >膀胱の後ろ</text><line x1="185" y1="472" x2="185" y2="498" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><rect x="20" y="500" width="330" height="66" rx="10" fill="#fdecee" stroke="#cf2634" stroke-width="2"/><text x="185.0" y="530.0" font-size="21" fill="#9c1c26" font-weight="bold" text-anchor="middle" >射精管</text><text x="185.0" y="550.0" font-size="15" fill="#142638" font-weight="normal" text-anchor="middle" >前立腺を貫く</text><line x1="185" y1="568" x2="185" y2="594" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><rect x="20" y="596" width="330" height="66" rx="10" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2"/><text x="185.0" y="626.0" font-size="21" fill="#073b6a" font-weight="bold" text-anchor="middle" >尿道</text><text x="185.0" y="646.0" font-size="15" fill="#142638" font-weight="normal" text-anchor="middle" >前立腺部 → 外へ</text><rect x="380" y="404" width="160" height="80" rx="10" fill="#fff4d6" stroke="#b77a00" stroke-width="2"/><text x="460.0" y="441.0" font-size="20" fill="#7a4b00" font-weight="bold" text-anchor="middle" >精嚢</text><text x="460.0" y="460.0" font-size="14" fill="#142638" font-weight="normal" text-anchor="middle" >果糖・アルカリ性</text><rect x="380" y="512" width="160" height="62" rx="10" fill="#fff4d6" stroke="#b77a00" stroke-width="2"/><text x="460.0" y="540.0" font-size="20" fill="#7a4b00" font-weight="bold" text-anchor="middle" >前立腺</text><text x="460.0" y="559.0" font-size="14" fill="#142638" font-weight="normal" text-anchor="middle" >乳白色の液</text><rect x="380" y="594" width="160" height="62" rx="10" fill="#fff4d6" stroke="#b77a00" stroke-width="2"/><text x="460.0" y="622.0" font-size="19" fill="#7a4b00" font-weight="bold" text-anchor="middle" >尿道球腺</text><text x="460.0" y="641.0" font-size="14" fill="#142638" font-weight="normal" text-anchor="middle" >アルカリ性の粘液</text><line x1="378" y1="446" x2="356" y2="484" stroke="#b77a00" stroke-width="2.5" marker-end="url(#ah)"/><line x1="378" y1="543" x2="356" y2="612" stroke="#b77a00" stroke-width="2.5" marker-end="url(#ah)"/><line x1="378" y1="625" x2="356" y2="638" stroke="#b77a00" stroke-width="2.5" marker-end="url(#ah)"/><text x="460" y="390" font-size="15" fill="#7a4b00" font-weight="bold" text-anchor="middle" >液を足す腺</text><text x="380" y="60" font-size="15" fill="#607487" font-weight="normal" text-anchor="start" >精子がたまる所：</text><text x="380" y="82" font-size="15" fill="#607487" font-weight="normal" text-anchor="start" >精巣上体・精管膨大部</text><text x="380" y="110" font-size="15" fill="#607487" font-weight="normal" text-anchor="start" >（精嚢はためない）</text></svg>