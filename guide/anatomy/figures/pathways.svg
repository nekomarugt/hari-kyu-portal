<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 640" width="560" height="640" role="img" aria-label="錐体路と感覚の伝導路が交叉する高さの模式図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>錐体路と感覚の伝導路が交叉する高さの模式図</title><rect width="560" height="640" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker></defs><line x1="100" y1="110" x2="545" y2="110" stroke="#d8e4ee" stroke-width="1.5"/><text x="92" y="116" font-size="16" fill="#607487" font-weight="bold" text-anchor="end" >大脳皮質</text><line x1="100" y1="170" x2="545" y2="170" stroke="#d8e4ee" stroke-width="1.5"/><text x="92" y="176" font-size="16" fill="#607487" font-weight="bold" text-anchor="end" >視床</text><line x1="100" y1="230" x2="545" y2="230" stroke="#d8e4ee" stroke-width="1.5"/><text x="92" y="236" font-size="16" fill="#607487" font-weight="bold" text-anchor="end" >中脳</text><line x1="100" y1="290" x2="545" y2="290" stroke="#d8e4ee" stroke-width="1.5"/><text x="92" y="296" font-size="16" fill="#607487" font-weight="bold" text-anchor="end" >橋</text><line x1="100" y1="360" x2="545" y2="360" stroke="#d8e4ee" stroke-width="1.5"/><text x="92" y="366" font-size="16" fill="#607487" font-weight="bold" text-anchor="end" >延髄</text><line x1="100" y1="450" x2="545" y2="450" stroke="#d8e4ee" stroke-width="1.5"/><text x="92" y="456" font-size="16" fill="#607487" font-weight="bold" text-anchor="end" >脊髄</text><text x="190" y="34" font-size="19" fill="#cf2634" font-weight="bold" text-anchor="middle" >錐体路</text><text x="190" y="58" font-size="13.5" fill="#142638" font-weight="normal" text-anchor="middle" >運動（下り）</text><line x1="190" y1="80" x2="190" y2="500" stroke="#9aa9b8" stroke-width="1.5" stroke-dasharray="4 5"/><text x="330" y="34" font-size="19" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >後索路</text><text x="330" y="58" font-size="13.5" fill="#142638" font-weight="normal" text-anchor="middle" >深部感覚・細かい触覚</text><line x1="330" y1="80" x2="330" y2="500" stroke="#9aa9b8" stroke-width="1.5" stroke-dasharray="4 5"/><text x="470" y="34" font-size="19" fill="#2e8b57" font-weight="bold" text-anchor="middle" >脊髄視床路</text><text x="470" y="58" font-size="13.5" fill="#142638" font-weight="normal" text-anchor="middle" >温度覚・痛覚</text><line x1="470" y1="80" x2="470" y2="500" stroke="#9aa9b8" stroke-width="1.5" stroke-dasharray="4 5"/><polyline points="160,96 160,380 220,404 220,520" fill="none" stroke="#cf2634" stroke-width="5" marker-end="url(#ahr)"/><circle cx="190" cy="392" r="10" fill="none" stroke="#cf2634" stroke-width="3"/><polyline points="360,530 360,370 300,346 300,100" fill="none" stroke="#0b5ea8" stroke-width="5" marker-end="url(#ahb)"/><circle cx="330" cy="358" r="10" fill="none" stroke="#0b5ea8" stroke-width="3"/><polyline points="500,530 500,486 440,462 440,100" fill="none" stroke="#2e8b57" stroke-width="5" marker-end="url(#ahb)"/><circle cx="470" cy="474" r="10" fill="none" stroke="#2e8b57" stroke-width="3"/><rect x="286" y="160" width="28" height="20" rx="4" fill="#0b5ea8"/><rect x="426" y="160" width="28" height="20" rx="4" fill="#2e8b57"/><text x="20" y="568" font-size="16" fill="#142638" font-weight="bold" text-anchor="start" >○＝交叉する所</text><text x="20" y="594" font-size="16" fill="#142638" font-weight="normal" text-anchor="start" >錐体路＝延髄の下部　後索路＝延髄　温痛覚＝脊髄</text><text x="20" y="620" font-size="15" fill="#607487" font-weight="normal" text-anchor="start" >感覚はどれも視床（■）で中継されて大脳皮質へ</text></svg>