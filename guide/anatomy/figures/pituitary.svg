<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 600" width="560" height="600" role="img" aria-label="下垂体の前葉と後葉のホルモンと視床下部とのつながりの模式図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>下垂体の前葉と後葉のホルモンと視床下部とのつながりの模式図</title><rect width="560" height="600" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker></defs><rect x="90" y="20" width="380" height="64" rx="10" fill="#efeafb" stroke="#6a4fb3" stroke-width="2"/><text x="280.0" y="49.0" font-size="22" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >視床下部（間脳）</text><text x="280.0" y="69.0" font-size="15" fill="#142638" font-weight="normal" text-anchor="middle" >ホルモンの司令塔</text><text x="146" y="126" font-size="15" fill="#cf2634" font-weight="bold" text-anchor="end" >血管（下垂体門脈）</text><text x="414" y="126" font-size="15" fill="#0b5ea8" font-weight="bold" text-anchor="start" >神経の軸索</text><path d="M180,86 C180,110 150,130 150,160" fill="none" stroke="#cf2634" stroke-width="4" marker-end="url(#ahr)"/><path d="M380,86 C380,110 410,130 410,160" fill="none" stroke="#0b5ea8" stroke-width="4" marker-end="url(#ahb)"/><rect x="20" y="164" width="260" height="336" rx="14" fill="#fdecee" stroke="#cf2634" stroke-width="2.5"/><rect x="300" y="164" width="240" height="336" rx="14" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2.5"/><text x="150" y="198" font-size="20" fill="#9c1c26" font-weight="bold" text-anchor="middle" >前葉（腺下垂体）</text><text x="420" y="198" font-size="19" fill="#073b6a" font-weight="bold" text-anchor="middle" >後葉（神経下垂体）</text><text x="38" y="236" font-size="17.5" fill="#142638" font-weight="normal" text-anchor="start" >成長ホルモン</text><text x="38" y="278" font-size="17.5" fill="#142638" font-weight="normal" text-anchor="start" >プロラクチン</text><text x="38" y="320" font-size="17.5" fill="#142638" font-weight="normal" text-anchor="start" >甲状腺刺激ホルモン</text><text x="38" y="362" font-size="17.5" fill="#142638" font-weight="normal" text-anchor="start" >副腎皮質刺激ホルモン</text><text x="38" y="404" font-size="17.5" fill="#142638" font-weight="normal" text-anchor="start" >卵胞刺激ホルモン</text><text x="38" y="446" font-size="17.5" fill="#142638" font-weight="normal" text-anchor="start" >黄体形成ホルモン</text><text x="316" y="236" font-size="17.5" fill="#142638" font-weight="normal" text-anchor="start" >バソプレシン</text><text x="316" y="278" font-size="17.5" fill="#142638" font-weight="normal" text-anchor="start" >（抗利尿ホルモン）</text><text x="316" y="320" font-size="17.5" fill="#142638" font-weight="normal" text-anchor="start" >オキシトシン</text><text x="316" y="376" font-size="14.5" fill="#607487" font-weight="normal" text-anchor="start" >つくるのは視床下部、</text><text x="316" y="398" font-size="14.5" fill="#607487" font-weight="normal" text-anchor="start" >後葉は「出すだけ」</text><text x="20" y="536" font-size="17" fill="#142638" font-weight="bold" text-anchor="start" >場所：蝶形骨のトルコ鞍の中</text><text x="20" y="566" font-size="17" fill="#142638" font-weight="normal" text-anchor="start" >前葉＝ホルモン6つ　後葉＝2つ</text></svg>