<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 640" width="560" height="640" role="img" aria-label="足の骨とショパール関節・リスフラン関節の模式図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>足の骨とショパール関節・リスフラン関節の模式図</title><rect width="560" height="640" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker></defs><text x="20" y="30" font-size="17" fill="#607487" font-weight="normal" text-anchor="start" >右足を上（足の甲）から見た図（模式）</text><text x="20" y="60" font-size="16" fill="#607487" font-weight="normal" text-anchor="start" >← 母趾側</text><text x="390" y="60" font-size="16" fill="#607487" font-weight="normal" text-anchor="end" >小趾側 →</text><rect x="160" y="96" width="55" height="152" rx="12" fill="#f4f6f8" stroke="#9aa9b8" stroke-width="1.5"/><text x="187.5" y="126" font-size="17" fill="#607487" font-weight="bold" text-anchor="middle" >Ⅰ</text><rect x="219" y="86" width="34" height="162" rx="12" fill="#f4f6f8" stroke="#9aa9b8" stroke-width="1.5"/><text x="236.0" y="116" font-size="17" fill="#607487" font-weight="bold" text-anchor="middle" >Ⅱ</text><rect x="256" y="92" width="42" height="156" rx="12" fill="#f4f6f8" stroke="#9aa9b8" stroke-width="1.5"/><text x="277.0" y="122" font-size="17" fill="#607487" font-weight="bold" text-anchor="middle" >Ⅲ</text><rect x="302" y="104" width="34" height="236" rx="12" fill="#f4f6f8" stroke="#9aa9b8" stroke-width="1.5"/><text x="319.0" y="134" font-size="17" fill="#607487" font-weight="bold" text-anchor="middle" >Ⅳ</text><rect x="338" y="118" width="34" height="222" rx="12" fill="#f4f6f8" stroke="#9aa9b8" stroke-width="1.5"/><text x="355.0" y="148" font-size="17" fill="#607487" font-weight="bold" text-anchor="middle" >Ⅴ</text><text x="20" y="170" font-size="17" fill="#607487" font-weight="bold" text-anchor="start" >中足骨</text><rect x="160" y="252" width="55" height="76" rx="6" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2"/><text x="187.5" y="284" font-size="15" fill="#073b6a" font-weight="bold" text-anchor="middle" >内</text><text x="187.5" y="304" font-size="15" fill="#073b6a" font-weight="bold" text-anchor="middle" >側</text><rect x="219" y="252" width="34" height="76" rx="6" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2"/><text x="236.0" y="284" font-size="15" fill="#073b6a" font-weight="bold" text-anchor="middle" >中</text><text x="236.0" y="304" font-size="15" fill="#073b6a" font-weight="bold" text-anchor="middle" >間</text><rect x="256" y="252" width="42" height="76" rx="6" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2"/><text x="277.0" y="284" font-size="15" fill="#073b6a" font-weight="bold" text-anchor="middle" >外</text><text x="277.0" y="304" font-size="15" fill="#073b6a" font-weight="bold" text-anchor="middle" >側</text><text x="20" y="296" font-size="17" fill="#0b5ea8" font-weight="bold" text-anchor="start" >楔状骨</text><text x="20" y="316" font-size="15" fill="#607487" font-weight="normal" text-anchor="start" >（3個）</text><rect x="160" y="332" width="138" height="46" rx="10" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2"/><text x="229.0" y="361.48" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >舟状骨</text><rect x="302" y="344" width="70" height="92" rx="10" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2"/><text x="337.0" y="396.12" font-size="17" fill="#073b6a" font-weight="bold" text-anchor="middle" >立方骨</text><rect x="240" y="440" width="132" height="150" rx="10" fill="#fff" stroke="#073b6a" stroke-width="2"/><text x="306.0" y="522.56" font-size="21" fill="#073b6a" font-weight="bold" text-anchor="middle" >踵骨</text><rect x="170" y="382" width="128" height="96" rx="10" fill="#fff" stroke="#073b6a" stroke-width="2"/><text x="234.0" y="437.56" font-size="21" fill="#073b6a" font-weight="bold" text-anchor="middle" >距骨</text><polyline points="150,380 300,380 300,438 382,438" fill="none" stroke="#cf2634" stroke-width="4" stroke-linejoin="round" stroke-dasharray="9 5"/><polyline points="150,250 300,250 300,341 382,341" fill="none" stroke="#0b5ea8" stroke-width="4" stroke-linejoin="round" stroke-dasharray="9 5"/><text x="400" y="230" font-size="17" fill="#0b5ea8" font-weight="bold" text-anchor="start" >リスフラン関節</text><text x="400" y="254.0" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >＝楔状骨・立方骨</text><text x="400" y="275.75" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >　と中足骨の間</text><text x="400" y="450" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="start" >ショパール関節</text><text x="400" y="474.0" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >＝距舟関節</text><text x="400" y="495.75" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >　＋踵立方関節</text><text x="20" y="614" font-size="17" fill="#142638" font-weight="bold" text-anchor="start" >足根骨は7個：距骨・踵骨・舟状骨・立方骨・楔状骨×3</text></svg>