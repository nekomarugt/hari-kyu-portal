<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="560" height="560" role="img" aria-label="回旋筋腱板の4筋と上腕骨への付着の模式図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>回旋筋腱板の4筋と上腕骨への付着の模式図</title><rect width="560" height="560" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker></defs><text x="20" y="32" font-size="19" fill="#607487" font-weight="normal" text-anchor="start" >肩甲骨から → 上腕骨の頭のすぐ横へ</text><rect x="352" y="56" width="188" height="392" rx="16" fill="#f7efdc" stroke="#b9a37a" stroke-width="2"/><text x="446" y="82" font-size="20" fill="#7a5a1c" font-weight="bold" text-anchor="middle" >上腕骨</text><rect x="366" y="96" width="160" height="236" rx="10" fill="#fff" stroke="#0b5ea8" stroke-width="2"/><text x="446" y="120" font-size="20" fill="#073b6a" font-weight="bold" text-anchor="middle" >大結節</text><rect x="380" y="132" width="132" height="54" rx="8" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="1.5"/><text x="446" y="166" font-size="20" fill="#073b6a" font-weight="bold" text-anchor="middle" >上</text><rect x="380" y="196" width="132" height="54" rx="8" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="1.5"/><text x="446" y="230" font-size="20" fill="#073b6a" font-weight="bold" text-anchor="middle" >中</text><rect x="380" y="260" width="132" height="54" rx="8" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="1.5"/><text x="446" y="294" font-size="20" fill="#073b6a" font-weight="bold" text-anchor="mid