<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 450" width="560" height="450" role="img" aria-label="胆汁の通り道（模式図）" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>胆汁の通り道（模式図）</title><rect width="560" height="450" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12705f"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4531c"/></marker></defs><rect x="60" y="10" width="300" height="38" rx="8" fill="#fbe9d9" stroke="#b4531c" stroke-width="2"/><text x="210.0" y="33.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="bold">肝細胞でつくられる</text><line x1="210" y1="49" x2="210" y2="67" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><rect x="60" y="68" width="300" height="38" rx="8" fill="#dff0e9" stroke="#12705f" stroke-width="2"/><text x="210.0" y="91.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">毛細胆管 → 小葉間胆管</text><line x1="210" y1="107" x2="210" y2="125" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><rect x="60" y="126" width="300" height="38" rx="8" fill="#dff0e9" stroke="#12705f" stroke-width="2"/><text x="210.0" y="149.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">左肝管・右肝管（肝門を通る）</text><line x1="210" y1="165" x2="210" y2="183" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><rect x="60" y="184" width="300" height="38" rx="8" fill="#dff0e9" stroke="#12705f" stroke-width="2"/><text x="210.0" y="207.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">総肝管</text><line x1="210" y1="223" x2="210" y2="241" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><rect x="60" y="242" width="300" height="38" rx="8" fill="#dff0e9" stroke="#12705f" stroke-width="2"/><text x="210.0" y="265.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">総胆管（十二指腸の後ろを通る）</text><line x1="210" y1="281" x2="210" y2="299" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><rect x="60" y="300" width="300" height="38" rx="8" fill="#dff0e9" stroke="#12705f" stroke-width="2"/><text x="210.0" y="323.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">大十二指腸乳頭（主膵管と合流）</text><line x1="210" y1="339" x2="210" y2="357" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><rect x="60" y="358" width="300" height="38" rx="8" fill="#fbe9d9" stroke="#b4531c" stroke-width="2"/><text x="210.0" y="381.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="bold">十二指腸</text><rect x="390" y="130" width="150" height="56" rx="8" fill="#fcf8ec" stroke="#b4531c" stroke-width="2"/><text x="465.0" y="154.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="bold">胆囊</text><text x="465.0" y="170.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="bold">（濃縮して貯める）</text><line x1="360" y1="148" x2="388" y2="148" stroke="#12705f" stroke-width="3" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="465" y="206" font-size="12" fill="#b4531c" text-anchor="middle" font-weight="bold">胆囊管（流れは両方向）</text><line x1="465" y1="188" x2="465" y2="214" stroke="#6b8077" stroke-width="1.5" stroke-dasharray="6 5"/><text x="20" y="430" font-size="12" fill="#6b8077" text-anchor="start" font-weight="normal">胆汁は肝臓でつくる。胆囊は貯めて濃くするだけ。総胆管は胃の前を通らない。</text></svg>