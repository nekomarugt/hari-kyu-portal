<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 700" width="560" height="700" role="img" aria-label="腕神経叢の主な枝と上腕骨との位置関係の模式図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>腕神経叢の主な枝と上腕骨との位置関係の模式図</title><rect width="560" height="700" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker></defs><text x="20" y="28" font-size="16" fill="#607487" font-weight="normal" text-anchor="start" >右の上腕骨を前から見た図（模式）</text><text x="20" y="56" font-size="16" fill="#607487" font-weight="normal" text-anchor="start" >← 外側</text><text x="290" y="56" font-size="16" fill="#607487" font-weight="normal" text-anchor="end" >内側 →</text><path d="M150,150 C140,120 150,82 190,72 C230,64 262,92 256,128 C252,150 232,160 210,166 L204,480 C230,490 262,500 270,518 C250,532 225,528 205,530 L150,530 C132,528 118,524 108,516 C116,500 136,490 152,482 Z" fill="#f7efdc" stroke="#b9a37a" stroke-width="2.5"/><text x="200" y="118" font-size="17" fill="#7a5a1c" font-weight="bold" text-anchor="middle" >上腕骨</text><text x="152" y="190" font-size="13" fill="#7a5a1c" font-weight="normal" text-anchor="end" >外科頸</text><text x="246" y="552" font-size="13" fill="#7a5a1c" font-weight="normal" text-anchor="end" >内側上顆</text><path d="M285,146 C272,160 262,166 250,170" fill="none" stroke="#d9730d" stroke-width="6"/><path d="M250,170 C220,182 190,184 170,178 C148,170 130,158 120,140" fill="none" stroke="#d9730d" stroke-width="6" stroke-dasharray="8 5"/><path d="M275,200 C250,220 215,240 200,250" fill="none" stroke="#2e8b57" stroke-width="6"/><path d="M200,250 L156,410" fill="none" stroke="#2e8b57" stroke-width="6" stroke-dasharray="8 5"/><path d="M156,410 C140,440 126,480 124,560" fill="none" stroke="#2e8b57" stroke-width="6"/><path d="M282,210 C278,300 264,420 262,496" fill="none" stroke="#6a4fb3" stroke-width="6"/><path d="M262,496 C262,510 258,522 254,534" fill="none" stroke="#6a4fb3" stroke-width="6" stroke-dasharray="6 4"/><path d="M254,534 C252,560 256,590 262,620" fill="none" stroke="#6a4fb3" stroke-width="6"/><text x="20" y="640" font-size="15" fill="#607487" font-weight="normal" text-anchor="start" >点線＝骨の後ろを通る所（骨折でいたみやすい）</text><line x1="125" y1="142" x2="310" y2="104" stroke="#d9730d" stroke-width="1.8"/><circle cx="125" cy="142" r="3.5" fill="#d9730d"/><text x="314" y="110" font-size="20" fill="#d9730d" font-weight="bold" text-anchor="start" >腋窩神経</text><text x="314" y="134" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >外科頸の後ろを回る</text><text x="314" y="156" font-size="15" fill="#607487" font-weight="normal" text-anchor="start" >→ 三角筋・小円筋</text><line x1="175" y1="330" x2="310" y2="244" stroke="#2e8b57" stroke-width="1.8"/><circle cx="175" cy="330" r="3.5" fill="#2e8b57"/><text x="314" y="250" font-size="20" fill="#2e8b57" font-weight="bold" text-anchor="start" >橈骨神経</text><text x="314" y="274" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >骨体の後ろ（橈骨神経溝）</text><text x="314" y="296" font-size="15" fill="#607487" font-weight="normal" text-anchor="start" >→ 上腕・前腕の伸筋</text><line x1="260" y1="520" x2="310" y2="384" stroke="#6a4fb3" stroke-width="1.8"/><circle cx="260" cy="520" r="3.5" fill="#6a4fb3"/><text x="314" y="390" font-size="20" fill="#6a4fb3" font-weight="bold" text-anchor="start" >尺骨神経</text><text x="314" y="414" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >内側上顆の後ろ</text><text x="314" y="436" font-size="15" fill="#607487" font-weight="normal" text-anchor="start" >→ 手の内在筋の多く</text><rect x="306" y="500" width="240" height="118" rx="10" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="2"/><text x="318" y="526" font-size="14.5" fill="#073b6a" font-weight="bold" text-anchor="start" >筋皮神経</text><text x="318" y="551" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >烏口腕筋を貫く→上腕の屈筋</text><text x="318" y="576" font-size="14.5" fill="#073b6a" font-weight="bold" text-anchor="start" >正中神経</text><text x="318" y="601" font-size="14.5" fill="#142638" font-weight="normal" text-anchor="start" >肘窩→前腕屈筋の大部分・母指球</text></svg>