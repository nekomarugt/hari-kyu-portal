<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="560" height="560" role="img" aria-label="手根骨8個の並びの模式図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>手根骨8個の並びの模式図</title><rect width="560" height="560" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker></defs><text x="20" y="30" font-size="17" fill="#607487" font-weight="normal" text-anchor="start" >左手を手のひら側から見た図（模式）</text><text x="24" y="60" font-size="18" fill="#0b5ea8" font-weight="bold" text-anchor="start" >← 橈側（親指側）</text><text x="536" y="60" font-size="18" fill="#0b5ea8" font-weight="bold" text-anchor="end" >尺側（小指側）→</text><rect x="48" y="80" width="100" height="70" rx="12" fill="#f4f6f8" stroke="#9aa9b8" stroke-width="1.5"/><text x="98.0" y="122" font-size="20" fill="#607487" font-weight="bold" text-anchor="middle" >Ⅰ</text><rect x="170" y="80" width="100" height="70" rx="12" fill="#f4f6f8" stroke="#9aa9b8" stroke-width="1.5"/><text x="220.0" y="122" font-size="20" fill="#607487" font-weight="bold" text-anchor="middle" >Ⅱ</text><rect x="292" y="80" width="100" height="70" rx="12" fill="#f4f6f8" stroke="#9aa9b8" stroke-width="1.5"/><text x="342.0" y="122" font-size="20" fill="#607487" font-weight="bold" text-anchor="middle" >Ⅲ</text><rect x="404" y="80" width="54" height="70" rx="12" fill="#f4f6f8" stroke="#9aa9b8" stroke-width="1.5"/><text x="431.0" y="122" font-size="20" fill="#607487" font-weight="bold" text-anchor="middle" >Ⅳ</text><rect x="466" y="80" width="54" height="70" rx="12" fill="#f4f6f8" stroke="#9aa9b8" stroke-width="1.5"/><text x="493.0" y="122" font-size="20" fill="#607487" font-weight="bold" text-anchor="middle" >Ⅴ</text><text x="280" y="172" font-size="15" fill="#607487" font-weight="normal" text-anchor="middle" >中手骨（上）</text><rect x="40" y="184" width="116" height="70" rx="10" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2"/><text x="98.0" y="226.2" font-size="20" fill="#073b6a" font-weight="bold" text-anchor="middle" >大菱形骨</text><rect x="162" y="184" width="116" height="70" rx="10" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2"/><text x="220.0" y="226.2" font-size="20" fill="#073b6a" font-weight="bold" text-anchor="middle" >小菱形骨</text><rect x="284" y="184" width="116" height="70" rx="10" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2"/><text x="342.0" y="226.2" font-size="20" fill="#073b6a" font-weight="bold" text-anchor="middle" >有頭骨</text><rect x="406" y="184" width="116" height="70" rx="10" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2"/><text x="464.0" y="226.2" font-size="20" fill="#073b6a" font-weight="bold" text-anchor="middle" >有鈎骨</text><rect x="40" y="264" width="116" height="70" rx="10" fill="#fff" stroke="#073b6a" stroke-width="2"/><text x="98.0" y="306.2" font-size="20" fill="#073b6a" font-weight="bold" text-anchor="middle" >舟状骨</text><rect x="162" y="264" width="116" height="70" rx="10" fill="#fff" stroke="#073b6a" stroke-width="2"/><text x="220.0" y="306.2" font-size="20" fill="#073b6a" font-weight="bold" text-anchor="middle" >月状骨</text><rect x="284" y="264" width="116" height="70" rx="10" fill="#fff" stroke="#073b6a" stroke-width="2"/><text x="342.0" y="306.2" font-size="20" fill="#073b6a" font-weight="bold" text-anchor="middle" >三角骨</text><circle cx="468" cy="300" r="40" fill="#fff4d6" stroke="#b77a00" stroke-width="2"/><text x="468" y="307" font-size="19" fill="#7a4b00" font-weight="bold" text-anchor="middle" >豆状骨</text><text x="24" y="222" font-size="15" fill="#607487" font-weight="normal" text-anchor="middle" transform="rotate(-90 24 222)">遠位列</text><text x="24" y="300" font-size="15" fill="#607487" font-weight="normal" text-anchor="middle" transform="rotate(-90 24 300)">近位列</text><ellipse cx="98" cy="167" rx="44" ry="9" fill="none" stroke="#cf2634" stroke-width="2.5" stroke-dasharray="5 3"/><rect x="40" y="360" width="238" height="80" rx="14" fill="#f7efdc" stroke="#b9a37a" stroke-width="2"/><text x="159" y="408" font-size="21" fill="#7a5a1c" font-weight="bold" text-anchor="middle" >橈骨</text><polygon points="290,352 400,352 345,378" fill="#fff4d6" stroke="#b77a00" stroke-width="1.5"/><rect x="300" y="386" width="100" height="54" rx="14" fill="#f7efdc" stroke="#b9a37a" stroke-width="2"/><text x="350" y="420" font-size="21" fill="#7a5a1c" font-weight="bold" text-anchor="middle" >尺骨</text><text x="410" y="372" font-size="15" fill="#607487" font-weight="normal" text-anchor="start" >← 関節円板</text><text x="20" y="474" font-size="17" fill="#607487" font-weight="normal" text-anchor="start" >覚え方（どちらも親指側から）</text><text x="20" y="502" font-size="20" fill="#073b6a" font-weight="bold" text-anchor="start" >近位：舟・月・三角・豆</text><text x="20" y="530" font-size="20" fill="#0b5ea8" font-weight="bold" text-anchor="start" >遠位：大・小・有頭・有鈎</text><text x="300" y="502" font-size="16" fill="#cf2634" font-weight="normal" text-anchor="start" >赤の点線＝母指CM関節</text><text x="300" y="526" font-size="16" fill="#cf2634" font-weight="normal" text-anchor="start" >（鞍関節）</text></svg>