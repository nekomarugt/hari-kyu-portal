<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380" role="img" aria-label="消化管の壁の4層（断面の模式図）" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>消化管の壁の4層（断面の模式図）</title><rect width="560" height="380" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12705f"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4531c"/></marker></defs><circle cx="150" cy="190" r="150" fill="#f6ead2" stroke="#12705f" stroke-width="2"/><circle cx="150" cy="190" r="122" fill="#e7d3a8" stroke="#12705f" stroke-width="2"/><circle cx="150" cy="190" r="96" fill="#cfe6dc" stroke="#12705f" stroke-width="2"/><circle cx="150" cy="190" r="66" fill="#f9d8c8" stroke="#12705f" stroke-width="2"/><circle cx="150" cy="190" r="34" fill="#ffffff" stroke="#12705f" stroke-width="2"/><text x="150" y="196" font-size="14" fill="#6b8077" text-anchor="middle" font-weight="normal">内腔</text><line x1="256" y1="84" x2="318" y2="34" stroke="#6b8077" stroke-width="1.5"/><text x="326" y="38" font-size="14" fill="#0c4a40" text-anchor="start" font-weight="bold">④ 漿膜（外膜）</text><text x="326" y="56" font-size="11" fill="#17261f" text-anchor="start" font-weight="normal">腹膜におおわれる所は漿膜。</text><text x="326" y="70" font-size="11" fill="#17261f" text-anchor="start" font-weight="normal">腹膜がない所（食道など）は外膜</text><line x1="250" y1="174" x2="318" y2="114" stroke="#6b8077" stroke-width="1.5"/><text x="326" y="118" font-size="14" fill="#0c4a40" text-anchor="start" font-weight="bold">③ 筋層</text><text x="326" y="136" font-size="11" fill="#17261f" text-anchor="start" font-weight="normal">内輪走筋と外縦走筋。</text><text x="326" y="150" font-size="11" fill="#17261f" text-anchor="start" font-weight="normal">蠕動をつくる（筋層間神経叢）</text><line x1="230" y1="240" x2="318" y2="198" stroke="#6b8077" stroke-width="1.5"/><text x="326" y="202" font-size="14" fill="#0c4a40" text-anchor="start" font-weight="bold">② 粘膜下組織</text><text x="326" y="220" font-size="11" fill="#17261f" text-anchor="start" font-weight="normal">血管・リンパ管・神経（粘膜下神経叢）</text><line x1="200" y1="214" x2="318" y2="274" stroke="#6b8077" stroke-width="1.5"/><text x="326" y="278" font-size="14" fill="#0c4a40" text-anchor="start" font-weight="bold">① 粘膜</text><text x="326" y="296" font-size="11" fill="#17261f" text-anchor="start" font-weight="normal">上皮・粘膜固有層・粘膜筋板</text><rect x="14" y="336" width="532" height="34" rx="8" fill="#fcf8ec" stroke="#e3d9bd" stroke-width="2"/><text x="280.0" y="357.32" font-size="12" fill="#17261f" text-anchor="middle" font-weight="normal">内側から ①粘膜 → ②粘膜下組織 → ③筋層 → ④漿膜（外膜）。胃では筋層が3層（斜・輪・縦）。</text></svg>