<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" width="560" height="500" role="img" aria-label="視床下部・下垂体前葉・標的腺の階層と負のフィードバック、下垂体後葉の模式図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>視床下部・下垂体前葉・標的腺の階層と負のフィードバック、下垂体後葉の模式図</title><rect width="560" height="500" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><rect x="40" y="20" width="250" height="64" rx="10" fill="#eaf4fc" stroke="#073b6a" stroke-width="2"/><text x="165.0" y="49.0" font-size="20" fill="#073b6a" font-weight="bold" text-anchor="middle" >視床下部</text><text x="165.0" y="67.0" font-size="13" fill="#142638" font-weight="normal" text-anchor="middle" >放出ホルモン</text><line x1="165.0" y1="86" x2="165.0" y2="126" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><rect x="40" y="130" width="250" height="64" rx="10" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2"/><text x="165.0" y="159.0" font-size="20" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >下垂体前葉</text><text x="165.0" y="177.0" font-size="13" fill="#142638" font-weight="normal" text-anchor="middle" >刺激ホルモン（TSH・ACTHなど）</text><line x1="165.0" y1="196" x2="165.0" y2="236" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><rect x="40" y="240" width="250" height="64" rx="10" fill="#e2f5f9" stroke="#28a9c7" stroke-width="2"/><text x="165.0" y="269.0" font-size="20" fill="#0f6f86" font-weight="bold" text-anchor="middle" >標的の腺</text><text x="165.0" y="287.0" font-size="13" fill="#142638" font-weight="normal" text-anchor="middle" >例：甲状腺・副腎皮質</text><line x1="165.0" y1="306" x2="165.0" y2="346" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><rect x="40" y="350" width="250" height="64" rx="10" fill="#e5f5ec" stroke="#2e8b57" stroke-width="2"/><text x="165.0" y="379.0" font-size="20" fill="#2e8b57" font-weight="bold" text-anchor="middle" >ホルモン</text><text x="165.0" y="397.0" font-size="13" fill="#142638" font-weight="normal" text-anchor="middle" >例：甲状腺ホルモン・コルチゾール</text><line x1="165.0" y1="416" x2="165.0" y2="446" stroke="#2e8b57" stroke-width="3" marker-end="url(#ahg)"/><text x="175.0" y="444" font-size="14" fill="#2e8b57" font-weight="bold" text-anchor="start" >全身の標的細胞へ</text><polyline points="292.0,382.0 330.0,382.0 330.0,52.0 296.0,52.0" fill="none" stroke="#cf2634" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahr)" stroke-dasharray="8 5"/><polyline points="330.0,162.0 296.0,162.0" fill="none" stroke="#cf2634" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahr)" stroke-dasharray="8 5"/><rect x="310.0" y="227" width="40.0" height="26" rx="13" fill="#cf2634"/><text x="330" y="247.92" font-size="22" fill="#fff" font-weight="bold" text-anchor="middle" >−</text><text x="344" y="280" font-size="14" fill="#cf2634" font-weight="bold" text-anchor="start" >負のフィードバック</text><text x="344" y="302" font-size="14" fill="#142638" font-weight="normal" text-anchor="start" >ホルモンが増えすぎると</text><text x="344" y="324" font-size="14" fill="#142638" font-weight="normal" text-anchor="start" >上の段の分泌を抑える</text><rect x="370" y="20" width="178" height="180" rx="12" fill="#efeafb" stroke="#6a4fb3" stroke-width="2" /><text x="459" y="48" font-size="17" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >下垂体後葉</text><text x="459" y="78" font-size="13" fill="#142638" font-weight="normal" text-anchor="middle" >視床下部で</text><text x="459" y="97" font-size="13" fill="#142638" font-weight="normal" text-anchor="middle" >つくり、後葉から</text><text x="459" y="116" font-size="13" fill="#142638" font-weight="normal" text-anchor="middle" >血中へ放出</text><text x="459" y="148" font-size="15" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >バソプレシン</text><text x="459" y="170" font-size="15" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >オキシトシン</text></svg>