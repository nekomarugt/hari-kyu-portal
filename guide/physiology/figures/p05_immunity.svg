<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" width="560" height="470" role="img" aria-label="自然免疫と獲得免疫（体液性・細胞性）の整理図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>自然免疫と獲得免疫（体液性・細胞性）の整理図</title><rect width="560" height="470" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><rect x="20" y="14" width="520" height="110" rx="12" fill="#e5f5ec" stroke="#2e8b57" stroke-width="2" /><text x="36" y="44" font-size="18" fill="#2e8b57" font-weight="bold" text-anchor="start" >自然免疫（すばやい・相手を選ばない）</text><text x="36" y="78" font-size="19" fill="#142638" font-weight="bold" text-anchor="start" >好中球・マクロファージ</text><text x="36" y="106" font-size="17" fill="#142638" font-weight="normal" text-anchor="start" >→ 異物を貪食（食べて処理）</text><rect x="20" y="140" width="520" height="316" rx="12" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2" /><text x="36" y="170" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="start" >獲得免疫（特定の抗原を認識・記憶）</text><text x="36" y="204" font-size="17" fill="#0b5ea8" font-weight="bold" text-anchor="start" >体液性免疫</text><rect x="36" y="216" width="104" height="48" rx="10" fill="#fff" stroke="#0b5ea8" stroke-width="2"/><text x="88.0" y="246.48" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >B細胞</text><line x1="142" y1="240" x2="178" y2="240" stroke="#0b5ea8" stroke-width="2.5" marker-end="url(#ahb)"/><rect x="182" y="216" width="120" height="48" rx="10" fill="#fff" stroke="#0b5ea8" stroke-width="2"/><text x="242.0" y="246.48" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >形質細胞</text><line x1="304" y1="240" x2="340" y2="240" stroke="#0b5ea8" stroke-width="2.5" marker-end="url(#ahb)"/><rect x="344" y="216" width="180" height="48" rx="10" fill="#0b5ea8" stroke="#0b5ea8" stroke-width="2"/><text x="434.0" y="246.48" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle" >抗体を産生</text><text x="60" y="296" font-size="17" fill="#073b6a" font-weight="bold" text-anchor="start" >IgG</text><text x="112" y="296" font-size="16" fill="#142638" font-weight="normal" text-anchor="start" >血中で最多・胎盤を通過</text><text x="60" y="326" font-size="17" fill="#073b6a" font-weight="bold" text-anchor="start" >IgA</text><text x="112" y="326" font-size="16" fill="#142638" font-weight="normal" text-anchor="start" >唾液・涙・母乳など分泌液</text><text x="60" y="356" font-size="17" fill="#073b6a" font-weight="bold" text-anchor="start" >IgE</text><text x="112" y="356" font-size="16" fill="#142638" font-weight="normal" text-anchor="start" >即時型アレルギー</text><line x1="36" y1="372" x2="524" y2="372" stroke="#d8e4ee" stroke-width="2"/><text x="36" y="402" font-size="17" fill="#6a4fb3" font-weight="bold" text-anchor="start" >細胞性免疫</text><rect x="36" y="412" width="104" height="36" rx="10" fill="#fff" stroke="#6a4fb3" stroke-width="2"/><text x="88.0" y="436.12" font-size="17" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >T細胞</text><text x="152" y="436" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >→ 細胞どうしの働きで異物・感染細胞に対処</text></svg>