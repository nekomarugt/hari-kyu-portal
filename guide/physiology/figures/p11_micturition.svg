<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 450" width="560" height="450" role="img" aria-label="蓄尿時と排尿時の膀胱平滑筋・内外尿道括約筋と神経の働きの比較" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>蓄尿時と排尿時の膀胱平滑筋・内外尿道括約筋と神経の働きの比較</title><rect width="560" height="450" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><text x="140" y="30" font-size="20" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >蓄尿（ためる）</text><rect x="12" y="44" width="256" height="330" rx="12" fill="#f3f8fc" stroke="#0b5ea8" stroke-width="2" /><ellipse cx="140" cy="118" rx="70" ry="54" fill="#fff" stroke="#0b5ea8" stroke-width="2"/><text x="140" y="124" font-size="17" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >膀胱</text><rect x="128" y="170" width="24" height="50" rx="4" fill="#fff" stroke="#9aa9b8" stroke-width="2" /><text x="420" y="30" font-size="20" fill="#2e8b57" font-weight="bold" text-anchor="middle" >排尿（出す）</text><rect x="292" y="44" width="256" height="330" rx="12" fill="#e5f5ec" stroke="#2e8b57" stroke-width="2" /><ellipse cx="420" cy="118" rx="58" ry="46" fill="#fff" stroke="#2e8b57" stroke-width="3"/><text x="420" y="124" font-size="17" fill="#2e8b57" font-weight="bold" text-anchor="middle" >膀胱</text><rect x="408" y="170" width="24" height="50" rx="4" fill="#fff" stroke="#9aa9b8" stroke-width="2" /><text x="28" y="250" font-size="14" fill="#142638" font-weight="normal" text-anchor="start" >膀胱平滑筋</text><text x="250" y="250" font-size="15" fill="#0b5ea8" font-weight="bold" text-anchor="end" >弛緩（交感）</text><text x="308" y="250" font-size="14" fill="#142638" font-weight="normal" text-anchor="start" >膀胱平滑筋</text><text x="530" y="250" font-size="15" fill="#2e8b57" font-weight="bold" text-anchor="end" >収縮（副交感）</text><text x="28" y="290" font-size="14" fill="#142638" font-weight="normal" text-anchor="start" >内尿道括約筋</text><text x="250" y="290" font-size="15" fill="#0b5ea8" font-weight="bold" text-anchor="end" >収縮（交感）</text><text x="308" y="290" font-size="14" fill="#142638" font-weight="normal" text-anchor="start" >内尿道括約筋</text><text x="530" y="290" font-size="15" fill="#2e8b57" font-weight="bold" text-anchor="end" >弛緩</text><text x="28" y="330" font-size="14" fill="#142638" font-weight="normal" text-anchor="start" >外尿道括約筋</text><text x="250" y="330" font-size="15" fill="#0b5ea8" font-weight="bold" text-anchor="end" >収縮（陰部神経）</text><text x="308" y="330" font-size="14" fill="#142638" font-weight="normal" text-anchor="start" >外尿道括約筋</text><text x="530" y="330" font-size="15" fill="#2e8b57" font-weight="bold" text-anchor="end" >弛緩（陰部神経）</text><text x="28" y="360" font-size="13" fill="#607487" font-weight="normal" text-anchor="start" >外括約筋は横紋筋＝随意</text><text x="308" y="360" font-size="13" fill="#607487" font-weight="normal" text-anchor="start" >仙髄の排尿反射＋大脳の調節</text><text x="20" y="406" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="start" >蓄尿＝交感神経、排尿＝副交感神経が主役</text><text x="20" y="434" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >外尿道括約筋だけは陰部神経（体性神経）で自分でしめられる</text></svg>