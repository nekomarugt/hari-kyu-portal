<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="560" height="440" role="img" aria-label="免疫に働く細胞のつながり（模式図）" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>免疫に働く細胞のつながり（模式図）</title><rect width="560" height="440" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12705f"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4531c"/></marker></defs><rect x="20" y="20" width="150" height="46" rx="8" fill="#fcf8ec" stroke="#12705f" stroke-width="2"/><text x="95.0" y="48.04" font-size="14" fill="#17261f" text-anchor="middle" font-weight="bold">骨髄の幹細胞</text><line x1="95" y1="68" x2="95" y2="100" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><text x="95" y="118" font-size="13" fill="#0c4a40" text-anchor="middle" font-weight="bold">リンパ球</text><line x1="60" y1="124" x2="60" y2="150" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><line x1="130" y1="124" x2="245" y2="150" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><rect x="10" y="152" width="120" height="40" rx="8" fill="#dff0e9" stroke="#12705f" stroke-width="2"/><text x="70.0" y="168.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">T細胞</text><text x="70.0" y="184.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">（胸腺で成熟）</text><line x1="70" y1="194" x2="70" y2="226" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><rect x="10" y="228" width="120" height="62" rx="8" fill="#ffffff" stroke="#12705f" stroke-width="2"/><text x="70.0" y="248.32" font-size="12" fill="#17261f" text-anchor="middle" font-weight="normal">ヘルパーT細胞</text><text x="70.0" y="263.32" font-size="12" fill="#17261f" text-anchor="middle" font-weig