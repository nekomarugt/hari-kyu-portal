<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" role="img" aria-label="毛細血管での水の出入り（血圧と膠質浸透圧）とリンパの模式図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>毛細血管での水の出入り（血圧と膠質浸透圧）とリンパの模式図</title><rect width="560" height="420" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><text x="24" y="30" font-size="18" fill="#cf2634" font-weight="bold" text-anchor="start" >動脈側</text><text x="536" y="30" font-size="18" fill="#0b5ea8" font-weight="bold" text-anchor="end" >静脈側</text><defs><linearGradient id="cg" x1="0" x2="1"><stop offset="0" stop-color="#f6c9cd"/><stop offset="1" stop-color="#c9dcf2"/></linearGradient></defs><rect x="20" y="120" width="520" height="70" rx="35" fill="url(#cg)" stroke="#073b6a" stroke-width="2"/><line x1="60" y1="155" x2="500" y2="155" stroke="#607487" stroke-width="3" marker-end="url(#ah)"/><text x="280" y="147" font-size="16" fill="#073b6a" font-weight="bold" text-anchor="middle" >毛細血管（内皮細胞1層）</text><line x1="90" y1="118" x2="90" y2="64" stroke="#cf2634" stroke-width="3" marker-end="url(#ahr)"/><line x1="150" y1="118" x2="150" y2="64" stroke="#cf2634" stroke-width="3" marker-end="url(#ahr)"/><line x1="210" y1="118" x2="210" y2="64" stroke="#cf2634" stroke-width="3" marker-end="url(#ahr)"/><text x="150" y="54" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="middle" >血圧が水を押し出す</text><line x1="350" y1="64" x2="350" y2="116" stroke="#0b5ea8" stroke-width="3" marker-end="url(#ahb)"/><line x1="410" y1="64" x2="410" y2="116" stroke="#0b5ea8" stroke-width="3" marker-end="url(#ahb)"/><line x1="470" y1="64" x2="470" y2="116" stroke="#0b5ea8" stroke-width="3" marker-end="url(#ahb)"/><text x="410" y="54" font-size="17" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >膠質浸透圧が引き戻す</text><text x="410" y="216" font-size="15" fill="#607487" font-weight="normal" text-anchor="middle" >（主にアルブミンがつくる）</text><rect x="210" y="262" width="200" height="40" rx="20" fill="#e5f5ec" stroke="#2e8b57" stroke-width="2"/><text x="310" y="288" font-size="18" fill="#2e8b57" font-weight="bold" text-anchor="middle" >リンパ管</text><path d="M250,196 Q240,236 262,258" fill="none" stroke="#2e8b57" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahg)"/><text x="186" y="244" font-size="15" fill="#2e8b57" font-weight="normal" text-anchor="end" >戻りきらない組織液</text><line x1="412" y1="282" x2="500" y2="282" stroke="#2e8b57" stroke-width="2.5" marker-end="url(#ahg)"/><text x="506" y="288" font-size="15" fill="#2e8b57" font-weight="bold" text-anchor="start" >静脈へ</text><rect x="20" y="322" width="520" height="84" rx="10" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="2" /><text x="34" y="350" font-size="17" fill="#142638" font-weight="bold" text-anchor="start" >押す力が勝ちすぎる → 組織に水がたまる（浮腫）</text><text x="34" y="380" font-size="16" fill="#142638" font-weight="normal" text-anchor="start" >例：アルブミンが減ると“戻す力”が弱まる</text></svg>