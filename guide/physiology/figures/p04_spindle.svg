<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" role="img" aria-label="筋紡錘とゴルジ腱器官の位置と働きの比較" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>筋紡錘とゴルジ腱器官の位置と働きの比較</title><rect width="560" height="420" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><rect x="20" y="60" width="70" height="40" rx="8" fill="#f7efdc" stroke="#b9a37a" stroke-width="2" /><rect x="470" y="60" width="70" height="40" rx="8" fill="#f7efdc" stroke="#b9a37a" stroke-width="2" /><rect x="90" y="70" width="70" height="20" rx="4" fill="#fff" stroke="#9aa9b8" stroke-width="2" /><rect x="400" y="70" width="70" height="20" rx="4" fill="#fff" stroke="#9aa9b8" stroke-width="2" /><ellipse cx="280" cy="80" rx="124" ry="44" fill="#fdecee" stroke="#cf2634" stroke-width="2"/><ellipse cx="270" cy="92" rx="54" ry="11" fill="#fff" stroke="#0b5ea8" stroke-width="2.5"/><text x="280" y="58" font-size="16" fill="#cf2634" font-weight="bold" text-anchor="middle" >筋（筋腹）</text><rect x="418" y="72" width="30" height="16" rx="5" fill="#fff4d6" stroke="#b77a00" stroke-width="2.5"/><text x="125" y="128" font-size="16" fill="#607487" font-weight="normal" text-anchor="middle" >腱</text><line x1="270" y1="103" x2="220" y2="150" stroke="#0b5ea8" stroke-width="1.8"/><circle cx="270" cy="103" r="3.5" fill="#0b5ea8"/><line x1="433" y1="88" x2="440" y2="150" stroke="#b77a00" stroke-width="1.8"/><circle cx="433" cy="88" r="3.5" fill="#b77a00"/><rect x="20" y="156" width="252" height="250" rx="12" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2" /><text x="146" y="188" font-size="21" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >筋紡錘</text><text x="36" y="228" font-size="17" fill="#142638" font-weight="normal" text-anchor="start" >筋線維と並んでいる</text><text x="36" y="264" font-size="17" fill="#073b6a" font-weight="bold" text-anchor="start" >筋の長さ（伸び）を感知</text><text x="36" y="300" font-size="17" fill="#142638" font-weight="normal" text-anchor="start" >Ia群線維</text><text x="36" y="336" font-size="17" fill="#142638" font-weight="bold" text-anchor="start" >同じ筋を興奮させる</text><text x="36" y="372" font-size="17" fill="#142638" font-weight="normal" text-anchor="start" >→ 伸張反射</text><rect x="288" y="156" width="252" height="250" rx="12" fill="#fff4d6" stroke="#b77a00" stroke-width="2" /><text x="414" y="188" font-size="21" fill="#8a5c00" font-weight="bold" text-anchor="middle" >ゴルジ腱器官</text><text x="304" y="228" font-size="17" fill="#142638" font-weight="normal" text-anchor="start" >腱の中にある</text><text x="304" y="264" font-size="17" fill="#8a5c00" font-weight="bold" text-anchor="start" >筋の張力を感知</text><text x="304" y="300" font-size="17" fill="#142638" font-weight="normal" text-anchor="start" >Ib群線維</text><text x="304" y="336" font-size="17" fill="#142638" font-weight="bold" text-anchor="start" >同じ筋を抑制する</text><text x="304" y="372" font-size="17" fill="#142638" font-weight="normal" text-anchor="start" >→ 過大な張力から守る</text></svg>