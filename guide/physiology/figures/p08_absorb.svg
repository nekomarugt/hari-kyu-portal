<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" width="560" height="470" role="img" aria-label="糖質・タンパク質・脂質の消化産物の吸収経路（門脈とリンパ管）の模式図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>糖質・タンパク質・脂質の消化産物の吸収経路（門脈とリンパ管）の模式図</title><rect width="560" height="470" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><rect x="20" y="20" width="112" height="50" rx="10" fill="#fdecee" stroke="#cf2634" stroke-width="2"/><text x="76.0" y="51.48" font-size="18" fill="#cf2634" font-weight="bold" text-anchor="middle" >糖質</text><line x1="134" y1="45" x2="162" y2="45" stroke="#cf2634" stroke-width="2.5" marker-end="url(#ahr)"/><rect x="166" y="20" width="104" height="50" rx="10" fill="#fff" stroke="#cf2634" stroke-width="2"/><text x="218.0" y="51.48" font-size="18" fill="#cf2634" font-weight="bold" text-anchor="middle" >単糖</text><line x1="272" y1="45" x2="300" y2="45" stroke="#cf2634" stroke-width="2.5" marker-end="url(#ahr)"/><rect x="20" y="90" width="112" height="50" rx="10" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2"/><text x="76.0" y="121.48" font-size="18" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >タンパク質</text><line x1="134" y1="115" x2="162" y2="115" stroke="#0b5ea8" stroke-width="2.5" marker-end="url(#ahb)"/><rect x="166" y="90" width="104" height="50" rx="10" fill="#fff" stroke="#0b5ea8" stroke-width="2"/><text x="218.0" y="121.48" font-size="18" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >アミノ酸</text><line x1="272" y1="115" x2="300" y2="115" stroke="#0b5ea8" stroke-width="2.5" marker-end="url(#ahb)"/><rect x="304" y="20" width="236" height="120" rx="10" fill="#fdecee" stroke="#cf2634" stroke-width="2"/><text x="422.0" y="86.84" font-size="19" fill="#cf2634" font-weight="bold" text-anchor="middle" >毛細血管</text><rect x="304" y="20" width="236" height="120" rx="10" fill="#fdecee" stroke="#cf2634" stroke-width="2"/><text x="422" y="58" font-size="18" fill="#cf2634" font-weight="bold" text-anchor="middle" >絨毛の毛細血管</text><text x="422" y="90" font-size="18" fill="#cf2634" font-weight="bold" text-anchor="middle" >→ 門脈 → 肝臓</text><text x="422" y="118" font-size="14" fill="#142638" font-weight="normal" text-anchor="middle" >（水溶性のもの）</text><rect x="20" y="170" width="112" height="50" rx="10" fill="#fff4d6" stroke="#b77a00" stroke-width="2"/><text x="76.0" y="201.48" font-size="18" fill="#8a5c00" font-weight="bold" text-anchor="middle" >脂質</text><line x1="134" y1="195" x2="162" y2="195" stroke="#b77a00" stroke-width="2.5" marker-end="url(#ah)"/><rect x="166" y="170" width="374" height="50" rx="10" fill="#fff" stroke="#b77a00" stroke-width="2"/><text x="353.0" y="201.12" font-size="17" fill="#8a5c00" font-weight="bold" text-anchor="middle" >胆汁で乳化 → リパーゼで分解</text><line x1="353" y1="222" x2="353" y2="246" stroke="#b77a00" stroke-width="2.5" marker-end="url(#ah)"/><rect x="166" y="250" width="374" height="50" rx="10" fill="#fff" stroke="#b77a00" stroke-width="2"/><text x="353.0" y="281.12" font-size="17" fill="#8a5c00" font-weight="bold" text-anchor="middle" >上皮細胞で再合成 → カイロミクロン</text><line x1="353" y1="302" x2="353" y2="326" stroke="#b77a00" stroke-width="2.5" marker-end="url(#ah)"/><rect x="166" y="330" width="374" height="56" rx="10" fill="#fff4d6" stroke="#b77a00" stroke-width="2"/><text x="353.0" y="355.0" font-size="18" fill="#8a5c00" font-weight="bold" text-anchor="middle" >乳び管（リンパ管）</text><text x="353.0" y="374.0" font-size="14" fill="#142638" font-weight="normal" text-anchor="middle" >→ 胸管 → 静脈へ</text><text x="20" y="430" font-size="17" fill="#073b6a" font-weight="bold" text-anchor="start" >吸収面積を広げる：輪状ひだ → 絨毛 → 微絨毛</text><text x="20" y="456" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >胆汁は消化酵素を含まない（乳化するだけ）</text></svg>