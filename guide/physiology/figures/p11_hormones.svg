<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 450" width="560" height="450" role="img" aria-label="アルドステロン・バソプレシン・心房性ナトリウム利尿ペプチドによる体液量調節の比較" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>アルドステロン・バソプレシン・心房性ナトリウム利尿ペプチドによる体液量調節の比較</title><rect width="560" height="450" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><rect x="12" y="14" width="174" height="336" rx="12" fill="#fdecee" stroke="#cf2634" stroke-width="2" /><text x="99" y="48" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="middle" >アルドステロン</text><text x="99" y="76" font-size="13" fill="#142638" font-weight="normal" text-anchor="middle" >副腎皮質（球状層）</text><line x1="26" y1="92" x2="172" y2="92" stroke="#cf2634" stroke-width="1.5"/><text x="99" y="128" font-size="15" fill="#142638" font-weight="normal" text-anchor="middle" >遠位尿細管・集合管で</text><text x="99" y="158" font-size="15" fill="#cf2634" font-weight="bold" text-anchor="middle" >Na⁺再吸収↑</text><text x="99" y="188" font-size="15" fill="#142638" font-weight="normal" text-anchor="middle" >（水もついて戻る）</text><line x1="99" y1="230" x2="99" y2="262" stroke="#cf2634" stroke-width="3" marker-end="url(#ahr)"/><rect x="34" y="270" width="130" height="50" rx="10" fill="#fff" stroke="#cf2634" stroke-width="2"/><text x="99.0" y="302.2" font-size="20" fill="#cf2634" font-weight="bold" text-anchor="middle" >体液量↑</text><rect x="196" y="14" width="174" height="336" rx="12" fill="#efeafb" stroke="#6a4fb3" stroke-width="2" /><text x="283" y="48" font-size="19" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >バソプレシン</text><text x="283" y="76" font-size="13" fill="#142638" font-weight="normal" text-anchor="middle" >下垂体後葉から放出</text><line x1="210" y1="92" x2="356" y2="92" stroke="#6a4fb3" stroke-width="1.5"/><text x="283" y="128" font-size="15" fill="#142638" font-weight="normal" text-anchor="middle" >集合管で</text><text x="283" y="158" font-size="15" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >水の再吸収↑</text><text x="283" y="188" font-size="15" fill="#142638" font-weight="normal" text-anchor="middle" >（濃い尿が少し）</text><line x1="283" y1="230" x2="283" y2="262" stroke="#6a4fb3" stroke-width="3" marker-end="url(#ah)"/><rect x="218" y="270" width="130" height="50" rx="10" fill="#fff" stroke="#6a4fb3" stroke-width="2"/><text x="283.0" y="302.2" font-size="20" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >尿量↓</text><rect x="380" y="14" width="174" height="336" rx="12" fill="#e5f5ec" stroke="#2e8b57" stroke-width="2" /><text x="467" y="48" font-size="19" fill="#2e8b57" font-weight="bold" text-anchor="middle" >ANP</text><text x="467" y="76" font-size="13" fill="#142638" font-weight="normal" text-anchor="middle" >心房から分泌</text><line x1="394" y1="92" x2="540" y2="92" stroke="#2e8b57" stroke-width="1.5"/><text x="467" y="128" font-size="15" fill="#142638" font-weight="normal" text-anchor="middle" >Na⁺の排泄↑</text><text x="467" y="158" font-size="15" fill="#2e8b57" font-weight="bold" text-anchor="middle" >（水も尿へ）</text><text x="467" y="188" font-size="15" fill="#142638" font-weight="normal" text-anchor="middle" ></text><line x1="467" y1="230" x2="467" y2="262" stroke="#2e8b57" stroke-width="3" marker-end="url(#ahg)"/><rect x="402" y="270" width="130" height="50" rx="10" fill="#fff" stroke="#2e8b57" stroke-width="2"/><text x="467.0" y="302.2" font-size="20" fill="#2e8b57" font-weight="bold" text-anchor="middle" >体液量↓</text><text x="20" y="384" font-size="16" fill="#073b6a" font-weight="bold" text-anchor="start" >RAA系：腎血流↓ → レニン → アンジオテンシンⅡ</text><text x="20" y="410" font-size="16" fill="#073b6a" font-weight="normal" text-anchor="start" >　→ 血管収縮 ＋ アルドステロン分泌（体液量・血圧↑）</text><text x="20" y="436" font-size="16" fill="#2e8b57" font-weight="bold" text-anchor="start" >ANPはその逆向き：Na⁺と水を捨てて体液量を減らす</text></svg>