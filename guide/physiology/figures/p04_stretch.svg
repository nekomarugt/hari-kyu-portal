<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" width="560" height="480" role="img" aria-label="伸張反射の反射弓と相反神経抑制の模式図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>伸張反射の反射弓と相反神経抑制の模式図</title><rect width="560" height="480" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><rect x="20" y="40" width="170" height="330" rx="30" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="2" /><text x="105" y="66" font-size="19" fill="#073b6a" font-weight="bold" text-anchor="middle" >脊髄</text><ellipse cx="430" cy="110" rx="110" ry="46" fill="#fdecee" stroke="#cf2634" stroke-width="2"/><text x="430" y="100" font-size="19" fill="#cf2634" font-weight="bold" text-anchor="middle" >主働筋</text><text x="430" y="124" font-size="15" fill="#142638" font-weight="normal" text-anchor="middle" >例：大腿四頭筋</text><ellipse cx="460" cy="146" rx="26" ry="9" fill="#fff" stroke="#0b5ea8" stroke-width="2"/><text x="492" y="180" font-size="15" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >筋紡錘</text><ellipse cx="430" cy="310" rx="110" ry="46" fill="#f4f6f8" stroke="#9aa9b8" stroke-width="2"/><text x="430" y="300" font-size="19" fill="#607487" font-weight="bold" text-anchor="middle" >拮抗筋</text><text x="430" y="324" font-size="15" fill="#142638" font-weight="normal" text-anchor="middle" >例：ハムストリングス</text><polyline points="438.0,150.0 360.0,190.0 150.0,190.0 150.0,150.0" fill="none" stroke="#0b5ea8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahb)"/><text x="270" y="182" font-size="16" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >Ia群線維（感覚）</text><circle cx="90" cy="130" r="14" fill="#cf2634"/><text x="90" y="102" font-size="18" fill="#cf2634" font-weight="bold" text-anchor="middle" >α</text><polyline points="150.0,146.0 106.0,132.0" fill="none" stroke="#0b5ea8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahb)"/><polyline points="90.0,116.0 90.0,84.0 330.0,84.0 330.0,100.0" fill="none" stroke="#cf2634" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahr)"/><text x="210" y="76" font-size="16" fill="#cf2634" font-weight="bold" text-anchor="middle" >収縮させる</text><polyline points="150.0,190.0 150.0,240.0 132.0,250.0" fill="none" stroke="#0b5ea8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahb)"/><circle cx="120" cy="258" r="12" fill="#142638"/><text x="60" y="234" font-size="15" fill="#142638" font-weight="bold" text-anchor="middle" >抑制性</text><text x="60" y="252" font-size="15" fill="#142638" font-weight="bold" text-anchor="middle" >介在</text><polyline points="108.0,266.0 94.0,290.0" fill="none" stroke="#142638" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><circle cx="90" cy="304" r="14" fill="#9aa9b8"/><text x="58" y="310" font-size="18" fill="#607487" font-weight="bold" text-anchor="middle" >α</text><polyline points="90.0,318.0 90.0,346.0 330.0,346.0 330.0,330.0" fill="none" stroke="#9aa9b8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)" stroke-dasharray="7 5"/><text x="210" y="338" font-size="16" fill="#607487" font-weight="bold" text-anchor="middle" >抑制 → ゆるむ</text><rect x="206.0" y="203" width="88.0" height="26" rx="13" fill="#cf2634"/><text x="250" y="221.04" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle" >単シナプス</text><text x="20" y="404" font-size="17" fill="#142638" font-weight="normal" text-anchor="start" >① 筋が急に伸びる → 筋紡錘 → Ia群線維</text><text x="20" y="432" font-size="17" fill="#142638" font-weight="normal" text-anchor="start" >② 同じ筋のα運動ニューロンを直接興奮（伸張反射）</text><text x="20" y="460" font-size="17" fill="#142638" font-weight="normal" text-anchor="start" >③ 介在ニューロンで拮抗筋を抑制（相反神経抑制）</text></svg>