<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" width="560" height="430" role="img" aria-label="リンパの流れ（模式図）" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>リンパの流れ（模式図）</title><rect width="560" height="430" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12705f"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4531c"/></marker></defs><rect x="20" y="20" width="140" height="44" rx="8" fill="#dff0e9" stroke="#12705f" stroke-width="2"/><text x="90.0" y="38.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">毛細血管</text><text x="90.0" y="54.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">（動脈側）</text><line x1="162" y1="42" x2="218" y2="42" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><text x="190" y="34" font-size="12" fill="#b4531c" text-anchor="middle" font-weight="bold">ろ過</text><rect x="220" y="20" width="130" height="44" rx="8" fill="#fcf8ec" stroke="#12705f" stroke-width="2"/><text x="285.0" y="47.04" font-size="14" fill="#17261f" text-anchor="middle" font-weight="bold">間質液</text><line x1="352" y1="42" x2="408" y2="42" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><text x="380" y="34" font-size="12" fill="#b4531c" text-anchor="middle" font-weight="bold">再吸収</text><rect x="410" y="20" width="140" height="44" rx="8" fill="#dff0e9" stroke="#12705f" stroke-width="2"/><text x="480.0" y="38.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">毛細血管</text><text x="480.0" y="54.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">（静脈側）</text><text x="480" y="84" font-size="12" fill="#6b8077" text-anchor="middle" font-weight="normal">ろ過した液の約9割</text><text x="480" y="100" font-size="12" fill="#6b8077" text-anchor="middle" font-weight="normal">はここへもどる</text><line x1="285" y1="66" x2="285" y2="112" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><text x="325" y="94" font-size="12" fill="#b4531c" text-anchor="start" font-weight="bold">残り約1割</text><rect x="185" y="114" width="200" height="44" rx="8" fill="#ffffff" stroke="#12705f" stroke-width="2"/><text x="285.0" y="140.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">毛細リンパ管（はじまりは盲端）</text><line x1="285" y1="160" x2="285" y2="192" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><rect x="185" y="194" width="200" height="44" rx="8" fill="#fbe9d9" stroke="#b4531c" stroke-width="2"/><text x="285.0" y="220.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="bold">リンパ節（異物をこしとる）</text><line x1="285" y1="240" x2="285" y2="272" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><rect x="185" y="274" width="200" height="44" rx="8" fill="#ffffff" stroke="#12705f" stroke-width="2"/><text x="285.0" y="300.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">胸管・右リンパ本管</text><line x1="285" y1="320" x2="285" y2="352" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><rect x="145" y="354" width="280" height="44" rx="8" fill="#dff0e9" stroke="#0c4a40" stroke-width="2"/><text x="285.0" y="380.32" font-size="12" fill="#17261f" text-anchor="middle" font-weight="bold">静脈角（鎖骨下静脈と内頸静脈の合流部）</text><text x="20" y="150" font-size="12" fill="#0c4a40" text-anchor="start" font-weight="bold">流す力：</text><text x="20" y="168" font-size="12" fill="#17261f" text-anchor="start" font-weight="normal">骨格筋のポンプ</text><text x="20" y="186" font-size="12" fill="#17261f" text-anchor="start" font-weight="normal">呼吸運動</text><text x="20" y="204" font-size="12" fill="#17261f" text-anchor="start" font-weight="normal">リンパ管の収縮</text><text x="20" y="222" font-size="12" fill="#17261f" text-anchor="start" fon