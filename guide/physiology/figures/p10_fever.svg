<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 450" width="560" height="450" role="img" aria-label="発熱時の設定値と体温の変化（上昇期・極期・解熱期）の模式グラフ" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>発熱時の設定値と体温の変化（上昇期・極期・解熱期）の模式グラフ</title><rect width="560" height="450" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><line x1="50" y1="260" x2="50" y2="50" stroke="#142638" stroke-width="2"/><line x1="50" y1="260" x2="540" y2="260" stroke="#142638" stroke-width="2"/><text x="16" y="34" font-size="15" fill="#607487" font-weight="normal" text-anchor="start" >体温</text><text x="540" y="280" font-size="14" fill="#607487" font-weight="normal" text-anchor="end" >時間 →</text><polyline points="50.0,210.0 130.0,210.0 130.0,90.0 380.0,90.0 380.0,210.0 540.0,210.0" fill="none" stroke="#cf2634" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 5"/><text x="140" y="78" font-size="15" fill="#cf2634" font-weight="bold" text-anchor="start" >設定値（視床下部）</text><path d="M50,210 L140,210 C200,210 200,94 270,94 L390,94 C440,94 440,210 500,210 L540,210" fill="none" stroke="#073b6a" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><text x="510" y="198" font-size="15" fill="#073b6a" font-weight="bold" text-anchor="end" >体温</text><line x1="270" y1="260" x2="270" y2="50" stroke="#d8e4ee" stroke-width="1.2" stroke-dasharray="3 4"/><text x="200.0" y="250" font-size="15" fill="#142638" font-weight="bold" text-anchor="middle" >上昇期</text><line x1="380" y1="260" x2="380" y2="50" stroke="#d8e4ee" stroke-width="1.2" stroke-dasharray="3 4"/><text x="325.0" y="250" font-size="15" fill="#142638" font-weight="bold" text-anchor="middle" >極期</text><text x="435.0" y="250" font-size="15" fill="#142638" font-weight="bold" text-anchor="middle" >解熱期</text><rect x="20" y="300" width="256" height="136" rx="10" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2" /><text x="34" y="328" font-size="17" fill="#0b5ea8" font-weight="bold" text-anchor="start" >上昇期：体温＜設定値</text><text x="34" y="358" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >“寒い”と判断</text><text x="34" y="382" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >悪寒・ふるえ（熱産生）</text><text x="34" y="406" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >皮膚血管収縮（放熱↓）</text><rect x="284" y="300" width="256" height="136" rx="10" fill="#fdecee" stroke="#cf2634" stroke-width="2" /><text x="298" y="328" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="start" >解熱期：体温＞設定値</text><text x="298" y="358" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >“暑い”と判断</text><text x="298" y="382" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >発汗（蒸発で放熱）</text><text x="298" y="406" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >皮膚血管拡張（放熱↑）</text></svg>