<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 450" width="560" height="450" role="img" aria-label="化学シナプスでの伝達の順序（活動電位到達・Ca²⁺流入・伝達物質放出・受容体結合）" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>化学シナプスでの伝達の順序（活動電位到達・Ca²⁺流入・伝達物質放出・受容体結合）</title><rect width="560" height="450" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><path d="M60,20 L60,120 Q60,200 150,200 L330,200 Q420,200 420,120 L420,20" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="240" y="44" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >神経終末（前）</text><line x1="240" y1="56" x2="240" y2="90" stroke="#cf2634" stroke-width="3" marker-end="url(#ahr)"/><text x="250" y="82" font-size="16" fill="#cf2634" font-weight="bold" text-anchor="start" >① 活動電位が到達</text><circle cx="150" cy="150" r="14" fill="#fff" stroke="#0b5ea8" stroke-width="2"/><circle cx="146" cy="147" r="2.5" fill="#073b6a"/><circle cx="154" cy="153" r="2.5" fill="#073b6a"/><circle cx="200" cy="170" r="14" fill="#fff" stroke="#0b5ea8" stroke-width="2"/><circle cx="196" cy="167" r="2.5" fill="#073b6a"/><circle cx="204" cy="173" r="2.5" fill="#073b6a"/><circle cx="270" cy="172" r="14" fill="#fff" stroke="#0b5ea8" stroke-width="2"/><circle cx="266" cy="169" r="2.5" fill="#073b6a"/><circle cx="274" cy="175" r="2.5" fill="#073b6a"/><circle cx="330" cy="150" r="14" fill="#fff" stroke="#0b5ea8" stroke-width="2"/><circle cx="326" cy="147" r="2.5" fill="#073b6a"/><circle cx="334" cy="153" r="2.5" fill="#073b6a"/><circle cx="120" cy="118" r="14" fill="#fff" stroke="#0b5ea8" stroke-width="2"/><circle cx="116" cy="115" r="2.5" fill="#073b6a"/><circle cx="124" cy="121" r="2.5" fill="#073b6a"/><text x="80" y="192" font-size="1" fill="#142638" font-weight="normal" text-anchor="start" ></text><rect x="436" y="120" width="18" height="40" rx="4" fill="#28a9c7" stroke="#28a9c7" stroke-width="1" /><line x1="520" y1="140" x2="460" y2="140" stroke="#28a9c7" stroke-width="3" marker-end="url(#ah)"/><text x="462" y="100" font-size="16" fill="#0f6f86" font-weight="bold" text-anchor="start" >② Ca²⁺</text><text x="462" y="120" font-size="16" fill="#0f6f86" font-weight="bold" text-anchor="start" >流入</text><path d="M226,200 Q236,214 246,200" fill="none" stroke="#0b5ea8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="230" cy="216" r="3" fill="#073b6a"/><circle cx="240" cy="226" r="3" fill="#073b6a"/><circle cx="250" cy="214" r="3" fill="#073b6a"/><circle cx="236" cy="236" r="3" fill="#073b6a"/><circle cx="256" cy="232" r="3" fill="#073b6a"/><text x="440" y="226" font-size="16" fill="#073b6a" font-weight="bold" text-anchor="end" >③ 伝達物質を放出</text><text x="48" y="232" font-size="15" fill="#607487" font-weight="normal" text-anchor="start" >シナプス間隙</text><path d="M40,252 L520,252 L520,340 L40,340 Z" fill="#e5f5ec" stroke="#2e8b57" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="182" y="246" width="16" height="12" rx="3" fill="#2e8b57" stroke="#2e8b57" stroke-width="1" /><rect x="222" y="246" width="16" height="12" rx="3" fill="#2e8b57" stroke="#2e8b57" stroke-width="1" /><rect x="262" y="246" width="16" height="12" rx="3" fill="#2e8b57" stroke="#2e8b57" stroke-width="1" /><rect x="302" y="246" width="16" height="12" rx="3" fill="#2e8b57" stroke="#2e8b57" stroke-width="1" /><text x="280" y="290" font-size="17" fill="#2e8b57" font-weight="bold" text-anchor="middle" >④ 受容体に結合 → 次の細胞に電位変化</text><text x="280" y="320" font-size="15" fill="#607487" font-weight="normal" text-anchor="middle" >（興奮性 または 抑制性）</text><rect x="20" y="360" width="520" height="78" rx="10" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="2" /><text x="34" y="388" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="start" >特徴：一方向性・シナプス遅延・易疲労性</text><text x="34" y="418" font-size="16" fill="#142638" font-weight="normal" text-anchor="start" >放出の段階をはさむぶん、軸索の伝導より遅れる</text></svg>