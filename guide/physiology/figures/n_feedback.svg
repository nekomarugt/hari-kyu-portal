<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400" role="img" aria-label="負のフィードバックと正のフィードバック" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>負のフィードバックと正のフィードバック</title><rect width="560" height="400" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12705f"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4531c"/></marker></defs><text x="20" y="28" font-size="15" fill="#0c4a40" text-anchor="start" font-weight="bold">負のフィードバック（変化をもとにもどす）</text><rect x="20" y="44" width="120" height="50" rx="8" fill="#fbe9d9" stroke="#b4531c" stroke-width="2"/><text x="80.0" y="65.82" font-size="12" fill="#17261f" text-anchor="middle" font-weight="normal">変化</text><text x="80.0" y="80.82" font-size="12" fill="#17261f" text-anchor="middle" font-weight="normal">（例：血圧上昇）</text><line x1="142" y1="69" x2="178" y2="69" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><rect x="180" y="44" width="90" height="50" rx="8" fill="#dff0e9" stroke="#12705f" stroke-width="2"/><text x="225.0" y="73.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">受容器</text><line x1="272" y1="69" x2="308" y2="69" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><rect x="310" y="44" width="90" height="50" rx="8" fill="#dff0e9" stroke="#12705f" stroke-width="2"/><text x="355.0" y="73.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">中枢</text><line x1="402" y1="69" x2="438" y2="69" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><rect x="440" y="44" width="100" height="50" rx="8" fill="#dff0e9" stroke="#12705f" stroke-width="2"/><text x="490.0" y="73.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">効果器</text><line x1="490" y1="96" x2="490" y2="124" stroke="#b4531c" stroke-width="2.5" stroke-dasharray="6 5"/><line x1="490" y1="124" x2="80" y2="124" stroke="#b4531c" stroke-width="2.5" stroke-dasharray="6 5"/><line x1="80" y1="124" x2="80" y2="96" stroke="#b4531c" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#am)"/><text x="280" y="118" font-size="12" fill="#b4531c" text-anchor="middle" font-weight="bold">変化を小さくする向きに働く → 値が一定に保たれる</text><text x="20" y="170" font-size="12" fill="#17261f" text-anchor="start" font-weight="normal">例：血圧（圧受容器反射）・体温・血糖・血液のpH・体液の浸透圧</text><text x="20" y="224" font-size="15" fill="#0c4a40" text-anchor="start" font-weight="bold">正のフィードバック（変化をさらに強める）</text><rect x="20" y="240" width="120" height="50" rx="8" fill="#fbe9d9" stroke="#b4531c" stroke-width="2"/><text x="80.0" y="261.82" font-size="12" fill="#17261f" text-anchor="middle" font-weight="normal">変化</text><text x="80.0" y="276.82" font-size="12" fill="#17261f" text-anchor="middle" font-weight="normal">（例：陣痛）</text><line x1="142" y1="265" x2="190" y2="265" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><rect x="192" y="240" width="160" height="50" rx="8" fill="#dff0e9" stroke="#12705f" stroke-width="2"/><text x="272.0" y="261.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">さらに変化を</text><text x="272.0" y="277.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">強める物質</text><line x1="354" y1="265" x2="402" y2="265" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><rect x="404" y="240" width="136" height="50" rx="8" fill="#ffffff" stroke="#12705f" stroke-width="2"/><text x="472.0" y="269.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">もっと変化</text><line x1="472" y1="292" x2="472" y2="318" stroke="#b4531c" stroke-width="2.5" stroke-dasharray="6 5"/><line x1="472" y1="318" x2="80" y2="318" stroke="#b4531c" stroke-width="2.5" stroke-dasharray="6 5"/><line x1="80" y1="318" x2="80" y2="292" stroke="#b4531c" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#am)"/><text x="20" y="360" font-size="12" fill="#17261f" text-anchor="start" font-weight="normal">例：分娩（オキシトシン）・排卵（LHサージ）・血液凝固</text><text x="20" y="382" font-size="12" fill="#6b8077" text-anchor="start" font-weight="normal">正のフィードバックは最後に「出産」「排卵」など目的を果たして止まる。</text></svg>