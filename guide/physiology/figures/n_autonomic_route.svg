<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" width="560" height="470" role="img" aria-label="自律神経の経路（交感神経と副交感神経）" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>自律神経の経路（交感神経と副交感神経）</title><rect width="560" height="470" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12705f"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4531c"/></marker></defs><text x="20" y="28" font-size="17" fill="#0c4a40" text-anchor="start" font-weight="bold">交感神経</text><rect x="20" y="48" width="130" height="76" rx="8" fill="#dff0e9" stroke="#12705f" stroke-width="2"/><text x="85.0" y="74.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">脊髄</text><text x="85.0" y="90.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">胸髄〜腰髄上部</text><text x="85.0" y="106.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">（T1〜L2）の側角</text><circle cx="215" cy="86" r="17" fill="#fcf8ec" stroke="#12705f" stroke-width="2.5"/><text x="215" y="124" font-size="12" fill="#6b8077" text-anchor="middle" font-weight="normal">交感神経節</text><text x="215" y="140" font-size="12" fill="#6b8077" text-anchor="middle" font-weight="normal">（脊髄のそば）</text><rect x="405" y="48" width="135" height="76" rx="8" fill="#fcf8ec" stroke="#12705f" stroke-width="2"/><text x="472.5" y="74.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">効果器</text><text x="472.5" y="90.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">心臓・血管・瞳孔</text><text x="472.5" y="106.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">消化管など</text><line x1="150" y1="86" x2="196" y2="86" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><line x1="232" y1="86" x2="403" y2="86" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><text x="173" y="72" font-size="12" fill="#0c4a40" text-anchor="middle" font-weight="normal">節前</text><text x="318" y="72" font-size="12" fill="#0c4a40" text-anchor="middle" font-weight="normal">節後</text><text x="173" y="107" font-size="12" fill="#b4531c" text-anchor="middle" font-weight="bold">短い</text><text x="318" y="107" font-size="12" fill="#b4531c" text-anchor="middle" font-weight="bold">長い</text><text x="215" y="168" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">節前＝アセチルコリン（ニコチン受容体）</text><text x="215" y="188" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">節後＝ノルアドレナリン（α・β受容体）</text><text x="20" y="232" font-size="17" fill="#0c4a40" text-anchor="start" font-weight="bold">副交感神経</text><rect x="20" y="252" width="130" height="76" rx="8" fill="#dff0e9" stroke="#12705f" stroke-width="2"/><text x="85.0" y="278.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">脳幹（動眼・顔面</text><text x="85.0" y="294.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">舌咽・迷走神経）</text><text x="85.0" y="310.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">と仙髄（S2〜S4）</text><circle cx="385" cy="290" r="17" fill="#fcf8ec" stroke="#12705f" stroke-width="2.5"/><text x="385" y="328" font-size="12" fill="#6b8077" text-anchor="middle" font-weight="normal">副交感神経節</text><text x="385" y="344" font-size="12" fill="#6b8077" text-anchor="middle" font-weight="normal">（効果器のそば）</text><rect x="445" y="252" width="100" height="76" rx="8" fill="#fcf8ec" stroke="#12705f" stroke-width="2"/><text x="495.0" y="294.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">効果器</text><line x1="150" y1="290" x2="366" y2="290" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><line x1="402" y1="290" x2="443" y2="290" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><text x="258" y="276" font-size="12" fill="#0c4a40" text-anchor="middle" font-weight="normal">節前</text><text x="424" y="276" font-size="12" fill="#0c4a40" text-anchor="middle" font-weight="normal">節後</text><text x="258" y="311" font-size="12" fill="#b4531c" text-anchor="middle" font-weight="bold">長い</text><text x="424" y="311" font-size="12" fill="#b4531c" text-anchor="middle" font-weight="bold">短い</text><text x="280" y="372" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">節前＝アセチルコリン（ニコチン受容体）</text><text x="280" y="392" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">節後＝アセチルコリン（ムスカリン受容体）</text><rect x="20" y="410" width="520" height="48" rx="8" fill="#fcf8ec" stroke="#e3d9bd" stroke-width="1.5"/><text x="280" y="431" font-size="13" fill="#b4531c" text-anchor="middle" font-weight="bold">例外：汗腺は交感神経なのに、節後線維がアセチルコリン。</text><text x="280" y="450" font-size="13" fill="#b4531c" text-anchor="middle" font-weight="bold">副腎髄質は、交感神経の節前線維が直接つながる。</text></svg>