<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" width="560" height="470" role="img" aria-label="脳脊髄液の流れ（模式図）" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>脳脊髄液の流れ（模式図）</title><rect width="560" height="470" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12705f"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4531c"/></marker></defs><rect x="120" y="14" width="320" height="42" rx="8" fill="#fbe9d9" stroke="#b4531c" stroke-width="2"/><text x="280.0" y="31.54" font-size="14" fill="#17261f" text-anchor="middle" font-weight="bold">側脳室</text><text x="280.0" y="48.54" font-size="14" fill="#17261f" text-anchor="middle" font-weight="bold">（脈絡叢でつくられる）</text><line x1="280" y1="58" x2="280" y2="74" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><rect x="120" y="76" width="320" height="42" rx="8" fill="#dff0e9" stroke="#12705f" stroke-width="2"/><text x="280.0" y="102.04" font-size="14" fill="#17261f" text-anchor="middle" font-weight="normal">室間孔</text><line x1="280" y1="120" x2="280" y2="136" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><rect x="120" y="138" width="320" height="42" rx="8" fill="#dff0e9" stroke="#12705f" stroke-width="2"/><text x="280.0" y="164.04" font-size="14" fill="#17261f" text-anchor="middle" font-weight="normal">第三脳室</text><line x1="280" y1="182" x2="280" y2="198" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><rect x="120" y="200" width="320" height="42" rx="8" fill="#dff0e9" stroke="#12705f" stroke-width="2"/><text x="280.0" y="226.04" font-size="14" fill="#17261f" text-anchor="middle" font-weight="normal">中脳水道</text><line x1="280" y1="244" x2="280" y2="260" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><rect x="120" y="262" width="320" height="42" rx="8" fill="#dff0e9" stroke="#12705f" stroke-width="2"/><text x="280.0" y="288.04" font-size="14" fill="#17261f" text-anchor="middle" font-weight="normal">第四脳室</text><line x1="280" y1="306" x2="280" y2="322" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><rect x="120" y="324" width="320" height="42" rx="8" fill="#dff0e9" stroke="#12705f" stroke-width="2"/><text x="280.0" y="341.54" font-size="14" fill="#17261f" text-anchor="middle" font-weight="normal">くも膜下腔</text><text x="280.0" y="358.54" font-size="14" fill="#17261f" text-anchor="middle" font-weight="normal">（脳・脊髄のまわり）</text><line x1="280" y1="368" x2="280" y2="384" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><rect x="120" y="386" width="320" height="42" rx="8" fill="#fbe9d9" stroke="#b4531c" stroke-width="2"/><text x="280.0" y="403.54" font-size="14" fill="#17261f" text-anchor="middle" font-weight="bold">くも膜顆粒</text><text x="280.0" y="420.54" font-size="14" fill="#17261f" text-anchor="middle" font-weight="bold">→ 静脈洞（血液へ吸収）</text><text x="460" y="40" font-size="13" fill="#b4531c" text-anchor="start" font-weight="bold">産生</text><text x="460" y="392" font-size="13" fill="#b4531c" text-anchor="start" font-weight="bold">吸収</text><text x="20" y="452" font-size="12" fill="#6b8077" text-anchor="start" font-weight="normal">産生は脈絡叢、吸収はくも膜顆粒。吸収されるのは脈絡叢ではない。</text></svg>