<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" width="560" height="430" role="img" aria-label="圧受容器反射（血圧を元へ戻す）" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>圧受容器反射（血圧を元へ戻す）</title><rect width="560" height="430" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12705f"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4531c"/></marker></defs><rect x="150" y="14" width="260" height="44" rx="8" fill="#fbe9d9" stroke="#b4531c" stroke-width="2"/><text x="280.0" y="41.04" font-size="14" fill="#17261f" text-anchor="middle" font-weight="bold">血圧が上がる（血管壁がのびる）</text><line x1="280" y1="60" x2="280" y2="92" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><rect x="120" y="94" width="320" height="58" rx="8" fill="#dff0e9" stroke="#12705f" stroke-width="2"/><text x="280.0" y="119.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">圧受容器</text><text x="280.0" y="135.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">頸動脈洞（舌咽神経）・大動脈弓（迷走神経）</text><line x1="280" y1="154" x2="280" y2="186" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><rect x="150" y="188" width="260" height="52" rx="8" fill="#fcf8ec" stroke="#12705f" stroke-width="2"/><text x="280.0" y="210.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">延髄（循環中枢）</text><text x="280.0" y="226.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">孤束核 → 心臓・血管運動の中枢</text><line x1="220" y1="242" x2="130" y2="282" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><line x1="340" y1="242" x2="430" y2="282" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><rect x="20" y="284" width="220" height="60" rx="8" fill="#ffffff" stroke="#12705f" stroke-width="2"/><text x="130.0" y="310.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">迷走神経（副交感）が増える</text><text x="130.0" y="326.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">→ 心拍数が減る</text><rect x="320" y="284" width="220" height="60" rx="8" fill="#ffffff" stroke="#12705f" stroke-width="2"/><text x="430.0" y="310.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">交感神経が減る</text><text x="430.0" y="326.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">→ 血管がゆるむ・心拍出量が減る</text><line x1="130" y1="346" x2="250" y2="378" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><line x1="430" y1="346" x2="310" y2="378" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><rect x="150" y="376" width="260" height="44" rx="8" fill="#dff0e9" stroke="#0c4a40" stroke-width="2"/><text x="280.0" y="403.04" font-size="14" fill="#17261f" text-anchor="middle" font-weight="bold">血圧が下がる（元にもどる）</text><line x1="412" y1="398" x2="540" y2="398" stroke="#b4531c" stroke-width="2.5" stroke-dasharray="6 5"/><line x1="540" y1="398" x2="540" y2="36" stroke="#b4531c" stroke-width="2.5" stroke-dasharray="6 5"/><line x1="540" y1="36" x2="412" y2="36" stroke="#b4531c" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#am)"/><text x="548" y="220" transform="rotate(90 548 220)" font-size="12" fill="#b4531c" text-anchor="middle" font-weight="bold">負のフィードバック</text></svg>