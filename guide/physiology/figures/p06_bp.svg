<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" width="560" height="500" role="img" aria-label="血圧の短期調節（圧受容器反射）と長期調節（レニン・アンジオテンシン・アルドステロン系）" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>血圧の短期調節（圧受容器反射）と長期調節（レニン・アンジオテンシン・アルドステロン系）</title><rect width="560" height="500" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><rect x="20" y="12" width="520" height="46" rx="10" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2" /><text x="280" y="43" font-size="19" fill="#073b6a" font-weight="bold" text-anchor="middle" >平均動脈圧 ≒ 心拍出量 × 総末梢血管抵抗</text><text x="20" y="92" font-size="18" fill="#cf2634" font-weight="bold" text-anchor="start" >短期：圧受容器反射（秒単位）</text><rect x="20" y="104" width="150" height="56" rx="10" fill="#f4f6f8" stroke="#9aa9b8" stroke-width="2"/><text x="95.0" y="138.12" font-size="17" fill="#142638" font-weight="bold" text-anchor="middle" >血圧が下がる</text><line x1="172" y1="132" x2="196" y2="132" stroke="#607487" stroke-width="2.5" marker-end="url(#ah)"/><rect x="200" y="104" width="170" height="56" rx="10" fill="#fdecee" stroke="#cf2634" stroke-width="2"/><text x="285.0" y="129.0" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="middle" >圧受容器</text><text x="285.0" y="147.0" font-size="13" fill="#142638" font-weight="normal" text-anchor="middle" >頸動脈洞・大動脈弓</text><line x1="372" y1="132" x2="396" y2="132" stroke="#607487" stroke-width="2.5" marker-end="url(#ah)"/><rect x="400" y="104" width="140" height="56" rx="10" fill="#fdecee" stroke="#cf2634" stroke-width="2"/><text x="470.0" y="129.0" font-size="18" fill="#cf2634" font-weight="bold" text-anchor="middle" >延髄</text><text x="470.0" y="147.0" font-size="13" fill="#142638" font-weight="normal" text-anchor="middle" >（循環中枢）</text><polyline points="470.0,162.0 470.0,186.0 280.0,186.0 280.0,198.0" fill="none" stroke="#607487" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="20" y="202" width="520" height="56" rx="10" fill="#fff" stroke="#cf2634" stroke-width="2"/><text x="280.0" y="227.0" font-size="18" fill="#cf2634" font-weight="bold" text-anchor="middle" >交感神経↑・副交感神経↓</text><text x="280.0" y="247.0" font-size="15" fill="#142638" font-weight="normal" text-anchor="middle" >心拍数・収縮力↑、血管収縮 → 血圧が戻る</text><text x="20" y="304" font-size="18" fill="#0b5ea8" font-weight="bold" text-anchor="start" >長期：腎臓と体液量</text><rect x="20" y="316" width="150" height="56" rx="10" fill="#f4f6f8" stroke="#9aa9b8" stroke-width="2"/><text x="95.0" y="350.12" font-size="17" fill="#142638" font-weight="bold" text-anchor="middle" >腎血流↓</text><line x1="172" y1="344" x2="196" y2="344" stroke="#0b5ea8" stroke-width="2.5" marker-end="url(#ahb)"/><rect x="200" y="316" width="110" height="56" rx="10" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2"/><text x="255.0" y="350.48" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >レニン</text><line x1="312" y1="344" x2="336" y2="344" stroke="#0b5ea8" stroke-width="2.5" marker-end="url(#ahb)"/><rect x="340" y="316" width="200" height="56" rx="10" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2"/><text x="440.0" y="350.48" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >アンジオテンシンⅡ</text><polyline points="390.0,374.0 390.0,392.0 150.0,392.0 150.0,404.0" fill="none" stroke="#0b5ea8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahb)"/><polyline points="490.0,374.0 490.0,404.0" fill="none" stroke="#0b5ea8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahb)"/><rect x="20" y="408" width="260" height="56" rx="10" fill="#fff" stroke="#0b5ea8" stroke-width="2"/><text x="150.0" y="442.48" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >血管収縮</text><rect x="300" y="408" width="240" height="56" rx="10" fill="#fff" stroke="#0b5ea8" stroke-width="2"/><text x="420.0" y="433.0" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >アルドステロン</text><text x="420.0" y="452.0" font-size="14" fill="#142638" font-weight="normal" text-anchor="middle" >Na⁺・水を保持</text><text x="20" y="490" font-size="16" fill="#607487" font-weight="normal" text-anchor="start" >→ どちらも血圧・体液量を増やす方向</text></svg>