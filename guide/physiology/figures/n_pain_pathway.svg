<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 450" width="560" height="450" role="img" aria-label="痛みの伝導路（新脊髄視床路と旧脊髄視床路）" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>痛みの伝導路（新脊髄視床路と旧脊髄視床路）</title><rect width="560" height="450" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12705f"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4531c"/></marker></defs><rect x="190" y="12" width="180" height="44" rx="8" fill="#fbe9d9" stroke="#b4531c" stroke-width="2"/><text x="280.0" y="30.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="bold">侵害受容器</text><text x="280.0" y="46.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="bold">（自由神経終末）</text><line x1="240" y1="58" x2="140" y2="96" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><line x1="320" y1="58" x2="420" y2="96" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><rect x="20" y="98" width="240" height="56" rx="8" fill="#dff0e9" stroke="#12705f" stroke-width="2"/><text x="140.0" y="122.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">Aδ線維（Ⅲ群・有髄）</text><text x="140.0" y="138.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">速い痛み・鋭い痛み</text><rect x="300" y="98" width="240" height="56" rx="8" fill="#dff0e9" stroke="#12705f" stroke-width="2"/><text x="420.0" y="122.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">C線維（Ⅳ群・無髄）</text><text x="420.0" y="138.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">遅い痛み・鈍い痛み</text><line x1="140" y1="156" x2="140" y2="188" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><line x1="420" y1="156" x2="420" y2="188" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><rect x="20" y="190" width="240" height="44" rx="8" fill="#ffffff" stroke="#12705f" stroke-width="2"/><text x="140.0" y="208.82" font-size="12" fill="#17261f" text-anchor="middle" font-weight="normal">脊髄後角 → 対側へ交叉</text><text x="140.0" y="223.82" font-size="12" fill="#17261f" text-anchor="middle" font-weight="normal">新脊髄視床路（外側脊髄視床路）</text><rect x="300" y="190" width="240" height="44" rx="8" fill="#ffffff" stroke="#12705f" stroke-width="2"/><text x="420.0" y="208.82" font-size="12" fill="#17261f" text-anchor="middle" font-weight="normal">脊髄後角 → 対側へ交叉</text><text x="420.0" y="223.82" font-size="12" fill="#17261f" text-anchor="middle" font-weight="normal">旧脊髄視床路（脳幹へ多く入る）</text><line x1="140" y1="236" x2="140" y2="268" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><line x1="420" y1="236" x2="420" y2="268" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><rect x="20" y="270" width="240" height="44" rx="8" fill="#ffffff" stroke="#12705f" stroke-width="2"/><text x="140.0" y="296.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">視床（外側）</text><rect x="300" y="270" width="240" height="44" rx="8" fill="#ffffff" stroke="#12705f" stroke-width="2"/><text x="420.0" y="296.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">脳幹網様体・視床（内側）</text><line x1="140" y1="316" x2="140" y2="348" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><line x1="420" y1="316" x2="420" y2="348" stroke="#12705f" stroke-width="3" marker-end="url(#ar)"/><rect x="20" y="350" width="240" height="44" rx="8" fill="#dff0e9" stroke="#0c4a40" stroke-width="2"/><text x="140.0" y="376.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="bold">体性感覚野（中心後回）</text><rect x="300" y="350" width="240" height="44" rx="8" fill="#dff0e9" stroke="#0c4a40" stroke-width="2"/><text x="420.0" y="376.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="bold">大脳辺縁系・広い皮質</text><text x="140" y="414" font-size="13" fill="#b4531c" text-anchor="middle" font-weight="bold">局在がはっきりしている</text><text x="420" y="414" font-size="13" fill="#b4531c" text-anchor="middle" font-weight="bold">局在がはっきりしない（不快・情動）</text><text x="280" y="438" font-size="12" fill="#6b8077" text-anchor="middle" font-weight="normal">どちらも感覚の種類は同じ「痛み」。伝える線維と行き先が違う。</text></svg>