<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 450" width="560" height="450" role="img" aria-label="ガストリン・セクレチン・コレシストキニンの分泌のきっかけと働き" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>ガストリン・セクレチン・コレシストキニンの分泌のきっかけと働き</title><rect width="560" height="450" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><text x="20" y="26" font-size="16" fill="#607487" font-weight="bold" text-anchor="start" >きっかけ</text><text x="290" y="26" font-size="16" fill="#607487" font-weight="bold" text-anchor="middle" >ホルモン</text><text x="540" y="26" font-size="16" fill="#607487" font-weight="bold" text-anchor="end" >はたらき</text><rect x="20" y="40" width="520" height="102" rx="12" fill="#fdecee" stroke="#cf2634" stroke-width="2" /><text x="34" y="84" font-size="16" fill="#142638" font-weight="normal" text-anchor="start" >胃の食物</text><line x1="170" y1="90" x2="196" y2="90" stroke="#cf2634" stroke-width="2.5" marker-end="url(#ahr)"/><rect x="200" y="58" width="150" height="64" rx="10" fill="#fff" stroke="#cf2634" stroke-width="2"/><text x="275.0" y="87.0" font-size="20" fill="#cf2634" font-weight="bold" text-anchor="middle" >ガストリン</text><text x="275.0" y="105.0" font-size="13" fill="#142638" font-weight="normal" text-anchor="middle" >G細胞（胃）</text><l