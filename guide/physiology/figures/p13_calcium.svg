<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 450" width="560" height="450" role="img" aria-label="パラソルモン・活性型ビタミンD・カルシトニンによる血中カルシウム調節の模式図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>パラソルモン・活性型ビタミンD・カルシトニンによる血中カルシウム調節の模式図</title><rect width="560" height="450" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><rect x="20" y="16" width="160" height="58" rx="10" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2"/><text x="100.0" y="42.0" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >カルシトニン</text><text x="100.0" y="59.0" font-size="12" fill="#142638" font-weight="normal" text-anchor="middle" >甲状腺の傍濾胞細胞</text><rect x="200" y="16" width="340" height="58" rx="10" fill="#fdecee" stroke="#cf2634" stroke-width="2"/><text x="370.0" y="42.0" font-size="19" fill="#cf2634" font-weight="bold" text-anchor="middle" >パラソルモン（PTH）</text><text x="370.0" y="60.0" font-size="13" fill="#142638" font-weight="normal" text-anchor="middle" >上皮小体</text><line x1="60" y1="76" x2="60" y2="126" stroke="#0b5ea8" stroke-width="3" marker-end="url(#ahb)" stroke-dasharray="7 4"/><polyline points="230.0,76.0 230.0,100.0 140.0,100.0 140.0,126.0" fill="none" stroke="#cf2634" stroke-width="3" stroke-linejoin="round" stroke-linec