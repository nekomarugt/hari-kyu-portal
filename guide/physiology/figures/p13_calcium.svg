al" text-anchor="middle" >狭い範囲に保つ</text><line x1="100" y1="256" x2="196" y2="306" stroke="#cf2634" stroke-width="3" marker-end="url(#ahr)"/><line x1="280" y1="256" x2="280" y2="302" stroke="#cf2634" stroke-width="3" marker-end="url(#ahr)"/><line x1="460" y1="256" x2="364" y2="306" stroke="#cf2634" stroke-width="3" marker-end="url(#ahr)"/><text x="20" y="406" font-size="16" fill="#cf2634" font-weight="bold" text-anchor="start" >PTH・活性型ビタミンD → 血中Ca²⁺を上げる</text><text x="20" y="434" font-size="16" fill="#073b6a" font-weight="bold" text-anchor="start" >Ca²⁺が低い → 神経・筋が興奮しやすい（テタニー）</text></svg>