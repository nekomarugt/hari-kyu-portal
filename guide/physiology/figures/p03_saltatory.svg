<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390" width="560" height="390" role="img" aria-label="有髄線維の跳躍伝導と無髄線維の連続伝導の比較" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>有髄線維の跳躍伝導と無髄線維の連続伝導の比較</title><rect width="560" height="390" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><text x="20" y="30" font-size="20" fill="#073b6a" font-weight="bold" text-anchor="start" >有髄線維：絞輪から絞輪へ“跳ぶ”</text><rect x="20" y="102" width="520" height="16" rx="8" fill="#fff" stroke="#073b6a" stroke-width="2" /><rect x="52" y="84" width="106" height="52" rx="24" fill="#fff4d6" stroke="#b77a00" stroke-width="2"/><rect x="182" y="84" width="106" height="52" rx="24" fill="#fff4d6" stroke="#b77a00" stroke-width="2"/><rect x="312" y="84" width="106" height="52" rx="24" fill="#fff4d6" stroke="#b77a00" stroke-width="2"/><rect x="442" y="84" width="98" height="52" rx="24" fill="#fff4d6" stroke="#b77a00" stroke-width="2"/><circle cx="40" cy="110" r="7" fill="#cf2634"/><circle cx="170" cy="110" r="7" fill="#cf2634"/><circle cx="300" cy="110" r="7" fill="#cf2634"/><circle cx="430" cy="110" r="7" fill="#cf2634"/><path d="M40,80 Q105.0,30 164,76" fill="none" stroke="#cf2634" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end