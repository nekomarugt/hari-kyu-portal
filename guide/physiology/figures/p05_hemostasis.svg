<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" width="560" height="520" role="img" aria-label="止血・血液凝固・線溶の流れの模式図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>止血・血液凝固・線溶の流れの模式図</title><rect width="560" height="520" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><rect x="150" y="10" width="260" height="40" rx="10" fill="#f4f6f8" stroke="#9aa9b8" stroke-width="2"/><text x="280.0" y="36.48" font-size="18" fill="#142638" font-weight="bold" text-anchor="middle" >血管が傷つく</text><line x1="280" y1="52" x2="280" y2="70" stroke="#607487" stroke-width="2.5" marker-end="url(#ah)"/><rect x="20" y="74" width="520" height="44" rx="10" fill="#fff" stroke="#607487" stroke-width="2"/><text x="280.0" y="102.48" font-size="18" fill="#142638" font-weight="bold" text-anchor="middle" >① 血管収縮（出血を減らす）</text><line x1="280" y1="120" x2="280" y2="138" stroke="#607487" stroke-width="2.5" marker-end="url(#ah)"/><rect x="20" y="142" width="520" height="56" rx="10" fill="#fdecee" stroke="#cf2634" stroke-width="2"/><text x="280.0" y="167.0" font-size="18" fill="#cf2634" font-weight="bold" text-anchor="middle" >② 一次止血：血小板が粘着・凝集</text><text x="280.0" y="187.0" font-size="15" fill="#142638" font-weight="normal" text-anchor="middle" >→ 血小板血栓（仮のふた）</text><line x1="280" y1="200" x2="280" y2="218" stroke="#607487" stroke-width="2.5" marker-end="url(#ah)"/><rect x="20" y="222" width="520" height="204" rx="12" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2" /><text x="34" y="250" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="start" >③ 二次止血：凝固因子の連鎖反応</text><rect x="50" y="262" width="170" height="38" rx="10" fill="#fff" stroke="#0b5ea8" stroke-width="2"/><text x="135.0" y="287.12" font-size="17" fill="#073b6a" font-weight="bold" text-anchor="middle" >内因系</text><rect x="340" y="262" width="170" height="38" rx="10" fill="#fff" stroke="#0b5ea8" stroke-width="2"/><text x="425.0" y="287.12" font-size="17" fill="#073b6a" font-weight="bold" text-anchor="middle" >外因系</text><polyline points="135.0,302.0 135.0,316.0 270.0,316.0 270.0,326.0" fill="none" stroke="#0b5ea8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahb)"/><polyline points="425.0,302.0 425.0,316.0 290.0,316.0 290.0,326.0" fill="none" stroke="#0b5ea8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahb)"/><rect x="190" y="330" width="180" height="30" rx="10" fill="#0b5ea8" stroke="#0b5ea8" stroke-width="2"/><text x="280.0" y="350.76" font-size="16" fill="#fff" font-weight="bold" text-anchor="middle" >共通経路</text><text x="40" y="386" font-size="17" fill="#073b6a" font-weight="bold" text-anchor="start" >プロトロンビン → トロンビン</text><text x="40" y="414" font-size="17" fill="#073b6a" font-weight="bold" text-anchor="start" >トロンビンが フィブリノゲン → フィブリン</text><text x="526" y="414" font-size="15" fill="#607487" font-weight="normal" text-anchor="end" >網で固める</text><line x1="280" y1="428" x2="280" y2="446" stroke="#607487" stroke-width="2.5" marker-end="url(#ah)"/><rect x="20" y="450" width="520" height="56" rx="10" fill="#e5f5ec" stroke="#2e8b57" stroke-width="2"/><text x="280.0" y="475.0" font-size="18" fill="#2e8b57" font-weight="bold" text-anchor="middle" >④ 線溶：プラスミンがフィブリンを分解</text><text x="280.0" y="495.0" font-size="15" fill="#142638" font-weight="normal" text-anchor="middle" >治ったら血栓を片づける</text></svg>