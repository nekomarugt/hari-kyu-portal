<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 450" width="560" height="450" role="img" aria-label="スキャモンの発育曲線（一般型・神経型・生殖型・リンパ型）の模式グラフ" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>スキャモンの発育曲線（一般型・神経型・生殖型・リンパ型）の模式グラフ</title><rect width="560" height="450" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><line x1="70" y1="360" x2="70" y2="34.0" stroke="#142638" stroke-width="2"/><line x1="70" y1="360" x2="520.0" y2="360" stroke="#142638" stroke-width="2"/><text x="62" y="365.0" font-size="14" fill="#142638" font-weight="normal" text-anchor="end" >0</text><text x="62" y="205.0" font-size="14" fill="#142638" font-weight="normal" text-anchor="end" >100</text><text x="62" y="45.0" font-size="14" fill="#142638" font-weight="normal" text-anchor="end" >200</text><line x1="70" y1="200.0" x2="510.0" y2="200.0" stroke="#d8e4ee" stroke-width="1.5" stroke-dasharray="5 4"/><text x="70.0" y="382" font-size="14" fill="#142638" font-weight="normal" text-anchor="middle" >0</text><text x="180.0" y="382" font-size="14" fill="#142638" font-weight="normal" text-anchor="middle" >5</text><text x="290.0" y="382" font-size="14" fill="#142638" font-weight="normal" text-anchor="middle" >10</text><text x="400.0" y="382" font-size="14" fill="#142638" font-weight="normal" text-anchor="middle" >15</text><text x="510.0" y="382" font-size="14" fill="#142638" font-weight="normal" text-anchor="middle" >20</text><text x="510.0" y="404" font-size="14" fill="#607487" font-weight="normal" text-anchor="end" >年齢（歳）</text><text x="20" y="28" font-size="15" fill="#607487" font-weight="normal" text-anchor="start" >20歳の値を100％とした発育の割合（形は模式）</text><path d="M70.0,352.0 L114.0,280.0 L158.0,216.0 L202.0,168.0 L246.0,120.0 L290.0,72.0 L334.0,56.0 L378.0,88.0 L422.0,136.0 L466.0,176.0 L510.0,200.0" fill="none" stroke="#2e8b57" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M70.0,320.0 L92.0,288.0 L114.0,264.0 L158.0,232.0 L202.0,216.0 L246.0,209.6 L290.0,206.4 L378.0,203.2 L510.0,200.0" fill="none" stroke="#cf2634" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M70.0,352.0 L92.0,328.0 L136.0,312.0 L202.0,296.0 L290.0,280.0 L334.0,267.2 L378.0,248.0 L422.0,224.0 L466.0,208.0 L510.0,200.0" fill="none" stroke="#0b5ea8" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M70.0,352.0 L202.0,347.2 L290.0,344.0 L334.0,336.0 L378.0,304.0 L422.0,264.0 L466.0,224.0 L510.0,200.0" fill="none" stroke="#6a4fb3" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 5"/><text x="356.0" y="64.0" font-size="16" fill="#2e8b57" font-weight="bold" text-anchor="start" >リンパ型</text><text x="136.0" y="209.2" font-size="16" fill="#cf2634" font-weight="bold" text-anchor="middle" >神経型</text><text x="323.0" y="302.4" font-size="16" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >一般型</text><text x="413.2" y="324.8" font-size="16" fill="#6a4fb3" font-weight="bold" text-anchor="middle" >生殖型</text><text x="20" y="420" font-size="16" fill="#073b6a" font-weight="bold" text-anchor="start" >神経型は早く、生殖型は思春期に急増</text><text x="20" y="444" font-size="16" fill="#073b6a" font-weight="bold" text-anchor="start" >リンパ型は思春期前に成人値を超え、その後低下</text></svg>