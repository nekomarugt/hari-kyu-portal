<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="560" height="440" role="img" aria-label="静止膜電位と活動電位の模式グラフ（Na⁺流入で脱分極、K⁺流出で再分極）" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>静止膜電位と活動電位の模式グラフ（Na⁺流入で脱分極、K⁺流出で再分極）</title><rect width="560" height="440" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><line x1="70" y1="30" x2="70" y2="360" stroke="#142638" stroke-width="2"/><line x1="70" y1="360" x2="540" y2="360" stroke="#142638" stroke-width="2"/><text x="62" y="137.53846153846155" font-size="16" fill="#142638" font-weight="normal" text-anchor="end" >0</text><line x1="70" y1="131.53846153846155" x2="540" y2="131.53846153846155" stroke="#d8e4ee" stroke-width="1.5" stroke-dasharray="5 4"/><text x="62" y="315.2307692307692" font-size="16" fill="#142638" font-weight="normal" text-anchor="end" >−70</text><text x="20" y="22" font-size="15" fill="#607487" font-weight="normal" text-anchor="start" >mV</text><text x="540" y="386" font-size="15" fill="#607487" font-weight="normal" text-anchor="end" >時間 →</text><line x1="70" y1="271.1538461538462" x2="540" y2="271.1538461538462" stroke="#b77a00" stroke-width="2" stroke-dasharray="8 5"/><text x="536" y="265.1538461538462" font-size="16" fill="#b77a00" font-weight="bold" text-anchor="end" >閾値</text><path d="M70.0,309.2 L150.0,309.2 L170.0,288.9 L190.0,271.2 L205.0,131.5 L220.0,55.4 L235.0,60.5 L252.0,131.5 L272.0,283.8 L290.0,334.6 L330.0,324.5 L380.0,309.2 L540.0,309.2" fill="none" stroke="#073b6a" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><line x1="150" y1="101.07692307692308" x2="196" y2="101.07692307692308" stroke="#cf2634" stroke-width="2.5" marker-end="url(#ahr)"/><text x="80" y="45.230769230769226" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="start" >脱分極</text><text x="80" y="67.23076923076923" font-size="17" fill="#cf2634" font-weight="normal" text-anchor="start" >Na⁺が流入</text><line x1="300" y1="101.07692307692308" x2="252" y2="101.07692307692308" stroke="#0b5ea8" stroke-width="2.5" marker-end="url(#ahb)"/><text x="306" y="45.230769230769226" font-size="17" fill="#0b5ea8" font-weight="bold" text-anchor="start" >再分極</text><text x="306" y="67.23076923076923" font-size="17" fill="#0b5ea8" font-weight="normal" text-anchor="start" >K⁺が流出</text><line x1="290" y1="334.61538461538464" x2="330" y2="358.9230769230769" stroke="#607487" stroke-width="1.8"/><circle cx="290" cy="334.61538461538464" r="3.5" fill="#607487"/><text x="336" y="355.84615384615387" font-size="16" fill="#607487" font-weight="normal" text-anchor="start" >過分極</text><text x="400" y="297.2307692307692" font-size="17" fill="#073b6a" font-weight="bold" text-anchor="start" >静止膜電位</text><text x="400" y="333.2307692307692" font-size="15" fill="#607487" font-weight="normal" text-anchor="start" >（K⁺の平衡電位に近い）</text><text x="24" y="396" font-size="17" fill="#142638" font-weight="normal" text-anchor="start" >閾値を超えると一定の大きさで発生（全か無かの法則）</text><text x="24" y="424" font-size="17" fill="#142638" font-weight="normal" text-anchor="start" >直後は不応期 → 刺激の強さは“頻度”で伝える</text></svg>