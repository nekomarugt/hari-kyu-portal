<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" width="560" height="470" role="img" aria-label="呼吸中枢（延髄・橋）と中枢・末梢化学受容器による呼吸調節の模式図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>呼吸中枢（延髄・橋）と中枢・末梢化学受容器による呼吸調節の模式図</title><rect width="560" height="470" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><rect x="20" y="16" width="200" height="50" rx="10" fill="#f4f6f8" stroke="#9aa9b8" stroke-width="2"/><text x="120.0" y="38.0" font-size="17" fill="#607487" font-weight="bold" text-anchor="middle" >大脳皮質</text><text x="120.0" y="56.0" font-size="13" fill="#142638" font-weight="normal" text-anchor="middle" >一時的に随意調節</text><rect x="170" y="110" width="220" height="90" rx="14" fill="#fdecee" stroke="#cf2634" stroke-width="2.5" /><text x="280" y="146" font-size="21" fill="#cf2634" font-weight="bold" text-anchor="middle" >呼吸中枢</text><text x="280" y="176" font-size="18" fill="#cf2634" font-weight="bold" text-anchor="middle" >延髄・橋</text><line x1="120" y1="68" x2="190" y2="108" stroke="#9aa9b8" stroke-width="2" marker-end="url(#ah)" stroke-dasharray="6 4"/><rect x="340" y="16" width="200" height="64" rx="10" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2"/><text x="440.0" y="45.0" font-size="17" fill="#073b6a" font-weight="bold" text-anchor="middle" >中枢化学受容器</text><text x="440.0" y="64.0" font-size="14" fill="#142638" font-weight="normal" text-anchor="middle" >延髄：CO₂↑（H⁺↑）</text><line x1="420" y1="82" x2="360" y2="108" stroke="#0b5ea8" stroke-width="3" marker-end="url(#ahb)"/><rect x="422.0" y="83" width="96.0" height="26" rx="13" fill="#0b5ea8"/><text x="470" y="100.68" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle" >ふだんの主役</text><rect x="20" y="236" width="240" height="64" rx="10" fill="#eaf4fc" stroke="#28a9c7" stroke-width="2"/><text x="140.0" y="265.0" font-size="17" fill="#0f6f86" font-weight="bold" text-anchor="middle" >頸動脈小体</text><text x="140.0" y="283.0" font-size="13" fill="#142638" font-weight="normal" text-anchor="middle" >末梢化学受容器：O₂↓など</text><rect x="300" y="236" width="240" height="64" rx="10" fill="#eaf4fc" stroke="#28a9c7" stroke-width="2"/><text x="420.0" y="265.0" font-size="17" fill="#0f6f86" font-weight="bold" text-anchor="middle" >大動脈小体</text><text x="420.0" y="283.0" font-size="13" fill="#142638" font-weight="normal" text-anchor="middle" >末梢化学受容器：O₂↓など</text><line x1="140" y1="234" x2="220" y2="202" stroke="#28a9c7" stroke-width="3" marker-end="url(#ah)"/><text x="120" y="222" font-size="15" fill="#0f6f86" font-weight="bold" text-anchor="end" >舌咽神経</text><line x1="420" y1="234" x2="340" y2="202" stroke="#28a9c7" stroke-width="3" marker-end="url(#ah)"/><text x="440" y="222" font-size="15" fill="#0f6f86" font-weight="bold" text-anchor="start" >迷走神経</text><line x1="280" y1="202" x2="280" y2="356" stroke="#cf2634" stroke-width="3" marker-end="url(#ahr)"/><rect x="120" y="360" width="320" height="56" rx="10" fill="#fff" stroke="#cf2634" stroke-width="2"/><text x="280.0" y="385.0" font-size="18" fill="#cf2634" font-weight="bold" text-anchor="middle" >呼吸筋</text><text x="280.0" y="404.0" font-size="14" fill="#142638" font-weight="normal" text-anchor="middle" >横隔膜・外肋間筋（吸気）</text><text x="20" y="452" font-size="17" fill="#073b6a" font-weight="bold" text-anchor="start" >CO₂が増える → 換気を増やして吐き出す</text></svg>