<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" width="560" height="500" role="img" aria-label="興奮収縮連関の流れとCa²⁺回収による弛緩の模式図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>興奮収縮連関の流れとCa²⁺回収による弛緩の模式図</title><rect width="560" height="500" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><rect x="20" y="14" width="340" height="52" rx="10" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2"/><text x="190.0" y="46.84" font-size="19" fill="#073b6a" font-weight="bold" text-anchor="middle" >運動神経からACh放出</text><line x1="190.0" y1="68" x2="190.0" y2="86" stroke="#607487" stroke-width="2.5" marker-end="url(#ah)"/><rect x="20" y="88" width="340" height="52" rx="10" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2"/><text x="190.0" y="120.84" font-size="19" fill="#073b6a" font-weight="bold" text-anchor="middle" >筋細胞膜に活動電位</text><line x1="190.0" y1="142" x2="190.0" y2="160" stroke="#607487" stroke-width="2.5" marker-end="url(#ah)"/><rect x="20" y="162" width="340" height="52" rx="10" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2"/><text x="190.0" y="194.84" font-size="19" fill="#073b6a" font-weight="bold" text-anchor="middle" >横行小管（T管）を伝わる</text><line x1="190.0" y1="216" x2="190.0" y2="234" stroke="#607487" stroke-width="2.5" marker-end="url(#ah)"/><rect x="20" y="236" width="340" height="52" rx="10" fill="#fdecee" stroke="#cf2634" stroke-width="2"/><text x="190.0" y="268.84" font-size="19" fill="#cf2634" font-weight="bold" text-anchor="middle" >筋小胞体からCa²⁺放出</text><line x1="190.0" y1="290" x2="190.0" y2="308" stroke="#607487" stroke-width="2.5" marker-end="url(#ah)"/><rect x="20" y="310" width="340" height="52" rx="10" fill="#fdecee" stroke="#cf2634" stroke-width="2"/><text x="190.0" y="342.84" font-size="19" fill="#cf2634" font-weight="bold" text-anchor="middle" >Ca²⁺がトロポニンに結合</text><line x1="190.0" y1="364" x2="190.0" y2="382" stroke="#607487" stroke-width="2.5" marker-end="url(#ah)"/><rect x="20" y="384" width="340" height="52" rx="10" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2"/><text x="190.0" y="416.84" font-size="19" fill="#073b6a" font-weight="bold" text-anchor="middle" >アクチンとミオシンが結合 → 収縮</text><polyline points="362.0,410.0 420.0,410.0 420.0,262.0 366.0,262.0" fill="none" stroke="#2e8b57" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahg)"/><rect x="430" y="272.0" width="118" height="150" rx="10" fill="#e5f5ec" stroke="#2e8b57" stroke-width="2" /><text x="489" y="302.0" font-size="20" fill="#2e8b57" font-weight="bold" text-anchor="middle" >弛緩</text><text x="489" y="334.0" font-size="15" fill="#142638" font-weight="normal" text-anchor="middle" >Ca²⁺ポンプが</text><text x="489" y="354.0" font-size="15" fill="#142638" font-weight="normal" text-anchor="middle" >ATPを使って</text><text x="489" y="374.0" font-size="15" fill="#142638" font-weight="normal" text-anchor="middle" >筋小胞体へ</text><text x="489" y="394.0" font-size="15" fill="#142638" font-weight="normal" text-anchor="middle" >回収</text><text x="24" y="470" font-size="18" fill="#2e8b57" font-weight="bold" text-anchor="start" >ATPは収縮にも弛緩（Ca²⁺の回収）にも必要</text></svg>