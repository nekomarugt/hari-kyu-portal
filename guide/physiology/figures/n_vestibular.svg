<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" role="img" aria-label="前庭器官（平衡感覚）と蝸牛（聴覚）" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>前庭器官（平衡感覚）と蝸牛（聴覚）</title><rect width="560" height="420" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12705f"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4531c"/></marker></defs><rect x="14" y="14" width="360" height="300" rx="14" fill="#fcf8ec" stroke="#e3d9bd" stroke-width="1.5"/><text x="194" y="38" font-size="13" fill="#6b8077" text-anchor="middle" font-weight="normal">内耳（模式図）</text><ellipse cx="130" cy="120" rx="90" ry="28" fill="none" stroke="#12705f" stroke-width="5"/><ellipse cx="130" cy="120" rx="28" ry="80" fill="none" stroke="#12705f" stroke-width="5" opacity="0.8"/><ellipse cx="130" cy="120" rx="64" ry="64" fill="none" stroke="#12705f" stroke-width="5" transform="rotate(45 130 120)" opacity="0.6"/><text x="130" y="216" font-size="13" fill="#0c4a40" text-anchor="middle" font-weight="bold">三半規管（3方向）</text><text x="130" y="234" font-size="12" fill="#17261f" text-anchor="middle" font-weight="normal">回転加速度（クプラ）</text><ellipse cx="270" cy="96" rx="44" ry="24" fill="#fbe9d9" stroke="#b4531c" stroke-width="3"/><text x="270" y="101" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">卵形嚢</text><line x1="236" y1="132" x2="304" y2="132" stroke="#b4531c" stroke-width="2.5" marker-start="url(#am)" marker-end="url(#am)"/><text x="270" y="150" font-size="11" fill="#17261f" text-anchor="middle" font-weight="normal">水平の直線加速度・傾き</text><ellipse cx="270" cy="206" rx="26" ry="38" fill="#fbe9d9" stroke="#b4531c" stroke-width="3"/><text x="270" y="211" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">球形嚢</text><line x1="300" y1="172" x2="300" y2="244" stroke="#b4531c" stroke-width="2.5" marker-start="url(#am)" marker-end="url(#am)"/><text x="308" y="200" font-size="11" fill="#17261f" text-anchor="start" font-weight="normal">上下の</text><text x="308" y="214" font-size="11" fill="#17261f" text-anchor="start" font-weight="normal">直線加速度</text><text x="270" y="62" font-size="13" fill="#b4531c" text-anchor="middle" font-weight="bold">耳石器（平衡斑・耳石）</text><rect x="14" y="322" width="360" height="44" rx="8" fill="#dff0e9" stroke="#12705f" stroke-width="2"/><text x="194.0" y="340.82" font-size="12" fill="#17261f" text-anchor="middle" font-weight="normal">前庭神経 → 前庭神経核（延髄・橋）→</text><text x="194.0" y="355.82" font-size="12" fill="#17261f" text-anchor="middle" font-weight="normal">小脳・脊髄・眼球運動核・視床</text><rect x="14" y="374" width="360" height="36" rx="8" fill="#ffffff" stroke="#12705f" stroke-width="2"/><text x="194.0" y="396.32" font-size="12" fill="#17261f" text-anchor="middle" font-weight="normal">反射：前庭動眼反射（視線を保つ）・前庭脊髄反射（姿勢）</text><rect x="396" y="14" width="150" height="112" rx="8" fill="#ffffff" stroke="#6b8077" stroke-width="2"/><text x="471.0" y="50.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">蝸牛</text><text x="471.0" y="66.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">コルチ器官</text><text x="471.0" y="82.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">＝聴覚</text><text x="471.0" y="98.68" font-size="13" fill="#17261f" text-anchor="middle" font-weight="normal">（平衡感覚ではない）</text><rect x="396" y="150" width="150" height="164" rx="8" fill="#ffffff" stroke="#12705f" stroke-width="2"/><text x="471.0" y="213.82" font-size="12" fill="#17261f" text-anchor="middle" font-weight="normal">有毛細胞が</text><text x="471.0" y="228.82" font-size="12" fill="#17261f" text-anchor="middle" font-weight="normal">傾くと興奮</text><text x="471.0" y="243.82" font-size="12" fill="#17261f" text-anchor="middle" font-weight="normal">（毛が動く向きで</text><text x="471.0" y="258.82" font-size="12" fill="#17261f" text-anchor="middle" font-weight="normal">興奮・抑制が決まる）</text></svg>