<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="560" height="440" role="img" aria-label="呼吸性・代謝性のアシドーシスとアルカローシスの整理図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>呼吸性・代謝性のアシドーシスとアルカローシスの整理図</title><rect width="560" height="440" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><text x="20" y="30" font-size="19" fill="#073b6a" font-weight="bold" text-anchor="start" >動脈血pH（正常 7.40±0.05）</text><rect x="30" y="62" width="500" height="22" rx="11" fill="#f4f6f8" stroke="#d8e4ee" stroke-width="2"/><rect x="200" y="62" width="160" height="22" rx="4" fill="#e5f5ec" stroke="#2e8b57" stroke-width="2" /><text x="280" y="79" font-size="15" fill="#2e8b57" font-weight="bold" text-anchor="middle" >正常</text><text x="200" y="106" font-size="16" fill="#142638" font-weight="normal" text-anchor="middle" >7.35</text><text x="280" y="106" font-size="16" fill="#142638" font-weight="normal" text-anchor="middle" >7.40</text><text x="360" y="106" font-size="16" fill="#142638" font-weight="normal" text-anchor="middle" >7.45</text><text x="30" y="106" font-size="16" fill="#cf2634" font-weight="bold" text-anchor="start" >← 酸性側</text><text x="530" y="106" font-size="16" fill="#0b5ea8" font-weight="bold" text-anchor="end" >アルカリ性側 →</text><text x="240.0" y="140" font-size="19" fill="#cf2634" font-weight="bold" text-anchor="middle" >アシドーシス</text><text x="440.0" y="140" font-size="19" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >アルカローシス</text><rect x="20" y="154" width="112" height="110" rx="10" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="2"/><text x="76.0" y="206.0" font-size="20" fill="#073b6a" font-weight="bold" text-anchor="middle" >呼吸性</text><text x="76.0" y="226.0" font-size="15" fill="#607487" font-weight="normal" text-anchor="middle" >CO₂が原因</text><rect x="140" y="154" width="192" height="110" rx="10" fill="#fdecee" stroke="#cf2634" stroke-width="2" /><text x="236.0" y="200" font-size="19" fill="#cf2634" font-weight="bold" text-anchor="middle" >換気↓で</text><text x="236.0" y="230" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >CO₂が増える</text><rect x="340" y="154" width="192" height="110" rx="10" fill="#e4effa" stroke="#0b5ea8" stroke-width="2" /><text x="436.0" y="200" font-size="19" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >換気↑で</text><text x="436.0" y="230" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >CO₂が減る</text><rect x="20" y="272" width="112" height="110" rx="10" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="2"/><text x="76.0" y="324.0" font-size="20" fill="#073b6a" font-weight="bold" text-anchor="middle" >代謝性</text><text x="76.0" y="344.0" font-size="15" fill="#607487" font-weight="normal" text-anchor="middle" >HCO₃⁻が原因</text><rect x="140" y="272" width="192" height="110" rx="10" fill="#fdecee" stroke="#cf2634" stroke-width="2" /><text x="236.0" y="318" font-size="19" fill="#cf2634" font-weight="bold" text-anchor="middle" >HCO₃⁻が減る</text><text x="236.0" y="348" font-size="14" fill="#607487" font-weight="normal" text-anchor="middle" >例：糖尿病性</text><text x="236.0" y="368" font-size="14" fill="#607487" font-weight="normal" text-anchor="middle" >ケトアシドーシス</text><rect x="340" y="272" width="192" height="110" rx="10" fill="#e4effa" stroke="#0b5ea8" stroke-width="2" /><text x="436.0" y="318" font-size="19" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >HCO₃⁻が増える</text><text x="20" y="424" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="start" >肺はCO₂、腎臓はH⁺とHCO₃⁻を調節してpHを保つ</text></svg>