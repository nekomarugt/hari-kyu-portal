<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="560" height="440" role="img" aria-label="インスリンとグルカゴンによる血糖調節の模式図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>インスリンとグルカゴンによる血糖調節の模式図</title><rect width="560" height="440" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><rect x="190" y="170" width="180" height="70" rx="35" fill="#fff" stroke="#073b6a" stroke-width="2.5" /><text x="280" y="213" font-size="22" fill="#073b6a" font-weight="bold" text-anchor="middle" >血糖値</text><rect x="20" y="20" width="250" height="56" rx="10" fill="#fdecee" stroke="#cf2634" stroke-width="2"/><text x="145.0" y="54.84" font-size="19" fill="#cf2634" font-weight="bold" text-anchor="middle" >食後：血糖↑</text><line x1="145" y1="78" x2="145" y2="102" stroke="#cf2634" stroke-width="2.5" marker-end="url(#ahr)"/><rect x="20" y="106" width="250" height="56" rx="10" fill="#fff" stroke="#cf2634" stroke-width="2"/><text x="145.0" y="131.0" font-size="19" fill="#cf2634" font-weight="bold" text-anchor="middle" >インスリン</text><text x="145.0" y="150.0" font-size="14" fill="#142638" font-weight="normal" text-anchor="middle" >膵島B細胞</text><text x="20" y="196" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >細胞へ取り込む</text><text x="20" y="217" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >グリコーゲン・脂肪</text><text x="20" y="238" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >として蓄える</text><polyline points="160.0,164.0 160.0,180.0 196.0,196.0" fill="none" stroke="#cf2634" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahr)"/><text x="150" y="268" font-size="20" fill="#cf2634" font-weight="bold" text-anchor="middle" >血糖↓</text><rect x="290" y="20" width="250" height="56" rx="10" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2"/><text x="415.0" y="54.84" font-size="19" fill="#073b6a" font-weight="bold" text-anchor="middle" >空腹時：血糖↓</text><line x1="415" y1="78" x2="415" y2="102" stroke="#0b5ea8" stroke-width="2.5" marker-end="url(#ahb)"/><rect x="290" y="106" width="250" height="56" rx="10" fill="#fff" stroke="#0b5ea8" stroke-width="2"/><text x="415.0" y="131.0" font-size="19" fill="#073b6a" font-weight="bold" text-anchor="middle" >グルカゴンなど</text><text x="415.0" y="150.0" font-size="14" fill="#142638" font-weight="normal" text-anchor="middle" >膵島A細胞</text><text x="400" y="196" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >肝グリコーゲン分解</text><text x="400" y="217" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >糖新生</text><polyline points="400.0,164.0 400.0,180.0 366.0,196.0" fill="none" stroke="#0b5ea8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahb)"/><text x="410" y="268" font-size="20" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >血糖↑</text><rect x="20" y="300" width="520" height="124" rx="10" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="2" /><text x="34" y="330" font-size="18" fill="#cf2634" font-weight="bold" text-anchor="start" >血糖を下げるホルモンはインスリンが代表</text><text x="34" y="360" font-size="16" fill="#142638" font-weight="normal" text-anchor="start" >上げる側：グルカゴン・アドレナリン・コルチゾールなど</text><text x="34" y="390" font-size="16" fill="#142638" font-weight="normal" text-anchor="start" >高すぎる血糖は尿細管の再吸収を超え、尿に糖が出る</text></svg>