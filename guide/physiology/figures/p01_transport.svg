"/><text x="418.0" y="336" font-size="11" fill="#cf2634" font-weight="bold" text-anchor="middle" >ポンプ</text><rect x="321.9" y="395" width="44.1" height="26" rx="13" fill="#cf2634"/><text x="344" y="413.4" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle" >ATP</text><line x1="368.0" y1="408" x2="462.0" y2="408" stroke="#cf2634" stroke-width="3" marker-end="url(#ahr)"/><text x="418.0" y="436" font-size="17" fill="#142638" font-weight="normal" text-anchor="middle" >濃度差に逆らって運ぶ</text><rect x="8" y="456" width="544" height="58" rx="10" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="2" /><text x="22" y="480" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="start" >ATPを直接使わない：拡散・浸透・ろ過</text><text x="22" y="504" font-size="18" fill="#cf2634" font-weight="bold" text-anchor="start" >ATPを使う：能動輸送（例：ナトリウムポンプ）</text></svg>