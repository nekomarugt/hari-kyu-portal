<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" width="560" height="470" role="img" aria-label="心周期の4つの時期と弁の開閉・心音の模式図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>心周期の4つの時期と弁の開閉・心音の模式図</title><rect width="560" height="470" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><text x="20" y="30" font-size="19" fill="#607487" font-weight="normal" text-anchor="start" >心室の1拍を4つの時期で見る</text><rect x="170.0" y="44.0" width="220" height="84" rx="12" fill="#fdecee" stroke="#cf2634" stroke-width="2" /><rect x="320.0" y="194.0" width="220" height="84" rx="12" fill="#fdecee" stroke="#cf2634" stroke-width="2" /><rect x="170.0" y="344.0" width="220" height="84" rx="12" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2" /><rect x="20.0" y="194.0" width="220" height="84" rx="12" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2" /><text x="280" y="72" font-size="18" fill="#cf2634" font-weight="bold" text-anchor="middle" >① 等容性収縮期</text><text x="280" y="96" font-size="16" fill="#142638" font-weight="bold" text-anchor="middle" >弁はすべて閉</text><text x="280" y="118" font-size="15" fill="#142638" font-weight="normal" text-anchor="middle" >内圧↑（容積一定）</text><text x="430" y="222" font-size="18" fill="#cf2634" font-weight="bold" text-anchor="middle" >② 駆出期</text><text x="430" y="246" font-size="16" fill="#142638" font-weight="bold" text-anchor="middle" >動脈弁が開く</text><text x="430" y="268" font-size="15" fill="#142638" font-weight="normal" text-anchor="middle" >血液を送り出す</text><text x="280" y="372" font-size="18" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >③ 等容性弛緩期</text><text x="280" y="396" font-size="16" fill="#142638" font-weight="bold" text-anchor="middle" >弁はすべて閉</text><text x="280" y="418" font-size="15" fill="#142638" font-weight="normal" text-anchor="middle" >内圧↓（容積一定）</text><text x="130" y="222" font-size="18" fill="#0b5ea8" font-weight="bold" text-anchor="middle" >④ 充満期</text><text x="130" y="246" font-size="16" fill="#142638" font-weight="bold" text-anchor="middle" >房室弁が開く</text><text x="130" y="268" font-size="15" fill="#142638" font-weight="normal" text-anchor="middle" >心室に血液が入る</text><path d="M392,86 Q430,96 430,190.0" fill="none" stroke="#607487" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M430,280.0 Q430,376 394,386" fill="none" stroke="#607487" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M168,386 Q130,376 130,282.0" fill="none" stroke="#607487" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M130,192.0 Q130,96 166,86" fill="none" stroke="#607487" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="79.0" y="99" width="50.0" height="26" rx="13" fill="#073b6a"/><text x="104" y="117.76" font-size="16" fill="#fff" font-weight="bold" text-anchor="middle" >Ⅰ音</text><text x="104" y="146" font-size="14" fill="#073b6a" font-weight="bold" text-anchor="middle" >房室弁が閉じる</text><rect x="431.0" y="347" width="50.0" height="26" rx="13" fill="#073b6a"/><text x="456" y="365.76" font-size="16" fill="#fff" font-weight="bold" text-anchor="middle" >Ⅱ音</text><text x="456" y="334" font-size="14" fill="#073b6a