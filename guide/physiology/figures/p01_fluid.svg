<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400" role="img" aria-label="体液の区分（細胞内液40％・組織間液15％・血漿5％）とイオン組成の模式図" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>体液の区分（細胞内液40％・組織間液15％・血漿5％）とイオン組成の模式図</title><rect width="560" height="400" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><text x="20" y="32" font-size="19" fill="#607487" font-weight="normal" text-anchor="start" >体重を100％とした内訳（成人）</text><rect x="20" y="92" width="208.0" height="58" rx="0" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2" /><text x="124.0" y="118" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="middle" >細胞内液</text><text x="124.0" y="140" font-size="17" fill="#073b6a" font-weight="bold" text-anchor="middle" >40％</text><rect x="228.0" y="92" width="78.0" height="58" rx="0" fill="#e2f5f9" stroke="#28a9c7" stroke-width="2" /><text x="267.0" y="118" font-size="18" fill="#0f6f86" font-weight="bold" text-anchor="middle" >組織間液</text><text x="267.0" y="140" font-size="17" fill="#0f6f86" font-weight="bold" text-anchor="middle" >15％</text><rect x="306.0" y="92" width="26.0" height="58" rx="0" fill="#fdecee" stroke="#cf2634" stroke-width="2" /><text x="319.0" y="130" font-size="16" fill="#cf2634" font-weight="bold" text-anchor="middle" >5</text><rect x="332.0" y="92" width="208.0" height="58" rx="0" fill="#f4f6f8" stroke="#9aa9b8" stroke-width="2" /><text x="436.0" y="118" font-size="18" fill="#607487" font-weight="bold" text-anchor="middle" >体液以外</text><text x="436.0" y="140" font-size="17" fill="#607487" font-weight="bold" text-anchor="middle" >約40％</text><line x1="319.0" y1="150" x2="319.0" y2="172" stroke="#cf2634" stroke-width="2"/><text x="325.0" y="170" font-size="16" fill="#cf2634" font-weight="bold" text-anchor="start" >血漿 5％</text><polyline points="20.0,84.0 20.0,74.0 332.0,74.0 332.0,84.0" fill="none" stroke="#073b6a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="176.0" y="66" font-size="19" fill="#073b6a" font-weight="bold" text-anchor="middle" >体液 約60％</text><polyline points="228.0,186.0 228.0,196.0 332.0,196.0 332.0,186.0" fill="none" stroke="#0f6f86" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="280.0" y="218" font-size="19" fill="#0f6f86" font-weight="bold" text-anchor="middle" >細胞外液 20％</text><rect x="20" y="250" width="256" height="124" rx="10" fill="#eaf4fc" stroke="#0b5ea8" stroke-width="2" /><text x="148" y="282" font-size="19" fill="#073b6a" font-weight="bold" text-anchor="middle" >細胞内液に多い</text><text x="40" y="322" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="start" >K⁺（カリウム）</text><text x="40" y="352" font-size="18" fill="#142638" font-weight="normal" text-anchor="start" >リン酸イオン・タンパク質</text><rect x="284" y="250" width="256" height="124" rx="10" fill="#e2f5f9" stroke="#28a9c7" stroke-width="2" /><text x="412" y="282" font-size="19" fill="#0f6f86" font-weight="bold" text-anchor="middle" >細胞外液に多い</text><text x="304" y="322" font-size="18" fill="#0f6f86" font-weight="bold" text-anchor="start" >Na⁺・Cl⁻</text><text x="304" y="352" font-size="18" fill="#142638" font-weight="normal" text-anchor="start" >（細胞を囲む内部環境）</text></svg>