<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="560" height="440" role="img" aria-label="血液の組成（血漿約55％・血球約45％）と血漿タンパク質の働き" font-family="'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif"><title>血液の組成（血漿約55％・血球約45％）と血漿タンパク質の働き</title><rect width="560" height="440" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607487"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2634"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5ea8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><text x="20" y="30" font-size="19" fill="#073b6a" font-weight="bold" text-anchor="start" >血液量は体重の約8％</text><path d="M40,54 L40,324 Q40,354 85.0,354 Q130,354 130,324 L130,54" fill="#fff" stroke="#9aa9b8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="42" y="64" width="86" height="155.0" fill="#fff4d6"/><rect x="42" y="219.0" width="86" height="6" fill="#ffffff" stroke="#9aa9b8" stroke-width="1"/><path d="M42,225.0 L42,324 Q42,352 85.0,352 Q128,352 128,324 L128,225.0 Z" fill="#e35d68" stroke="#cf2634" stroke-width="0" stroke-linejoin="round" stroke-linecap="round"/><text x="85.0" y="142.5" font-size="20" fill="#8a5c00" font-weight="bold" text-anchor="middle" >55％</text><text x="85.0" y="289.0" font-size="20" fill="#fff" font-weight="bold" text-anchor="middle" >45％</text><line x1="126" y1="136.5" x2="160" y2="136.5" stroke="#607487" stroke-width="1.8"/><circle cx="126" cy="136.5" r="3.5" fill="#607487"/><text x="168" y="143.5" font-size="20" fill="#8a5c00" font-weight="bold" text-anchor="start" >血漿</text><line x1="126" y1="222.0" x2="160" y2="231.0" stroke="#607487" stroke-width="1.8"/><circle cx="126" cy="222.0" r="3.5" fill="#607487"/><text x="168" y="237.0" font-size="15" fill="#607487" font-weight="normal" text-anchor="start" >白血球・血小板（薄い層）</text><line x1="126" y1="289.0" x2="160" y2="289.0" stroke="#607487" stroke-width="1.8"/><circle cx="126" cy="289.0" r="3.5" fill="#607487"/><text x="168" y="283.0" font-size="18" fill="#cf2634" font-weight="bold" text-anchor="start" >血球（ほとんど赤血球）</text><text x="168" y="307.0" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >骨髄の造血幹細胞から</text><rect x="262" y="44" width="278" height="172" rx="10" fill="#f3f8fc" stroke="#d8e4ee" stroke-width="2" /><text x="276" y="72" font-size="18" fill="#073b6a" font-weight="bold" text-anchor="start" >血漿タンパク質</text><text x="276" y="106" font-size="17" fill="#073b6a" font-weight="bold" text-anchor="start" >アルブミン</text><text x="526" y="106" font-size="16" fill="#142638" font-weight="normal" text-anchor="end" >膠質浸透圧</text><text x="276" y="144" font-size="17" fill="#073b6a" font-weight="bold" text-anchor="start" >グロブリン</text><text x="526" y="144" font-size="16" fill="#142638" font-weight="normal" text-anchor="end" >抗体・運搬</text><text x="276" y="182" font-size="17" fill="#cf2634" font-weight="bold" text-anchor="start" >フィブリノゲン</text><text x="526" y="182" font-size="16" fill="#142638" font-weight="normal" text-anchor="end" >血液凝固</text><rect x="20" y="372" width="520" height="58" rx="10" fill="#fdecee" stroke="#cf2634" stroke-width="2" /><text x="34" y="398" font-size="18" fill="#cf2634" font-weight="bold" text-anchor="start" >血清 ＝ 血漿 − フィブリノゲンなど凝固成分</text><text x="34" y="420" font-size="15" fill="#142638" font-weight="normal" text-anchor="start" >（血液を固まらせた後の上澄み）</text></svg>