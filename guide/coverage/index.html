  <body class="g-body" data-page="coverage">
    <a class="g-return" href="../">← 学習資料トップへ</a>
    <main class="g-shell">
      <header class="g-head">
        <img class="g-logo" src="../../icons/logo.svg" width="48" height="48" alt="" />
        <div>
          <p class="g-eyebrow">学習資料</p>
          <h1>出題基準との対応表</h1>
          <p class="g-sub">出題基準（2026年版）の中項目ごとに、学習資料の収録状況と足りない小項目を示します。</p>
        </div>
      </header>
      <section class="g-tools">
        <button class="g-toggle" data-subj="anatomy" aria-pressed="true" type="button">解剖学</button>
        <button class="g-toggle" data-subj="physiology" aria-pressed="false" type="button">生理学</button>
        <button class="g-toggle" data-f="all" aria-pressed="true" type="button">すべて</button>
        <button class="g-toggle" data-f="新規必要" aria-pressed="false" type="button">新規必要だけ</button>
      </section>
      <p class="g-legend"><strong>流用OK</strong>＝小項目の語がほぼ収録済み／<strong>手直し</strong>＝収録はあるが、小項目の語が足りない（または文章を直して収録）／<strong>新規必要</strong>＝この中項目の主な解説がない（準備中）。「うち新規作成」は、出題基準に合わせて新しく書き起こした項目の数です。判定は小項目名のキーワード照合による目安で、内容の正誤や深さを保証するものではありません。</p>
